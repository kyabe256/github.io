<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>鍵のない部屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kurenaido&display=swap">
<style>/* layout: one 1600x900 stage scaled to the window; FBI blue and police gold as the two accents on a near-black ground */
:root{--ink:#0a0c13;--panel:#121622;--panel2:#1b2131;--line:#2f3850;--fg:#eef0f5;--dim:#97a0b4;--gold:#e3b54a;--blue:#5a9bff;--red:#e5483d;--green:#58c98a;--paper:#f4efe2;--pink:#d96a8a;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;--f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--f-hand:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",cursive;--f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#fitbox{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;overflow:clip;background:#000;font-size:22px;box-shadow:0 0 0 1px #000,0 30px 80px #000a}
#stage *{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#world{position:absolute;inset:0;cursor:crosshair}
#bg{position:absolute;inset:0;width:1600px;height:900px;display:block}
#world.drift #bg{animation:drift 26s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1.012) translate(-6px,2px)}to{transform:scale(1.03) translate(8px,-4px)}}
#shade{position:absolute;inset:0;background:linear-gradient(#0000 30%,#05070ccc 100%),#05070c;opacity:0;transition:opacity .4s;pointer-events:none}#stage.talk #shade{opacity:.34}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}#fade.on{opacity:1}
#grain{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 45%,#0000 55%,#0008 100%)}
.bars{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;transition:height .5s cubic-bezier(.3,.8,.2,1);pointer-events:none}#bar-t{top:0}#bar-b{bottom:0}#stage.cine .bars{height:74px}
/* ambient animation used by the backgrounds */
.a-cloud{animation:cloud 70s linear infinite alternate}@keyframes cloud{to{transform:translateX(60px)}}
.a-slat{animation:slat 6s ease-in-out infinite}@keyframes slat{50%{opacity:.78}}
.a-spill{animation:spillk 8s ease-in-out infinite alternate}@keyframes spillk{to{opacity:.08}}
.a-scroll{animation:scy 9s linear infinite}@keyframes scy{to{transform:translateY(var(--sy))}}
.a-wave{animation:wvx 5s linear infinite}@keyframes wvx{to{transform:translateX(var(--sx))}}
.a-ping{animation:ping 2s infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.6);opacity:1}70%{transform:scale(1.8);opacity:.2}100%{transform:scale(.6);opacity:1}}
.a-blink{animation:blk 1.4s steps(1) infinite}@keyframes blk{50%{opacity:.12}}
.a-ring{animation:blk .42s steps(1) infinite}
.a-scan{animation:scan 3.6s linear infinite}@keyframes scan{to{transform:translateY(var(--sy))}}
.a-ledb{animation:ledb 2.6s ease-in-out infinite}@keyframes ledb{50%{opacity:.35}}
.a-sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 0}@keyframes sway{from{transform:skewY(-1.2deg)}to{transform:skewY(1.6deg) scaleX(.985)}}
.a-sway2{animation:sway2 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway2{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
.a-sway3{animation:sway3 3.4s ease-in-out infinite alternate}@keyframes sway3{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.a-curtain{animation:curt 7s ease-in-out infinite alternate}@keyframes curt{from{transform:skewX(-.8deg)}to{transform:skewX(1.4deg) scaleX(1.02)}}
.a-alarm{animation:blk .7s steps(1) infinite}
.a-drip{animation:drip 1.8s ease-in infinite;transform-box:fill-box}@keyframes drip{0%{transform:translateY(-34px);opacity:0}20%{opacity:1}100%{transform:translateY(8px);opacity:.9}}
.a-dust{animation:dustk 11s linear infinite}@keyframes dustk{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}100%{transform:translate(46px,-70px);opacity:0}}
.a-steam{animation:steam 2.6s ease-out infinite}@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.6}100%{transform:translateY(-14px);opacity:0}}
.a-sec{animation:sec 60s steps(60) infinite}@keyframes sec{to{transform:rotate(360deg)}}
.a-exit{animation:exitk 1.2s steps(1) infinite}@keyframes exitk{0%{opacity:1}58%{opacity:.12}66%{opacity:.8}72%{opacity:.1}100%{opacity:1}}
.vid.loop .a-exit{animation:none;opacity:1}
/* characters */
.eye-shut,.eye-smile,.m-open,.fx-sweat,.fx-anger{display:none}
.ch.blink .eye-open{display:none}.ch.blink .eye-shut{display:inline}
.ch.eyes-smile .eye-open,.ch.eyes-smile .eye-shut{display:none}.ch.eyes-smile .eye-smile{display:inline}
.ch.talk .m-open{display:inline}.ch.talk .m-shape{display:none}
.m-open{transform-box:fill-box;transform-origin:50% 20%}
.brow{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.ch-head,.ch-hairb{transform-origin:116px 206px}.ch-root{transform-box:view-box}
.ch[data-e="t"] .fx-sweat{display:inline;animation:sweat 1.1s infinite}.ch[data-e="a"] .fx-anger{display:inline;animation:pulse .45s infinite alternate;transform-box:fill-box;transform-origin:center}
.ch[data-e="d"] .iris{transform:translateY(2.5px)}.ch[data-e="t"] .iris{animation:dart 1.4s infinite}.ch[data-e="u"] .iris{transform:scale(.82);transform-box:fill-box;transform-origin:center}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}@keyframes pulse{to{transform:scale(1.3)}}@keyframes dart{0%,100%{transform:none}30%{transform:translateX(-2.5px)}65%{transform:translateX(2.5px)}}
#cast{position:absolute;inset:0;pointer-events:none;z-index:5}
.slot{position:absolute;bottom:-40px;width:500px;height:688px;margin-left:-250px;transition:left .45s cubic-bezier(.3,.8,.2,1),transform .3s,opacity .3s;transform-origin:50% 100%;filter:drop-shadow(var(--rimx,-4px) 0 0 var(--rim,#ffe6b855))}
.slot svg{width:100%;height:100%;overflow:visible;display:block}
.slot.p-left{left:400px}.slot.p-center{left:800px}.slot.p-right{left:1200px}.slot.p-foe{left:1090px}
.slot.dim{filter:brightness(.55) saturate(.75);transform:scale(.965)}
.slot.speaking{transform:scale(1.02)}
.slot-in{width:100%;height:100%;animation:enter .34s both;transform-origin:50% 100%}
@keyframes enter{from{transform:translateY(44px);opacity:0}}
.slot.out{opacity:0;transition:opacity .2s}
.slot-in.jump{animation:jump .45s}.slot-in.shake{animation:shake .5s}.slot-in.droop{animation:droop .7s both}.slot-in.shiver{animation:shiver .5s}.slot-in.hop{animation:hop .4s}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-26px) scale(1.03)}60%{transform:translateY(5px)}}@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-11px)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-12px) scale(1.04)}30%{transform:translateX(12px) scale(1.04)}45%{transform:translateX(-9px)}60%{transform:translateX(9px)}80%{transform:translateX(-4px)}}
@keyframes droop{to{transform:translateY(12px) rotate(1.5deg)}}@keyframes shiver{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
#stage.shake{animation:sshake .4s}@keyframes sshake{20%{transform:translate(calc(-50% - 10px),-50%) scale(var(--s))}40%{transform:translate(calc(-50% + 10px),calc(-50% + 4px)) scale(var(--s))}60%{transform:translate(calc(-50% - 6px),-50%) scale(var(--s))}80%{transform:translate(calc(-50% + 5px),-50%) scale(var(--s))}}
/* phone call window */
#tel{position:absolute;right:70px;top:120px;width:420px;height:300px;background:#0c1220;border:2px solid #3a5a8a;box-shadow:0 20px 50px #000a,0 0 0 6px #0c122066;z-index:6;overflow:hidden;animation:telin .3s both}@keyframes telin{from{transform:translateX(40px) scale(.94);opacity:0}}
#tel svg{position:absolute;left:10px;bottom:-190px;width:400px;height:550px}
#tel::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 3px,#0003 3px 4px);pointer-events:none}
#tel .tl{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;background:#0c1220e6;font-size:19px;font-weight:700;display:flex;justify-content:space-between;z-index:2}#tel .tl i{font-style:normal;color:var(--green);font-family:var(--f-mono);font-size:16px}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#place{background:linear-gradient(90deg,#0a0c13e6,#0a0c1399 80%,#0a0c1300);padding:10px 60px 10px 18px;border-left:5px solid var(--gold)}
#place b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:.06em}#place span{font-size:17px;color:var(--dim);letter-spacing:.12em}
#tools{display:flex;gap:10px}
.tb{background:#0a0c13d9;border:1px solid var(--line);padding:10px 18px;font-size:19px;font-weight:700;letter-spacing:.08em;min-width:96px;position:relative;transition:background .15s,border-color .15s}.tb:hover{background:#1b2131;border-color:var(--gold)}
.tb i{font-style:normal;color:var(--gold);margin-left:6px;font-family:var(--f-mono)}.tb.new::after{content:"";position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #0a0c13}
#bar{position:absolute;left:0;right:0;bottom:0;padding:20px 28px;display:flex;justify-content:space-between;align-items:flex-end;z-index:20;background:linear-gradient(#0000,#05070cd9);pointer-events:none}
#bar>*{pointer-events:auto}
#people{display:flex;gap:14px;align-items:flex-end}
.chip{width:120px;background:#0a0c13d9;border:1px solid var(--line);padding:0 0 6px;text-align:center;font-size:18px;font-weight:700;transition:transform .15s,border-color .15s;overflow:hidden}.chip:hover{transform:translateY(-6px);border-color:var(--gold)}
.chip svg{width:118px;height:112px;display:block;margin-bottom:2px;background:linear-gradient(#26304a,#141a2a)}.chip small{display:block;font-size:13px;color:var(--dim);font-weight:500}
#acts{display:flex;gap:12px}
.big{background:var(--gold);color:#1a1408;font-weight:900;font-size:24px;padding:14px 34px;letter-spacing:.14em;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:filter .15s,transform .15s}.big:hover{filter:brightness(1.12);transform:translateY(-2px)}
.big.alt{background:#0a0c13e6;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}.big.blue{background:var(--blue);color:#06101f}.big.red{background:var(--red);color:#fff}.big:disabled{filter:grayscale(1) brightness(.6);cursor:default;transform:none}
/* dialogue */
#dlg{position:absolute;left:0;right:0;bottom:0;height:262px;z-index:30;background:linear-gradient(#0000,#05070ce6 34%,#05070cf2);padding:56px 190px 0 190px;cursor:pointer}
#dlg .nm{position:absolute;left:176px;top:22px;display:flex;align-items:baseline;gap:14px;padding:6px 30px 6px 16px;background:var(--panel);border-left:6px solid var(--aff,var(--dim));clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
#dlg .nm b{font-family:var(--f-disp);font-size:31px;font-weight:800;letter-spacing:.08em}#dlg .nm span{font-size:16px;color:var(--dim)}
#dlg .tx{font-size:33px;line-height:1.62;font-weight:600;letter-spacing:.03em;text-shadow:0 2px 0 #000;min-height:160px;padding-top:22px}
#dlg.narr .tx{font-family:var(--f-disp);color:#dfe4ee;padding-top:4px}#dlg.narr .nm{display:none}
#dlg .nx{position:absolute;right:170px;bottom:26px;width:0;height:0;border:12px solid #0000;border-top-color:var(--gold);animation:nx .8s ease-in-out infinite alternate;opacity:0}#dlg.wait .nx{opacity:1}@keyframes nx{to{transform:translateY(8px)}}
#dlg .dt{position:absolute;right:28px;top:60px;display:flex;flex-direction:column;gap:8px}#dlg .dt button{font-size:15px;color:var(--dim);border:1px solid var(--line);padding:5px 12px;background:#0a0c13cc}#dlg .dt button.on{color:#1a1408;background:var(--gold);border-color:var(--gold)}
/* location card, toast, choice */
#card{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:#000c;animation:fadein .35s both;pointer-events:none}
#card div{text-align:center}#card b{display:block;font-family:var(--f-disp);font-size:58px;font-weight:800;letter-spacing:.16em}#card span{display:block;margin-top:14px;font-size:24px;color:var(--gold);letter-spacing:.3em}
#card i{display:block;width:0;height:2px;background:var(--gold);margin:18px auto 0;animation:rule .9s .2s both}@keyframes rule{to{width:520px}}
@keyframes fadein{from{opacity:0}}
#toasts{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0a0c13f2;border:1px solid var(--gold);padding:10px 26px;font-size:21px;font-weight:700;animation:toast 2.6s both;white-space:nowrap}.toast b{color:var(--gold);margin-right:10px}.toast.bad{border-color:var(--red)}.toast.bad b{color:var(--red)}
@keyframes toast{0%{transform:translateY(-14px);opacity:0}10%,82%{transform:none;opacity:1}100%{opacity:0}}
#choice{position:absolute;right:120px;top:50%;transform:translateY(-58%);z-index:45;display:flex;flex-direction:column;gap:12px;min-width:520px}
#choice h4{margin:0 0 4px;font-size:19px;color:var(--gold);letter-spacing:.2em;font-weight:700}
#choice button{background:#0a0c13f2;border:1px solid var(--line);border-left:6px solid var(--gold);padding:16px 26px;text-align:left;font-size:26px;font-weight:700;transition:transform .12s,background .12s;animation:chin .25s both}#choice button:hover{transform:translateX(-10px);background:var(--panel2)}
#choice button.sub{border-left-color:var(--dim);color:var(--dim);font-size:21px}#choice button.seen{color:var(--dim)}#choice button.hot{border-left-color:var(--red)}
@keyframes chin{from{transform:translateX(30px);opacity:0}}
.ripple{position:absolute;width:20px;height:20px;margin:-10px;border:2px solid #fff;border-radius:50%;pointer-events:none;animation:rip .5s both;z-index:7}@keyframes rip{to{transform:scale(3.4);opacity:0}}
.hintring{position:absolute;border:3px solid var(--gold);border-radius:50%;pointer-events:none;animation:hr 1s 2 both;z-index:7}@keyframes hr{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
#zoomout{position:absolute;left:28px;top:140px;z-index:21}
/* overlays */
.ov{position:absolute;inset:0;z-index:50;background:#070910f5;display:flex;flex-direction:column;animation:fadein .2s both}
.ov-h{display:flex;align-items:center;justify-content:space-between;padding:20px 30px 14px;border-bottom:1px solid var(--line)}
.ov-h h2{margin:0;font-family:var(--f-disp);font-size:34px;letter-spacing:.14em;font-weight:800}.ov-h h2 small{font-family:var(--f-ui);font-size:17px;color:var(--dim);margin-left:18px;letter-spacing:.06em;font-weight:500}
.ov-h .r{display:flex;gap:10px;align-items:center}
.x{border:1px solid var(--line);padding:9px 22px;font-size:20px;font-weight:700;background:var(--panel)}.x:hover{border-color:var(--gold)}
.tabs{display:flex;gap:4px}.tabs button{padding:9px 22px;font-size:20px;font-weight:700;color:var(--dim);border:1px solid var(--line);background:var(--panel)}.tabs button.on{color:#1a1408;background:var(--gold);border-color:var(--gold)}
.ov-b{flex:1;min-height:0;display:flex}
/* evidence inspector */
#ins .list{width:300px;overflow-y:auto;border-right:1px solid var(--line);padding:12px}
.evi{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;text-align:left;border:1px solid #0000;font-size:19px;font-weight:700;margin-bottom:4px;position:relative}.evi:hover{background:var(--panel)}.evi.on{background:var(--panel2);border-color:var(--gold)}
.evi u{text-decoration:none;flex:none;width:44px;height:52px;background:var(--paper);color:#23202a;display:grid;place-items:center;font-family:var(--f-disp);font-size:24px;font-weight:800;clip-path:polygon(0 0,74% 0,100% 20%,100% 100%,0 100%)}
.evi.new::after{content:"新";position:absolute;right:8px;top:8px;font-size:13px;background:var(--red);padding:1px 6px;font-weight:700}
#ins .view{flex:1;position:relative;overflow:hidden;background:radial-gradient(#232a3a,#0c0f18);cursor:grab;touch-action:none}#ins .view.drag{cursor:grabbing}
#ins .sheet{position:absolute;left:50%;top:40px;transform-origin:0 0}
#ins .flipper{transition:transform .5s;transform-style:preserve-3d}#ins .flipper.b{transform:rotateY(180deg)}

#ins .ctl{position:absolute;left:20px;bottom:20px;display:flex;gap:8px;z-index:3}#ins .ctl button{width:56px;height:56px;background:#0a0c13e6;border:1px solid var(--line);font-size:28px;font-weight:700}#ins .ctl button.w{width:auto;padding:0 20px;font-size:20px}#ins .ctl button:hover{border-color:var(--gold)}
#ins .zl{position:absolute;right:20px;bottom:24px;font-family:var(--f-mono);color:var(--dim);font-size:17px;z-index:3}

#ins .info h3{margin:0 0 6px;font-family:var(--f-disp);font-size:28px}#ins .info p{margin:0 0 14px;color:#cfd4e0}#ins .info h4{margin:18px 0 8px;font-size:16px;color:var(--gold);letter-spacing:.2em}
#ins .info .fc{border-left:4px solid var(--c);background:var(--panel);padding:8px 12px;margin-bottom:6px;font-weight:700;font-size:18px}#ins .info .nt{border-left:4px solid var(--dim);padding:6px 12px;margin-bottom:6px;font-size:17px;color:#cfd4e0}
.h{font-weight:inherit;cursor:inherit}.h.got{background:linear-gradient(#0000 62%,#e3b54a88 62%)}svg .h.got{outline:2px dashed #e3b54a;outline-offset:2px}
/* paper documents */
.paper{width:760px;background:var(--paper);color:#23202a;padding:44px 50px 50px;font-family:var(--f-disp);font-size:19px;line-height:1.75;position:relative}
.paper h3{margin:0 0 4px;font-size:27px;letter-spacing:.08em;border-bottom:3px double #23202a;padding-bottom:8px}.paper .sub{margin:6px 0 18px;font-size:15px;color:#55525e}
.paper.typed{font-family:var(--f-mono);font-size:16px}.paper.typed h3{font-family:var(--f-disp)}
.paper table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.paper table.t th{font-size:13px;text-align:left;border-bottom:2px solid #23202a;padding:4px 8px;letter-spacing:.1em}.paper table.t td{border-bottom:1px solid #23202a33;padding:7px 8px}
.paper table.f{width:100%;border-collapse:collapse;margin-bottom:16px}.paper table.f th{width:120px;text-align:left;vertical-align:top;font-size:15px;color:#55525e;padding:8px 10px;border:1px solid #23202a55;background:#23202a0d}.paper table.f td{padding:8px 12px;border:1px solid #23202a55}
.paper .fine{font-size:12px;color:#55525e;margin:16px 0 0}.paper .tiny{font-size:6.4px;line-height:1.7;font-family:var(--f-mono);color:#3a3844;letter-spacing:.02em}
.paper .stamp{position:absolute;right:54px;bottom:44px;margin:0;width:92px;height:92px;border:4px solid #c8382f;border-radius:50%;color:#c8382f;display:grid;place-items:center;font-weight:800;transform:rotate(-12deg);opacity:.8;font-size:17px}

const STORY_TXT = "# FILE 011 鍵のない部屋\n@char cole name=コール role=FBI東京駐在官 sex=m skin=#f2d2ba hair=#b89a5a hs=neat eye=#4a8ac2 es=cool tilt=-5 jaw=1 brow=2.6 fit=suit:#2a3350:#f4f7fb:#7a2a3a pin=1 pose=cross\n@char saegusa name=三枝 role=警察庁警備局_外事課の警部 sex=m skin=#eec8a6 hair=#23262e hs=slick eye=#5a6a5a es=cool tilt=-7 jaw=1 brow=2.8 gl=rect fit=suit:#3a3d44:#f4f7fb:#3a4a5a pose=stand\n@char mashiba name=真柴 role=警察庁の連絡調整官 sex=m skin=#f6d6bc hair=#4a3a30 hs=fresh eye=#7a6a4a es=soft tilt=5 jaw=0 brow=2.2 gl=round sm=1 fit=suit:#5a6a7a:#f4f7fb:#3a7a8a lan=1 pose=tablet\n@char kujo name=九条 role=警察庁警備局長 sex=m skin=#e8c0a0 hair=#5a5a60 hs=slick eye=#5a5a66 es=narrow tilt=-3 jaw=2 brow=3 wr=1 wide=1 fit=suit:#26282e:#f4f7fb:#4a2a2a pose=stand\n@char laila name=ライラ role=アッザームの娘。大学生 sex=f skin=#d9a882 hair=#2a1e1a hs=long eye=#8a5a2a es=round tilt=4 jaw=0 brow=2 blush=1 fit=coat:#6a7a9a:#f4f0e6 pose=stand\n@char kanrinin name=管理人 role=マンションの管理人 sex=m skin=#eec8a6 hair=#c4c4c4 hs=thin eye=#6a6a5a es=narrow tilt=5 jaw=1 brow=2.4 browc=#aaaaaa wr=1 fit=work:#5a7a5a:#fff:管理 pose=stand\n\n## op_1\n@bg soukan\n@bgm tension\n@card 6月7日（月）8:40｜霞が関　総監室\n@show yuki left\nyuki.u: 総監。電話が3本、同時に鳴っています。……どれも「至急」です。\n@tel onizuka\nonizuka.k: 鬼塚です。港区のマンションで、男が死んでます。浴室で頭を打って。……事故には見えません。殺しなら、一課です。\n@tel kujo\nkujo.k: 警備局の九条です。死んだのは、湾岸の国から亡命した記者、アッザーム。公安が保護していた男です。所管は、うちです。\n@tel cole\ncole.k: FBI東京駐在官のコールだ、長官。アッザームは、我々の協力者だった。この件は、FBIが引き取る。\n@tel off\nyuki.t: ……3つとも「うちの事件だ」と言っています。\n@show mashiba right\nmashiba.s: おはようございます、総監。連絡調整官の真柴です。FBIと警備局の間に立つのが、私の仕事でして。\nmashiba.n: 3者とも、引きませんよ。総監が現場に立てば、ひとまず全員が黙ります。……お供します。\n\n## op_2\ntsubasa.k: 全員、現場に集めてください。誰の事件かは、物が決めます。\nmashiba.s: 承知しました。車を回します。\n\n## sc_arrive\n@hide all\n@bg genkan\n@bgm invest\n@card 9:30｜港区　マンション12階　1204号室\n@show onizuka left\nonizuka.a: だから、FBIは一歩下がってくれ。ここは日本の現場だ。\n@show cole right\ncole.k: 被害者のパソコンと電話は、我々の資産だ。手を触れないでもらいたい。\n@show saegusa center\nsaegusa.k: 警備局の三枝です。亡命者の保護の記録は、公安の秘匿です。一課にも、FBIにも、出せません。\ntsubasa.k: 3人とも、聞いてください。記録は全部、私の机に出してもらいます。FBI長官として。警察庁長官として。\nonizuka.s: ……便利な肩書きですな。\n@hide all\n@show laila center\nlaila.d: 父を見つけたのは、私です。電話に出ないので、合鍵のアプリで開けたら……浴室で。\nlaila.d: 父は、用心深い人でした。夜は必ず、自分で鍵を確かめていました。\n@hide all\n*: 現場検証を始める。気になる所を、直接押して調べる。印は出ない。\n*: 手に入れた物は「証拠」で拡大し、裏返し、細かい字まで読む。気づいた事は「事実カード」になる。\n*: 「ボード」で事実カードを糸でつなぐと、仮説が生まれる。仮説は、尋問で突きつけられる。\n\n## s_lock\n*: 玄関の内側。キーストン社のスマートロック。暗証番号の板と、小さな青い灯り。こじ開けた跡は、どこにもない。\n@show furukawa left\nfurukawa.n: 科捜研の古川。……外しますよ。本体は、裏まで見てください。錠前ってのは、裏に本音が書いてある。\n@hide furukawa\n@get lock\n\n## s_door_chain\n*: 内側のチェーンは、かかっていなかった。ライラの話では、父はチェーンを使わない。「火事の時に逃げ遅れる」と言って。\n\n## s_shoes\n*: 靴は1足。きちんとそろえてある。争った跡は、玄関にはない。\n\n## s_phone\n*: 居間の充電台に、スマホ。画面は割れていない。アラームが、朝6時から鳴り続けていた。\n@show chihaya left\nchihaya.k: ロックは、娘さんが番号を知ってました。中身、写します。……総監、読むのは総監の目でお願いします。\n@hide chihaya\n@get phone\n\n## s_desk\n*: 机の上に、ノートパソコンの電源コードだけ。本体は、ない。……ほこりの跡が、四角く残っている。\n\n## s_board\n*: 台所の水切りかご。皿もコップも、乾いている。……大理石のまな板だけが、濡れている。裏に、水がたまっている。\n@fact f_board\n\n## s_cup\n*: 流しに、コップが1つ。ミントの葉が、底に張りついている。夜のお茶は、1人ぶんだ。\n\n## s_tub\n*: 浴槽の縁。丸みのある、白い樹脂。……血は、ここについている。だが、量が少ない。\n@show kiryu left\nkiryu.n: 傷の形は、解剖で見ます。あす、所見を出します。\n@hide kiryu\n\n## s_floor\n*: 浴室の床は、乾いている。足を滑らせたにしては、せっけんも、水も、落ちていない。\n\n## s_towel\n*: バスタオルは、たたんだまま、棚にある。入浴の用意を、していない。\n\n## s_cam\n*: 廊下の天井に、丸いカメラ。新しい。横に小さなシール。「NPA　5/17　増設」。\n@show mashiba left\nmashiba.n: 警察庁が足したカメラです。アッザームさんがここへ越した日に。……手配したのは、私です。\n@hide mashiba\n\n## s_lamp\n*: 非常口の緑の灯り。切れかけて、点滅している。数えると、およそ1.2秒ごと。\n\n## s_elev\n*: エレベーターは1基。かごの中にも、カメラがある。廊下の物とは、会社がちがう。\n\n## k_rec\n*: 管理人室の録画機。廊下のカメラの映像は、ここに7日ぶん残る。\n@get video\n@get loginlog\n\n## k_shelf\n*: 棚に、書類のとじこみ。エレベーターの運転記録。工事の届出。となりの駐車場の入出庫の控え。\n@get elev\n@get form\n@get parking\n\n## k_monitor\n*: エレベーターのかごの中の映像は、エレベーターの会社の機械に入っている。夜中の分を、1枚、出してもらった。\n@get elcam\n\n## t_kanri_1\nkanrinin.n: ゆうべは、23時に寝ました。補聴器は、夜は外して充電します。何も、聞いとりません。\nkanrinin.n: 録画機には、わしの番号でしか入れんはずです。……いや、5月に警察の人が、番号を足していったな。\n\n## t_kanri_2\nkanrinin.n: となりのコインパーキングも、うちの会社の持ち物です。夜中は、ほとんど空ですよ。\nkanrinin.n: ゆうべは、珍しく何台か入っとりましたな。控えに残っとります。\n\n## t_laila_1\nlaila.d: この部屋は、3週間前に越してきたばかりです。前の部屋は、誰かに見張られている気がすると、父が。\nlaila.n: 用意してくれたのは、警察の真柴さんです。親切な方で。住所を知っているのは、真柴さんと、警備局の三枝さんと、FBIのコールさんと、私だけだと。\n@fact f_addr\n\n## t_laila_2\nlaila.d: 父は、何かを誰かに渡す約束を、していました。「月曜が過ぎれば、もう隠れなくていい」と。\nlaila.d: きょうが、その月曜です。\n\n## t_oni_1\nonizuka.n: 大使館は、もう「事故だ」と言ってきてます。早すぎる。まだ発表もしてないのに。\nonizuka.k: 総監。FBIも公安も、腹に何か持ってる。一課は、物だけ見ます。\n\n## t_mashiba_1\nmashiba.n: コールさんは、ゆうべは本部との会議だったそうです。2時から2時40分まで、と。\nmashiba.s: 念のため、記録を取り寄せておきました。……こういう時は、まず味方を疑っておくと、あとが楽ですから。\n@get conf\n\n## t_mashiba_2\nmashiba.n: 三枝さんは当直でした。庁舎のゲートの記録は、総監のお名前で、すぐ出せます。\n@get gate\n\n## ev2\n@hide all\n@bg soukan\n@bgm calm\n@card 6月8日（火）9:00｜霞が関　総監室\n@show yuki left\nyuki.n: 総監、届いた物を並べます。科捜研から解剖の所見。キーストン社のクラウドから、錠の記録と、電池の電圧の記録。\n@get autopsy\n@get locklog\n@get volt\nyuki.n: それと、きのうの夜中に真柴さんから届いていたメール。未読のままでしたので、印刷しました。\n@get mail\n@show chihaya right\nchihaya.d: 総監。……すみません、私です。キーストン社のサポートに電話して、「錠に隠れた機能はありますか」って、聞いちゃいました。\nchihaya.t: 「ございません」って言われました。……そのあと、全国の錠に、急ぎの更新が配られてます。\ntsubasa.s: すぐ言ってくれて、助かります。……相手が何かを隠した時刻が、残りました。\n@hide all\n@tel kujo\nkujo.k: 総監。九条です。1つ、申し上げておきます。\nkujo.k: あなたは、FBIの長でもある。FBIの協力者が死んだ事件を、FBIの長が裁く。……世間は、それを公正とは呼びません。\nkujo.n: 48時間です。それで筋が通らなければ、警備局はこの件を、国家公安委員会に上げます。\n@tel off\ntsubasa.k: 48時間あれば、足ります。物は、どちらの味方もしません。\n@hide all\n*: 行ける場所が増えた。FBI駐在官室、警備局、科捜研、サイバー課。現場にも、いつでも戻れる。\n*: 尋問は、準備ができたと思った時に始める。途中で退いて、出直す事もできる。\n\n## t_sawa_car\nsawaguchi.n: 総監、駐車場の控えのナンバー、照会しました。「品川330 す 41-07」は、FBIのコール駐在官のリース車です。\nsawaguchi.k: 首都高の料金所の記録も出ました。同じ車が、ゆうべ2時34分に、芝公園の入口を通ってます。\n@fact f_etc\nsawaguchi.n: もう1台。「足立500 は 12-88」。……登録は、警察庁です。警備局の車ですね。\n@fact f_scar\nsawaguchi.t: 「外」で始まる1台は、外交官の車です。外務省に聞かないと、持ち主は出ません。返事は、あすになります。\n\n## t_sawa_ip\nsawaguchi.n: 録画機の接続元、203.0.113.77。使い捨ての回線です。持ち主は、たどれません。\nsawaguchi.k: ただ、同じ番号を、もう1か所で見た気がするんです。……総監の机の上の、どれかに。\n\n## t_kiryu\nkiryu.n: 亡くなったのは、2時から2時半の間。頭の傷は1か所。平たくて硬い物が、面で当たっています。\nkiryu.k: 浴槽の縁は丸い。あの丸みでは、この形の傷は、できません。\n\n## t_furu\nfurukawa.n: 回数計ってのは、機械仕掛けです。電気の記録とちがって、嘘がつけない。\nfurukawa.k: 裏の小窓、見ましたか。見てないなら、もう1度。\n\n## a_intro\n@hide all\n@bg fbi\n@bgm tension\n@card FBI東京駐在官室\n@show cole center\ncole.k: 長官。あなたはFBIの長だ。なら、分かるはずだ。協力者の件は、FBIの中で片づける。\ncole.n: 聞きたい事があるなら、どうぞ。隠す事は、何もない。\n\n## a_s1\ncole.n: アッザームは、我々の協力者だ。事件は、FBIが引き取る。\n## a_s2\ncole.n: 昨夜は、ワシントンとの会議に出ていた。日本時間の2時から、2時40分までだ。\n## a_s3\ncole.n: 会議のあとは、朝まで自宅にいた。\n## a_s4\ncole.n: アッザームとは、この1週間、連絡を取っていない。\n\n## a_p1\ncole.n: 協力者の名簿は、FBIの中でも、数人しか見られない。日本の警察に見せる物ではない。\n## a_p2\ncole.n: 記録なら、本部にある。好きに取り寄せたまえ。……時刻は、向こうの書き方だがね。\n## a_p3\ncole.t: 自宅だ。証人は、いない。1人で暮らしている。\n## a_p4\ncole.n: 用心のためだ。接触は、少ないほどいい。\n\n## a_o2\ntsubasa.k: 本部の記録では、あなたの参加は16時58分から17時21分。協定世界時です。\ntsubasa.k: 日本時間に直すと、1時58分から2時21分。2時40分までは、出ていません。\ncole.u: ……19分の、ずれか。\n## a_o3\ntsubasa.k: あなたの車は、2時34分に首都高に入っています。2時52分、現場のとなりの駐車場に入り、3時5分に出た。\ntsubasa.k: 朝まで自宅に、いませんでした。\ncole.t: ……。\n## a_o4\ntsubasa.k: 1時58分。アッザームさんは「N.C.」あてに書いています。「錠が、ひとりでに青く光った。2度」。\ntsubasa.k: ネイサン・コール。あなたです。\ncole.d: ……会議中だった。気づいたのは、2時21分だ。\n\n## a_miss\ncole.n: 長官。それは、いまの話の反証にならない。\n## a_miss2\ncole.k: FBIを、物で黙らせたいなら、物を間違えないでもらいたい。\n\n## a_end\n@bgm truth\ncole.d: ……認めよう。アッザームは、日本側に届けずに使っていた協力者だ。規則違反だ。\ncole.n: 彼は、キーストン社の錠の「隠れた入口」が、湾岸の国に売られた証拠を持っていた。月曜の10時に、パソコンごと受け取る約束だった。\ncole.d: 2時55分に、扉の前に立った。呼び鈴に、返事がなかった。寝ているのだと、思おうとした。……警察を呼べば、無届けの作戦がばれる。私は、帰った。\ncole.k: 引き渡しの時刻を知っていたのは、私と、場所を手配した連絡調整官の真柴だけだ。\n@fact f_sched\n\n## b_intro\n@hide all\n@bg keibi\n@bgm tension\n@card 警察庁　警備局の一室\n@show saegusa center\nsaegusa.k: 総監。規則ですので、先に申し上げます。公安の記録は、長官の命令でも、理由の紙が要ります。\nsaegusa.n: 伺える事は、伺います。\n\n## b_s1\nsaegusa.n: アッザームの保護は、公安の所管です。FBIにも、一課にも、渡せません。\n## b_s2\nsaegusa.n: 昨夜は当直でした。一晩中、庁舎の席にいました。\n## b_s3\nsaegusa.t: ……外の空気を吸いに、出ただけです。現場の方角には、行っていません。\n## b_s4\nsaegusa.k: 内通者は、コールです。夜中に、あの部屋の前に立っていた。私が、この目で見ました。\n\n## b_p1\nsaegusa.n: 住所を知る者は、4人に絞ってありました。漏れるはずが、なかった。\n## b_p2\nsaegusa.n: 当直の日誌に、私の名前があります。ご覧になりますか。\n## b_p3\nsaegusa.t: ……車は、使いました。眠気ざましに、少し走っただけです。\n## b_p4\nsaegusa.k: 2時55分です。呼び鈴を押して、扉に耳を当てていた。あれが、仕上げを確かめる動きでなくて、何です。\n\n## b_o2\ntsubasa.k: 庁舎のゲートの記録です。あなたは1時31分に出て、3時12分に戻っています。\ntsubasa.k: 一晩中、席には、いませんでした。\nsaegusa.t: ……。\n## b_o3\ntsubasa.k: 現場のとなりの駐車場に、2時50分から3時6分まで、警備局の車が入っています。\ntsubasa.k: 現場の方角に、行っています。\nsaegusa.d: ……コールを、見張っていました。FBIが、うちに黙って何かを動かしている。その証拠が、欲しかった。\n@get note\n## b_o4\ntsubasa.k: 犯人が12階にいたのは、2時11分から2時26分です。コールさんが着いたのは、2時52分。\ntsubasa.k: あなたが見たのは、「終わったあとに来た男」です。\nsaegusa.u: ……終わった、あと。\n\n## b_miss\nsaegusa.n: 総監。それは、私の申し上げた事と、食いちがいません。\n## b_miss2\nsaegusa.k: 公安は、推測では動きません。物をお願いします。\n\n## b_end\n@bgm truth\nsaegusa.d: ……私のメモが、あの男の潔白を、証明するわけですか。\nsaegusa.n: 同盟国の駐在官を、無断で見張りました。処分は、受けます。……ただ、総監。\nsaegusa.k: 私は、月曜の引き渡しを知りませんでした。知っていれば、部屋の前に人を置いた。あの夜を選んだ者は、予定を知っていた者です。\n\n## mid\n@hide all\n@bg soukan\n@bgm calm\n@card 6月9日（水）10:00｜霞が関　総監室\n@show yuki left\nyuki.n: 総監。外務省から、外交団の車両の台帳が届きました。それと、真柴さんは、けさから外出です。「兄の付き添いで病院へ」と。\n@get carlist\nyuki.n: 連絡調整室の鍵は、長官の権限で開けられます。……官の机ですから。\n@hide all\n@show cole left\ncole.k: 長官。三枝警部が、私を見張っていたそうだな。同盟国の駐在官を。\n@show saegusa right\nsaegusa.k: 届けのない協力者を動かしていたのは、どちらですか。\ncole.a: 君たちが住所を守れていれば、彼は生きていた！\nsaegusa.a: あなたが予定を1人で抱えなければ、部屋の前に人を置けた！\ntsubasa.k: 2人とも、そこまでです。\ntsubasa.k: FBIと警備局が責め合っている間、得をする者がいます。……その人は、いま、この部屋にいません。\ncole.u: ……。\nsaegusa.t: ……。\n@hide all\n*: 連絡調整室に行けるようになった。結論が出たら、総監室の机で「推理レポート」を書く。\n\n## r_desk\n*: 真柴の机。きちんと片づいている。いちばん上の引き出しに、名刺と、折りたたんだ紙が1枚。\n@get slip\n\n## r_news\n*: 机の横の新聞。6月6日の朝刊。2面の記事に、赤いペンで丸がついている。\n@get news\n\n## r_photo\n*: 写真立て。真柴と、よく似た年上の男。うしろは、どこかの港。\n\n## r_cal\n*: 卓上の暦。5月14日と28日に、小さく「大使館」。6月6日に、大きな丸。「成田　7:40」。\n\n## rep_intro\n@hide all\n@bg soukan\n@bgm truth\n*: 推理レポートを書く。実行犯。内通者。指示役。手口。動機。それぞれに、根拠のカードを添える。\n*: 筋が通っているかどうかで、結末が変わる。\n\n## bad_cole\n@bg soukan\n@bgm tension\n@show cole center\ncole.k: 私が、内通者だと。……長官、その結論は、FBIの東京駐在を終わらせる。\ncole.d: 私は規則を破った。だが、協力者を売ってはいない。\n@show mashiba right\nmashiba.n: 残念です、総監。……あとの調整は、私にお任せください。\n@hide all\n*: FBIは、東京の駐在官を引き上げた。両国の合同捜査は、止まった。\n*: 連絡調整室の灯りは、その夜も、遅くまでついていた。\n\n## bad_saegusa\n@bg soukan\n@bgm tension\n@show saegusa center\nsaegusa.k: 私が、内通者。……総監。公安は、推測では動かないと、申し上げたはずです。\nsaegusa.d: 処分は受けます。ですが、月曜の予定を、私は知らなかった。\n@show mashiba right\nmashiba.n: 残念です、総監。……警備局との調整は、私にお任せください。\n@hide all\n*: 警備局は、総監への報告を、紙1枚に減らした。\n*: 連絡調整室の灯りは、その夜も、遅くまでついていた。\n\n## bad_other\n@bg soukan\n@bgm tension\n@show onizuka center\nonizuka.t: 総監。……その結論では、検事が首を縦に振りません。物と、合わない。\n@show mashiba right\nmashiba.n: 残念です。……もう1度、最初から洗い直しましょうか。私も、手伝います。\n@hide all\n*: 捜査は、振り出しに戻った。大使館は、もう1度「事故だ」と言った。\n\n## c_intro\n@hide all\n@bg renraku\n@bgm tension\n@card 6月9日（水）16:00｜警察庁　連絡調整室\n@show mashiba center\nmashiba.s: 総監。お呼びだと聞いて、戻りました。兄の検査は、もう済みましたので。\nmashiba.n: ……机を、ご覧になったんですね。かまいません。官の机ですから。\n\n## c_s1\nmashiba.n: 私は、連絡調整官です。両方の間に、立っていただけです。\n## c_s2\nmashiba.n: あの夜は庁舎で、総監への資料を作っていました。2時15分に、お送りしたはずです。\n## c_s3\nmashiba.t: ……家で仕上げて、時刻を決めて送っただけです。事件とは、関係がありません。\n## c_s4\nmashiba.n: 回線が同じでも、私とは限らない。あのアカウントの表は、三枝さんも持っています。住所も、ご存じだ。\n## c_s5\nmashiba.n: 大使館へは、兄の件で、領事に相談に行っただけです。\n## c_s6\nmashiba.t: 兄が帰れたのは、外務省のおかげです。私は、何も渡していません。\n\n## c_p1\nmashiba.s: FBIは警備局を信じない。警備局はFBIを信じない。……間に立つ人間が、要るんです。\n## c_p2\nmashiba.n: 夜中まで働くのは、珍しくありません。総監も、ご存じでしょう。\n## c_p3\nmashiba.t: 夜中に起きて働いているように、見せたかった。……見栄です。\n## c_p4\nmashiba.n: 表は、設置の届の裏に書きました。届は、管理人室にも、警備局にも写しがあります。\n## c_p5\nmashiba.n: 5月の14日と、28日です。兄は8か月、向こうで拘束されていましたから。\n## c_p6\nmashiba.t: ……偶然です。釈放の日取りは、向こうが決めた事です。\n\n## c_o2\ntsubasa.k: あなたは22時5分に庁舎を出て、朝7時28分まで戻っていません。2時15分に、庁舎にはいなかった。\ntsubasa.k: メールは、前の晩の21時52分に仕込んだ物です。……2時15分に何が起きるかを、あなたは前もって知っていた。\nmashiba.t: ……。\n## c_o3\ntsubasa.k: メールを仕込んだ回線は、203.0.113.77。2時7分に、廊下の録画機へ入った回線と、同じです。\ntsubasa.k: 映像を差し替えたのは、あなたの端末です。事件と、関係があります。\nmashiba.u: ……。\n## c_o4\ntsubasa.k: 三枝さんは、住所とアカウントを持っている。でも、月曜の引き渡しを知らなかった。\ntsubasa.k: コールさんは、住所と予定を知っている。でも、アカウントがない。……3つを全部持っているのは、あなただけです。\nmashiba.t: ……。\n## c_o5\ntsubasa.k: 5月28日の面会票です。面会先は、領事ではありません。「警備担当官　K.ハリド」。\nmashiba.d: ……。\n## c_o6\ntsubasa.k: 5月28日、ハリドに会う。6月5日、兄が釈放される。6月7日、アッザームさんが死ぬ。\ntsubasa.k: 偶然では、ありません。あなたは、兄と引き換えに、住所と、時刻と、カメラを渡した。\n\n## c_miss\nmashiba.s: 総監。お疲れのようです。……それは、私の話と、ぶつかりません。\n## c_miss2\nmashiba.n: 根拠が、ちがうようです。もう1度、整理なさっては。\n\n## c_end\n@bgm truth\nmashiba.d: ……8か月です。兄は、何もしていない。商談に行っただけだ。\nmashiba.d: 外務省は「申し入れた」と言うばかりでした。FBIも、警備局も、自分の協力者の事しか見ていなかった。\nmashiba.d: ハリドは言いました。「住所と、夜の時刻。それだけでいい。話をするだけだ」と。……信じたかったんです。\nmashiba.n: 総監。間に立つというのは、どちらからも見えない場所に立つ事です。……そこからは、何でも渡せてしまう。\n\n## c_calm\ntsubasa.k: あなたのお兄さんは、帰ってきました。ライラさんのお父さんは、帰ってきません。\ntsubasa.k: その2つを、法廷で、ご自分の口で言ってください。\n## c_angry\n@sfx shock\ntsubasa.a: 「話をするだけ」で、夜中の2時に、カメラを止める必要があるか！\ntsubasa.a: あなたは分かっていた。分かっていて、映像を22分、差し替えたんだ！\n*: 真柴は、眼鏡を外して、机に置いた。\n\n## end_true\n@hide all\n@bg soukan\n@bgm calm\n@card 6月10日（木）9:00｜霞が関　総監室\n@show cole left\ncole.n: 長官。協力者の件は、きょうから、全部を日本側に届ける。……遅すぎたが。\n@show saegusa right\nsaegusa.n: 警備局も、保護の記録を、FBIと分けます。……コール駐在官。あの夜は、失礼しました。\ncole.s: 見張られて、命拾いをしたのは初めてだ。\n@hide all\n@show onizuka center\nonizuka.k: 総監。実行役の2人は、きのうの朝の便で、国に帰ってます。ハリドは外交官だ。日本では、手錠をかけられません。\nonizuka.n: ……それでも、物は残りました。錠の裏の数字と、濡れたまな板と。いつか、使えます。\n@hide all\n@show laila center\nlaila.d: 父のパソコンは、まだ見つかっていません。……でも、父が何を渡そうとしていたかは、分かりました。\nlaila.n: ありがとうございました。私は、隠れません。大学に、戻ります。\n@hide all\n@bgm tension\n*: 錠には、会社の記録にも残らない入口がある。世界で1000万戸。日本のマンションの3割。\n*: それを売った者は、まだ、名前さえ出ていない。\n\n## leave_d1\n*: 現場を離れ、霞が関へ戻る。……現場には、あとでまた来られる。\n\n## s_rack\n*: 皿が3枚と、コップが1つ。どれも、からからに乾いている。きのうの夕食の物だろう。\n## s_cork\n*: 壁の板に、切り抜きが留めてある。「スマートロック　世界で1000万戸」「湾岸の国、記者を国外で拘束」。赤い糸で結んである。\n## s_sofa\n*: ソファに、たたんだ毛布。乱れはない。争った跡は、ここにもない。\n## s_rug\n*: 敷物の端が、少しめくれている。台所から、浴室の方へ。重い物を、引きずったように。\n## s_window\n*: 窓は、内側から鍵がかかっている。12階。外に足場はない。\n## s_kettle\n*: やかんは、空だ。ミントの茶を1杯いれて、それきり。\n## s_gshelf\n*: 靴箱の上に、鍵の皿。……鍵は、ない。この部屋は、錠の暗証番号とアプリだけで開く。\n## s_door\n*: 扉の郵便受けは、内側から板でふさいである。のぞき穴にも、ふたがしてある。用心深い人だ。\n## s_bwin\n*: 浴室の小窓は、はめ殺し。開かない。\n## s_mirror\n*: 鏡は、曇っていない。湯を使った跡が、ない。\n## s_drain\n*: 排水口は、乾いている。髪の毛が、数本。\n## s_ext\n*: 消火器の箱。封は、切られていない。\n## s_1204\n*: 1204号室の扉。外側にも、傷はない。呼び鈴は、扉の右にある。\n## k_keys\n*: 合鍵の板。1204の所は、空だ。「電子錠につき鍵なし」と、札が下がっている。\n## k_aid\n*: 補聴器の充電器。緑の灯りがついている。夜は、ここに置くのだろう。\n## f_clocks\n*: 時計が3つ。ワシントン、協定世界時、東京。……本部の記録は、どの時計で書かれるのだろう。\n## f_seal\n*: 駐在官室の紋章。ここは大使館の中だ。日本の警察は、許しなく入れない。……長官である自分を、のぞいて。\n## kb_cab\n*: 書類の棚には、全部、鍵がかかっている。「秘」の札。\n## kb_win\n*: 窓の日よけは、半分おりている。外からは、中が見えない。\n## ks_tray\n*: 外した錠が、灯りの下に置いてある。まだ、青い灯りが点いている。\n## r_shelf\n*: とじこみの背に、3つの札。FBI。警備局。一課。……3つの組織の書類が、この1部屋を通る。\n\n## h_weapon\ntsubasa.k: 濡れたまな板と、傷の中の大理石。……殴られたのは、台所だ。浴室へは、運ばれた。\n## h_ghost\ntsubasa.k: 裏の回数計は214。記録は212。……記録に残らない開け閉めが、2回ある。\n## h_time\ntsubasa.k: 記録にない電圧の谷が、2つ。2時13分に開いて、2時24分に閉まった。\n## h_loop\ntsubasa.k: 誰かが12階へ上がった時刻に、廊下には誰もいない。灯りも、点滅していない。……映像は、偽物だ。\n## h_window\ntsubasa.k: 帽子の2人組。2時11分に上がり、2時26分に降りた。部屋にいたのは、その間だけ。\n## h_conf\ntsubasa.k: 16時58分に、9時間を足す。……コールさんが会議にいたのは、日本時間の1時58分から2時21分。\n## h_coleLate\ntsubasa.k: 2時34分に首都高。2時52分に駐車場。……コールさんは、夜中に現場へ来ている。\n## h_coleClear\ntsubasa.k: 2人組が降りたのは、2時26分。コールさんが着いたのは、そのあと。……間に合わなかった人だ。\n## h_alibi\ntsubasa.k: 22時5分に庁舎を出た人が、2時15分に「庁舎から」メールを送る。……前の晩に、仕込んである。\n## h_same\ntsubasa.k: 録画機に入った回線と、メールを仕込んだ回線。同じ番号だ。\n## h_three\ntsubasa.k: 住所。カメラのアカウント。月曜の予定。……3つを全部持っているのは、1人しかいない。\n## h_trade\ntsubasa.k: ハリドに会った8日後に、兄が帰ってくる。その2日後に、アッザームさんが死ぬ。\n## h_embassy\ntsubasa.k: 夜中の駐車場に、外交官の車。使っているのは、大使館の警備担当官。……2人組は、ここから来た。\n\n## a_n2\ncole.n: その記録の時刻は、本部の書き方だ。……読めているのかね、長官。\n## b_n3\nsaegusa.n: その車が警備局の物だという証拠を、お持ちですか。\n## c_n2\nmashiba.s: 総監。それ1つでは、何も言えませんよ。\n## x_near\n*: 物は合っている。だが、突く言葉がちがう。\n## x_break\n*: 相手は、口を閉ざした。信頼を失った。……出直すしかない。\n\n## end_half\n@hide all\n@bg soukan\n@bgm calm\n@card 6月10日（木）9:00｜霞が関　総監室\n@show onizuka center\nonizuka.t: 総監。真柴は、全部しゃべりました。……ですが、手を下した者が、報告書と合いません。\nonizuka.n: 検事は「内通の罪だけなら立つ」と言ってます。殺しの筋は、まだ穴がある。\n@hide all\n@show laila center\nlaila.d: 父を殺した人は、分からないままなんですね。\nlaila.n: ……それでも、父を売った人が分かっただけで、きょうは、眠れます。\n@hide all\n*: 内通者は、捕まった。だが、あの夜、12階に上がった者の名は、報告書に残らなかった。\n\n## t_oni_2\nonizuka.n: 鍵は中から閉まってた。窓も閉まってた。死んだのは浴室。……絵に描いたような事故です。\nonizuka.k: 絵に描いたような物は、たいてい誰かが描いてる。30年やってきた勘です。\nonizuka.t: ただ、勘では検事は動かん。総監、物をください。\n\n## t_laila_3\nlaila.n: 「N.C.」……父は、大事な相手ほど、頭文字だけで登録していました。\nlaila.d: その人を、父は信じていました。「アメリカ人だが、約束は守る男だ」と。\n\n## t_mashiba_3\nmashiba.n: 前の部屋は、1階でした。窓から人が見える、と怖がっておられたので。\nmashiba.s: 12階で、錠は最新式。廊下には、カメラも足しました。……これ以上は、ないと思ったんですが。\nmashiba.d: 守れませんでした。調整役として、恥ずかしい限りです。\n\n## t_kanri_3\nkanrinin.n: 眼鏡の、腰の低い人でしたよ。菓子折りまで持ってきて。\nkanrinin.n: 録画機に番号を足して、紙の裏に何か書いとりました。写しを1枚、置いていきましたな。棚のとじこみに入っとります。\n\n## t_yuki_1\nyuki.n: FBI本部から、総監あてに2通。「協力者の資産を、ただちに確保せよ」。パソコンの事だと思います。\nyuki.n: 警備局からは1通。「FBIに、保護の記録を見せるな」。\nyuki.t: ……総監は、両方の宛先に入っておられます。\n\n## t_yuki_2\nyuki.n: 真柴さんは、連絡調整室に来て3年です。その前は、外務省に出向しておられました。\nyuki.s: どちらの組織の方からも、評判のいい方ですよ。「あの人に頼めば、角が立たない」と。\n\n## t_chi_1\nchihaya.n: 更新が配られたのは、きのうの14時です。私が電話した、40分あと。\nchihaya.k: 中身を見ました。錠の中の「保守の記録」を、消す更新です。……消したい物が、あったんですね。\nchihaya.s: でも、クラウドの電圧の記録は、消される前に写しを取ってあります。総監の机に置いた、あれです。\n";
