<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>総監翼 捜査ファイル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: one screen. Top = the scene (640x400), bottom = a manga speech panel and big command buttons. */
:root{ --ink:#141833; --night:#1b2150; --paper:#fffaf0; --line:#11132a; --sun:#ffc531; --teal:#22c9bd; --rose:#ff4f6d; --sky:#6fd0ff; --mute:#8d93b8;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif; --f-disp:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background-image:radial-gradient(#252b63 1.6px,transparent 1.7px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stagewrap{position:relative;width:min(100%,calc((100dvh - 320px) * 1.6));max-width:100%;aspect-ratio:8/5;flex:none;border:4px solid var(--line);border-radius:14px;overflow:hidden;background:#000;box-shadow:6px 6px 0 #0008}
#stage{display:block;width:100%;height:100%}
#stage.quake{animation:quake .4s}
#app.hurt #stagewrap{animation:hurt .45s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@keyframes hurt{0%,100%{filter:none;transform:none}25%{filter:sepia(1) saturate(6) hue-rotate(-40deg);transform:translateX(-8px)}60%{transform:translateX(8px)}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}#fade.on{opacity:1}
/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;gap:8px;padding:8px;pointer-events:none}
#place{background:var(--line);color:var(--sun);border:2px solid var(--sun);border-radius:999px;padding:3px 12px;font-size:clamp(11px,1.6vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
#place:empty{display:none}
#viewbadge{display:flex;align-items:center;gap:4px;background:var(--paper);color:var(--line);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:clamp(11px,1.6vw,14px)}
#viewbadge svg{width:30px;height:30px;border-radius:50%;background:var(--sky)}
#hudbtns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#hudbtns button{position:relative;background:var(--paper);color:var(--line);border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-size:clamp(11px,1.6vw,14px);box-shadow:2px 2px 0 var(--line)}
#b-ev[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--rose);color:#fff;border-radius:999px;font-size:11px;min-width:18px;line-height:18px;text-align:center}
#bhud{position:absolute;left:8px;right:8px;top:44px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:clamp(10px,1.5vw,13px)}
#bhud .wall,#bhud .focus{background:#000a;border:2px solid var(--paper);border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:6px}
#bhud .segs{display:flex;gap:3px}#bhud .segs i{width:clamp(14px,3vw,26px);height:12px;background:var(--rose);border:2px solid #fff;border-radius:3px;display:block}
#bhud .segs i.broken{background:transparent;border-style:dashed;opacity:.5}
#bhud .focus b{width:12px;height:12px;border-radius:50%;border:2px solid #fff;display:block}#bhud .focus b.on{background:var(--teal)}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000b;text-align:center;animation:fadein .2s}
#card .c1{font-weight:900;font-size:clamp(15px,3vw,26px);color:var(--sun);letter-spacing:.06em}#card .c2{font-size:clamp(13px,2.4vw,20px)}
#getpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,460px);background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--sun);animation:pop .25s}
.gp-h{background:var(--line);color:var(--sun);padding:5px 12px;font-weight:900;font-size:clamp(12px,2vw,16px);border-radius:8px 8px 0 0}
.gp-b{display:flex;gap:10px;padding:10px 12px;align-items:flex-start;font-size:clamp(12px,2vw,16px)}.gp-b p{margin:4px 0 0;font-weight:500;font-size:.92em;line-height:1.5}
.evk{flex:none;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:10px;background:var(--sun);border:2px solid var(--line);font-family:var(--f-body);font-weight:900;font-size:1.15em;color:var(--line)}
#cutin{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
#cutin.banner{background:repeating-linear-gradient(-45deg,#ffc531 0 18px,#ffb000 18px 36px);color:var(--line);animation:slidein .25s}
#cutin .bn{font-family:var(--f-disp);font-size:clamp(26px,7vw,60px);letter-spacing:.1em;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
#cutin .bs{font-size:clamp(13px,2.6vw,22px);background:var(--line);color:var(--paper);padding:3px 14px;border-radius:999px}
#cutin.eyes{background:#000c}
#cutin.eyes svg{width:100%;height:44%;border-block:5px solid var(--line);animation:slidein .18s;background:var(--sun)}
#cutin.eyes .ct{position:absolute;right:6%;bottom:16%;font-family:var(--f-disp);font-size:clamp(28px,8vw,64px);color:#fff;-webkit-text-stroke:3px var(--rose);paint-order:stroke fill;transform:rotate(-6deg);animation:pop .2s}
#tl{position:absolute;left:8px;top:44px;bottom:8px;width:min(60%,330px);background:#fffaf0f2;color:var(--line);border:3px solid var(--line);border-radius:12px;padding:6px 10px;overflow:auto;font-size:clamp(11px,1.8vw,15px)}
#tl h3{margin:0 0 4px;font-weight:900;font-size:1.05em}#tl p{margin:3px 0;display:flex;gap:8px;line-height:1.35}#tl b{flex:none;width:3.2em;color:#b3202a;font-variant-numeric:tabular-nums}#tl .q{opacity:.6}#tl .hit{background:var(--sun);border-radius:6px;padding:2px 4px}
@keyframes fadein{from{opacity:0}}@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}@keyframes slidein{from{transform:translateX(-100%)}}
/* panel */
#panel{width:min(100%,calc((100dvh - 320px) * 1.6));max-width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#dialog{position:relative;background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-height:74px;box-shadow:5px 5px 0 #0008;cursor:pointer;font-size:clamp(15px,2.5vw,21px);line-height:1.55}
#dialog[data-kind="narr"]{background:#2a316e;color:var(--paper);border-color:var(--sky);font-weight:500}
#dialog[data-kind="me"]{background:#e6f6ff}
#dialog[data-kind="claim"]{background:#ffe9ec;border-color:var(--rose)}
#name{position:absolute;top:-15px;left:14px;background:var(--rose);color:#fff;border:3px solid var(--line);border-radius:999px;padding:0 14px;font-size:.8em;line-height:1.5}
#dialog[data-kind="me"] #name{background:#2a7fd6}
#text{min-height:3.1em;white-space:pre-wrap}
#dialog[data-kind="claim"] #text,#dialog.short #text{min-height:1.5em}
#dialog.short{min-height:0;padding-block:10px}
#bhud span{white-space:nowrap}
#next{position:absolute;right:12px;bottom:4px;color:var(--rose);animation:bob .7s infinite alternate}@keyframes bob{to{transform:translateY(4px)}}
#menu{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:0 5px 6px 0}
#menu.grid,#menu.two{display:grid;grid-template-columns:repeat(2,1fr)}#menu.grid.battle .hint{grid-column:1/-1}
@media (min-width:640px){#menu.grid{grid-template-columns:repeat(4,1fr)}#menu.grid.battle{grid-template-columns:repeat(5,1fr)}#menu.grid.battle .hint{grid-column:auto}}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--sun);color:var(--line);border:3px solid var(--line);border-radius:14px;padding:9px 14px;font-size:clamp(14px,2.3vw,19px);box-shadow:4px 4px 0 var(--line);min-width:0}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.opt small{font-size:.72em;font-weight:500;opacity:.8}.opt:disabled{opacity:.45;cursor:default}
.opt.back{background:var(--paper)}.opt.hint{background:var(--sky);align-items:center}.opt.ghost{background:#c9cde6}.opt.seen{background:#f2dfa0}.opt.seen span::after{content:" ✓"}.opt.angry{background:var(--rose);color:#fff}
/* modal */
#modal{position:absolute;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.mbox{width:min(100%,560px);max-height:calc(100dvh - 48px);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:16px;padding:14px;box-shadow:6px 6px 0 var(--sun)}
.mbox h2{margin:0;font-family:var(--f-body);font-weight:900;font-size:clamp(16px,3vw,22px)}
.evlist,.loglist,.setlist{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0;user-select:text;-webkit-user-select:text}
.evrow{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;color:var(--line);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:clamp(13px,2.1vw,16px)}
.evrow:disabled{opacity:1;cursor:default}.evrow small{display:block;font-weight:500;line-height:1.45}.evrow:not(:disabled){box-shadow:3px 3px 0 var(--line)}
.loglist p{margin:0;font-weight:500;font-size:14px;line-height:1.5}.loglist b{margin-right:8px;color:#b3202a}
.setlist label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}.setlist input[type=range]{width:50%}.setlist input[type=checkbox]{width:24px;height:24px}
.mclose{align-self:flex-end;background:var(--line);color:var(--paper);border:0;border-radius:10px;padding:8px 18px}
/* title + result */
#title,#result{position:absolute;inset:0;z-index:40;display:grid;place-items:center;align-content:start;background:var(--ink);background-image:radial-gradient(#2a3072 2px,transparent 2.2px);background-size:16px 16px;padding:16px;overflow:auto}
.tbox{display:flex;flex-direction:column;gap:12px;width:100%;max-width:900px}
.thead{display:flex;align-items:center;gap:18px}.tcopy{min-width:0}
#titlechar{flex:none;width:clamp(96px,20vw,170px);filter:drop-shadow(5px 5px 0 #0008)}#titlechar svg{display:block;width:100%}
.t-file{display:inline-block;background:var(--rose);color:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:900;letter-spacing:.1em;font-size:clamp(12px,2vw,16px);transform:rotate(-3deg)}
.t-h1{margin:6px 0 0;font-family:var(--f-disp);font-size:clamp(30px,7vw,60px);line-height:1.05;color:var(--sun);-webkit-text-stroke:2px var(--line);text-shadow:5px 5px 0 var(--rose);text-wrap:balance}
.t-sub{margin:10px 0 0;font-size:clamp(13px,2.2vw,18px);line-height:1.6;font-weight:500;max-width:30em}
#t-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}#t-btns .opt{align-items:center;min-width:9em}#t-cont{background:var(--teal)}
#t-load{font-size:15px;color:var(--sky)}
.t-note{font-size:12px;font-weight:500;color:var(--mute);margin:8px 0 0;line-height:1.6}

.rbox{text-align:center;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rf{font-weight:900;color:var(--sun);font-size:clamp(16px,3.4vw,26px)}.rs{font-family:var(--f-disp);font-size:clamp(34px,9vw,72px);color:#fff;-webkit-text-stroke:2px var(--rose)}
.rank{font-family:var(--f-disp);font-size:clamp(60px,16vw,120px);line-height:1;color:var(--sun);text-shadow:6px 6px 0 var(--rose);animation:pop2 .5s}.rank-B{color:var(--sky)}@keyframes pop2{from{transform:scale(3);opacity:0}}
.rd,.rc,.rn{margin:0;font-size:clamp(13px,2.4vw,18px)}.rc{font-weight:500}.rn{color:var(--teal)}.credit{font-size:11px;color:var(--mute);font-weight:500;line-height:1.6}
/* ---------- characters ---------- */
.eye-shut,.eye-smile,.m-open,.fx-sweat,.fx-anger{display:none}
.ch.blink .eye-open{display:none}.ch.blink .eye-shut{display:inline}
.ch.eyes-smile .eye-open,.ch.eyes-smile .eye-shut{display:none}.ch.eyes-smile .eye-smile{display:inline}
.ch.talk .m-open{display:inline}.ch.talk .m-shape{display:none}
.m-open{transform-box:fill-box;transform-origin:50% 20%}
.brow{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.ch-head{transform-origin:116px 206px}.ch-hairb{transform-origin:116px 206px}
.ch[data-e="t"] .fx-sweat{display:inline;animation:sweat 1.1s infinite}.ch[data-e="a"] .fx-anger{display:inline;animation:pulse .45s infinite alternate;transform-box:fill-box;transform-origin:center}
.ch[data-e="d"] .iris{transform:translateY(2.5px)}.ch[data-e="t"] .iris{animation:dart 1.4s infinite}.ch[data-e="u"] .iris{transform:scale(.82);transform-box:fill-box;transform-origin:center}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}@keyframes pulse{to{transform:scale(1.3)}}@keyframes dart{0%,100%{transform:none}30%{transform:translateX(-2.5px)}65%{transform:translateX(2.5px)}}
.slot{transition:opacity .2s}.slot.dim{filter:brightness(.62) saturate(.8)}.slot-in{animation:enter .28s both;transform-box:fill-box;transform-origin:50% 100%}
#chars.away .slot{opacity:0;pointer-events:none}
@keyframes enter{from{transform:translateY(30px);opacity:0}}
.slot-in.jump{animation:jump .45s}.slot-in.shake{animation:shake .5s}.slot-in.droop{animation:droop .7s both}.slot-in.shiver{animation:shiver .5s}.slot-in.hop{animation:hop .4s}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-22px) scale(1.03)}60%{transform:translateY(4px)}}@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px) scale(1.04)}30%{transform:translateX(9px) scale(1.04)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
@keyframes droop{to{transform:translateY(9px) rotate(1.5deg)}}@keyframes shiver{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.hand-r{transition:transform .35s}.ch.tell .hand-r{animation:tell 2.4s}.ch.tell-loop .hand-r{animation:tell 2.6s infinite}
@keyframes tell{0%,12%,88%,100%{transform:none}28%,72%{transform:translate(46px,-7px)}}
/* hotspots */
.hot rect{fill:#ffc53122;stroke:#ffc531;stroke-width:2.5;stroke-dasharray:8 6;animation:dash 1s linear infinite;cursor:pointer}
.hot .ring{fill:none;stroke:#fff;stroke-width:3;animation:ring 1.1s infinite;transform-box:fill-box;transform-origin:center}.hot .dot{fill:#ff4f6d;stroke:#fff;stroke-width:2}
.hot text{fill:#fff;font:900 12px var(--f-body);pointer-events:none}.hot .hl{font-size:13px;paint-order:stroke;stroke:#11132a;stroke-width:4px;stroke-linejoin:round}
.hot.seen rect{fill:#22c9bd22;stroke:#22c9bd}.hot.seen .dot{fill:#22c9bd}.hot.seen .ring{animation:none;opacity:.4}
.hot.ghost rect{fill:#ffffff14;stroke:#c9cde6;animation:none}.hot.ghost .dot{fill:#6a70a0}.hot.ghost .ring{animation:none;opacity:.3}.hot.ghost .hl{opacity:.7}
.zone rect{fill:#6fd0ff26;stroke:#6fd0ff;stroke-width:3;stroke-dasharray:7 5;animation:dash 1s linear infinite;cursor:pointer}.zone text{fill:#fff;font:900 15px var(--f-body);paint-order:stroke;stroke:#11132a;stroke-width:4px}
@keyframes dash{to{stroke-dashoffset:-28}}@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.cuffx .flash{animation:flash .5s both}.cuffx .cl{animation:cl .5s both}.cuffx .cr{animation:cr .5s both}@keyframes flash{from{opacity:.9}to{opacity:0}}@keyframes cl{from{transform:translateX(-200px)}}@keyframes cr{from{transform:translateX(200px)}}
/* ---------- scene objects ---------- */
.steam{animation:steam 2.4s infinite linear}.steam.s2{animation-delay:-.8s}.steam.s3{animation-delay:-1.6s}@keyframes steam{from{transform:translateY(8px);opacity:0}30%{opacity:.75}to{transform:translateY(-16px);opacity:0}}
.nr{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s infinite ease-in-out alternate}.nr.n2{animation-delay:-1s}.nr.n3{animation-delay:-2s}@keyframes sway{from{transform:skewX(-3deg)}to{transform:skewX(3deg)}}
.tvflick{animation:tvf 3.1s infinite steps(1)}@keyframes tvf{0%,100%{opacity:0}48%{opacity:.14}50%{opacity:0}77%{opacity:.08}79%{opacity:0}}
#bg[data-scene="kouhei"] .sec{transform-origin:250px 86px;animation:spin 60s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cuffs{opacity:0;transition:opacity .4s}#bg[data-tsutsumi="open"] .cuffs{opacity:1}#bg[data-tsutsumi="open"] .wrap{opacity:.25;transform:translate(8px,10px);transition:.4s}
#bg[data-night="on"] .nightshade{opacity:.5}#bg[data-night="on"] .win rect{fill:#1a2452}#bg[data-night="on"] .sun{fill:#f4f4dc}
.scr-on{display:none}[data-screenl="on"] .screenL .scr-on,[data-screenr="on"] .screenR .scr-on,[data-screent="on"] .mon2 .scr-on,[data-pc="on"] .pc .scr-on{display:inline}
[data-screenl="on"] .screenL .scr-off,[data-screenr="on"] .screenR .scr-off,[data-screent="on"] .mon2 .scr-off{display:none}
.cloud{animation:cloud 26s linear infinite alternate}@keyframes cloud{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
.blink{animation:blk 1.2s infinite steps(1)}@keyframes blk{50%{opacity:.15}}
.led{animation:blk 1s infinite steps(1)}.lockled{animation:blk .8s infinite steps(1)}
.fl.f1{animation:flk 4.3s infinite steps(1)}@keyframes flk{0%,100%{opacity:1}91%{opacity:.4}93%{opacity:1}96%{opacity:.5}}
.tape{animation:sway2 2.4s infinite ease-in-out alternate;transform-box:fill-box;transform-origin:0 50%}@keyframes sway2{from{transform:rotate(-1deg)}to{transform:rotate(1.2deg)}}
.jglow{animation:glow 2.6s infinite alternate}@keyframes glow{from{opacity:.75}to{opacity:1}}[data-jihanki="blink"] .jglow{animation:blk .3s 4 steps(1)}
.can{opacity:0}[data-jihanki="drop"] .can{animation:drop .6s both}@keyframes drop{0%{opacity:1;transform:translateY(-40px)}70%{opacity:1;transform:translateY(12px)}85%{transform:translateY(8px)}100%{opacity:1;transform:translateY(12px)}}
.redglow rect{animation:glow 1.4s infinite alternate}.rs{animation:rs 1.2s infinite alternate}@keyframes rs{to{fill:#c9262a}}
.chair{transform-box:fill-box;transform-origin:20% 100%;transition:transform .5s cubic-bezier(.5,1.6,.6,1)}[data-chair="fall"] .chair{transform:rotate(-58deg)}
.recv{transition:transform .35s;transform-box:fill-box;transform-origin:0 100%}[data-phone="lift"] .recv{transform:translateY(-14px) rotate(-14deg)}
.lkdoor{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s}[data-locker="open"] .lkdoor{transform:scaleX(.14) skewY(-8deg)}[data-locker="open"] .bottle{animation:hop2 .6s .5s}@keyframes hop2{50%{transform:translateY(-8px)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:rot .5s linear infinite}@keyframes rot{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}[data-gear="spin"] .gear{animation:spin 1.2s linear 2}
.wave{stroke-dasharray:6 4;animation:dash 1.2s linear infinite}
.candy{transform-box:fill-box;transform-origin:50% 100%}[data-candy="shake"] .candy{animation:shiver .5s 2}
.logroll{animation:roll 16s linear infinite}@keyframes roll{from{transform:translate(62px,100px)}to{transform:translate(62px,-54px)}}[data-logscroll="on"] .logroll{animation-duration:5s}
#bg[data-scene="tokumei"] .sec{animation:spin 60s linear infinite}#bg[data-scene="tokumei"] .mm{animation:spin 3600s linear infinite}
.ransomzoom{display:none}[data-ransomzoom="on"] .ransomzoom{display:inline;animation:zoomin .5s both;transform-box:fill-box;transform-origin:85% 90%}@keyframes zoomin{from{transform:scale(.2);opacity:0}}.zoombox{animation:blk .6s infinite steps(1)}

w chihaya right\nchihaya.s: 技官の千早です！　24です。総監より4つ上です！\nchihaya.t: ……あ。すみません。いま言う事じゃなかったですね。\n@sfx phone\nyuki.u: え、いま？　……総監、警視庁の早瀬課長です。スピーカーにしますね。\n@bgm tension\n@tel hayase\nhayase.k: 早瀬です。文京区の東都医科大学病院、けさ6時にシステムが全部止まりました。\nhayase.k: 画面に身代金の要求が出てます。それと……地下2階のサーバー室で、男性が1人、亡くなってます。\nhayase.k: 扉は、中から閉まってました。\n@tel off\n\n## pro_go\ntsubasa.k: 現場へ行きます。千早さん、小野寺さん、一緒にお願いします。\n@hide yuki\n@show onodera left\nonodera.n: はいはい。歩くのは、私の役目ですから。\nchihaya.s: はいっ！　機械は、まかせてください！\n\n## c1_arrive\n@hide all\n@bg rouka\n@bgm invest\n@card 9:40｜東都医科大学病院　地下2階\n@show onizuka center\nonizuka.k: ……総監ご本人が来たんですか。捜査一課の鬼塚です。\nonizuka.n: 先に言っときます。人が死んだら一課です。サイバーかどうかは、そのあと。\n@show hayase left\nhayase.n: 扉は電子錠です。記録だと、ゆうべ22時14分。情報システム部長の三浦さんの職員証で、入ってます。\nhayase.n: そのあとは、誰も。出た記録も、ないんです。\n@show kanri right\nkanri.t: け、けさ6時に、扉が開かなくなって。消防の人に、横の壁を外してもらったんです。\nonizuka.n: 部長はモニターの前で倒れてました。外傷なし。持病は、心臓。\nonizuka.k: まあ、病死でしょう。……ただ、決めるのは見てからです。\n@get nyutai\n@hide all\n*: 「調べる」で物を見る。「話す」で人に聞く。「移動」で場所を変える。\n*: 「視点」で、小野寺と千早に代わる。人が変わると、見える物と聞ける話が変わる。\n\n## c1_door\n@show furukawa center\nfurukawa.n: 科捜研の古川。……あ、触らんでください。写真が先。\nfurukawa.k: この錠はね、ばらせば、何回開いたか分かるんですよ。1日ください。\n@hide furukawa\n\n## c1_kabe\n*: 消防が外した壁の板。ここから中に入れる。扉そのものは、いまも閉じたままだ。\n\n## c1_jihanki\n@obj jihanki blink\n*: 廊下の突き当たりの自販機。缶コーヒーの列が、1本ぶん減っている。\n\n## c1_reader\n@show chihaya center\nchihaya.k: 入退室の機械ですね。えーっと……あれ？　記録、ゆうべの23時40分で終わってます。\nchihaya.t: そのあと、真っ白です。止まったのか、消されたのか……まだ分かんないです。\n@hide chihaya\n\n## c1_t_kanri_hito\nkanri.d: 部長は……毎晩、最後まで残る人でした。「先に帰れ」って、いつも。\nkanri.d: 心臓の薬は、更衣室のロッカーです。サーバー室、飲食も私物も禁止なんで。\n*: 「移動」に、更衣室が増えた。\n\n## c1_t_kanri_tobira\nkanri.n: 扉は去年、新しい電子錠に替えたんです。中の非常ボタンも、同じ機械につながってて。\nkanri.t: だから、機械が止まると……中からも、開かないんです。\n\n## c1_t_onizuka\nonizuka.n: 病死ですよ。争った跡が、どこにもない。\nonizuka.n: ……ただね。机の缶コーヒー。あれは気に入らない。飲食禁止の部屋でしょう、ここ。\n\n## c1_t_hayase\nhayase.n: 要求は50ビットコイン。いまの値で、7億円ちょっとです。期限は48時間。\nhayase.k: 署名は「ドーン」。病院ばっかり狙う連中です。世界中で。\n\n## c1_monitor\n*: 赤い画面。「あなたの病院は暗号化された。50BTC」。残り時間の数字が、1秒ずつ減っていく。\n@get ransom\n\n## c1_coffee\n*: 飲みかけの缶コーヒー。廊下の自販機と同じ銘柄。まだ半分残っている。\n@get coffee\n\n## c1_chair\n@obj chair fall\n@sfx thud\n*: 椅子の脚が1本、曲がっている。扉の内側、取っ手のまわりに、新しい傷がいくつもある。\n@get kizu\n\n## c1_phone\n@obj phone lift\n@show chihaya center\nchihaya.n: 内線、だめです。つながりません。……電話の機械ごと止まってますね。0時ちょうどから。\n@hide chihaya\n@get phone\n\n## c1_rack\n@show chihaya center\nchihaya.k: あ、これ。全部いっぺんじゃないです。1台ずつ、順番に止められてます。\nchihaya.n: 順番は……持って帰って見ます。ここじゃ読めないんで。\n@hide chihaya\n\n## c1_tape\n@show onodera center\nonodera.d: モニターの前。キーボードに手を伸ばしたまま、だったそうです。\nonodera.n: ……最後まで、何か打ってたんですねえ。\n@hide onodera\n\n## c1_locker\n@obj locker open\n@sfx door\n*: 三浦のロッカー。上着と、薬の瓶。「発作の時に1錠」と書いてある。瓶は、ほとんど減っていない。\n@get kusuri\n\n## c1_locker_bench\n*: 長いすに、たたんだ新聞。きのうの夕刊だ。\n\n## c1_prebattle\n@hide all\n@show onizuka center\n@bgm tension\nonizuka.n: 総監。そろそろ、まとめましょうや。\nonizuka.k: 持病の発作。争った跡なし。入った記録は本人だけ。\nonizuka.k: ……病死です。事件じゃない。\n\n## c1_prebattle2\ntsubasa.k: 待ってください。それでは、筋が通りません。\nonizuka.s: ほう。じゃあ、聞かせてもらいましょうか。\nonizuka.k: 言っときますが、一課は物でしか動きませんよ。\n*: 「追及」が始まる。相手の言い分を聞いて、4つの手から選ぶ。\n*: 「証拠」は物を出す。「推理」は答えを言う。「視点」は仲間に代わる。「観察」は相手の動きを見る。\n\n## b1_c1\nonizuka.k: 持病の発作だ。病死で終わりです。\n## b1_o1\ntsubasa.k: 薬は、更衣室のロッカーにありました。ほとんど減っていません。\ntsubasa.k: 発作の人が、薬を取りに行かなかった。なぜです。\nonizuka.u: ……。\n\n## b1_c2\nonizuka.n: 取りに行く間もなく、倒れた。それだけの話でしょう。\n## b1_o2\ntsubasa.k: 椅子の脚が曲がり、扉の内側は傷だらけです。\ntsubasa.k: 倒れる前に、この人は、扉を開けようとしていた。\nonizuka.t: 椅子で、扉を……たたいた、と。\n\n## b1_c3\nonizuka.k: いや、待った。管理者が言ったでしょう。扉が止まったのは、けさ6時だ。夜中は開いたはずです。\n## b1_o3\nchihaya.k: あの！　6時は「気づいた時刻」です。止まった時刻じゃないです。\nchihaya.n: 入退室の記録、23時40分で切れてるんです。夜中に何が止まったかは、まだ誰も見てません。\nonizuka.t: ……むう。\n\n## b1_c4\nonizuka.n: 開かないなら、電話すりゃいい。あの部屋、内線があるでしょう。\n## b1_o4\ntsubasa.k: 内線は、0時ちょうどに切れています。\ntsubasa.k: 電話の機械ごと、止められていた。\nonizuka.u: 電話まで……。\n\n## b1_c5\nonizuka.k: ……じゃあ総監。あの部屋で、何が起きたって言うんです。\n## b1_o5\ntsubasa.k: 三浦さんは、あの部屋に閉じこめられていた。\ntsubasa.k: 病気で死んだんじゃない。出られなくて、死んだんです。\n\n## b1_end\n@bgm truth\nonizuka.d: ……分かりました。事件です。\nonizuka.k: 一課とサイバー、合同でやりましょう。……早瀬、聞いたな。\nonizuka.n: ただし総監。閉じこめたのが「人」なのか「機械」なのか。そこは、まだですよ。\n\n## b1_miss\nonizuka.n: それは、いまの話と関係がありませんな。\n## b1_miss2\nonizuka.s: 総監。物で話してください。\n\n## c2_kasouken\n@hide all\n@bg kasouken\n@bgm calm\n@card 4月13日（火）10:00｜警視庁　科捜研\n@show shiraishi center\nshiraishi.n: はい、いらっしゃい。分かった事と、分からない事を、分けて言いますよ。……飴、どうぞ。\n@show furukawa left\nfurukawa.k: 錠前の回数計。記録より、2回多く回ってます。\nfurukawa.n: 最後の2回は、ゆうべ22時14分のあとです。\n@get counter\n@show kiryu right\nkiryu.n: 缶コーヒーの飲み口。三浦さんのDNAだけです。急ぎで回して、けさ出ました。\nshiraishi.n: で、分からないほう。その2回、誰が回したのか。なんで記録にないのか。\n@hide all\n@show onizuka center\n@bgm tension\nonizuka.k: 2回。入って、出た。……ほら、誰かいたんですよ、総監。\nonizuka.a: 閉じこめたのは「人」だ。殺しの線で行きます。\n@hide all\n@bgm invest\n\n## c2_t_furukawa\nfurukawa.n: 錠前ってのは、開いた回数は覚えてる。誰が開けたかは、覚えちゃいない。\nfurukawa.k: ただね。2回の間は短い。回り方の跡で分かる。せいぜい、数分です。\n\n## c2_t_kiryu\nkiryu.n: 解剖の結果、来ました。心臓の発作。外傷なし。\nkiryu.n: 亡くなったのは、朝5時20分ごろです。\n@get kaibou\n\n## c2_t_miyashita\nmiyashita.n: 缶の中身はですねえ、1つずつ消していくんで。毒があるかないかは、1週間ください。\nmiyashita.n: いまんところ、何も出てません。\n\n## c2_gear\n@obj gear spin\n*: 分解された錠前。小さな歯車の数字が、記録より2つ進んでいる。\n\n## c2_candy\n@obj candy shake\n@show shiraishi center\nshiraishi.s: どうぞどうぞ。考える時はね、甘い物ですよ。\n@hide shiraishi\n\n## c2_miss\n@show chihaya center\n@bgm calm\nchihaya.d: 総監。……すみません。私です。\nchihaya.d: 病院のサーバーの写しを取る時、電源を落とす前の画面……撮り忘れました。\nchihaya.d: 画面の時刻が、どこまで本当か……もう、分かりません。\n\n## c2_miss_a\ntsubasa.s: すぐ言ってくれて、助かりました。次の手を、一緒に考えましょう。\n## c2_miss_b\ntsubasa.s: 大丈夫です。時刻は、ほかの機械にも残ります。\n## c2_miss_c\ntsubasa.s: 千早さんが、一番早く言ってくれた。それが大事です。\n\n## c2_miss_after\n@show sawaguchi left\nsawaguchi.n: あー、それなら。落とす直前のネットワークの機械の記録、私が取ってあります。\nsawaguchi.n: 時刻は、そっちに残ってますよ。\n@show mendes right\nmendes.s: 千早、自分で言えたな。それでいい。\nchihaya.s: ……はいっ。取り返します。\n@hide all\n@bgm invest\n\n## c2_nwlog\n@obj logscroll on\n@show chihaya center\nchihaya.k: 沢口さんの記録、読めました！　順番、出ます。\nchihaya.n: 22時31分、外から侵入。23時40分、入退室の記録の機械が止まる。\nchihaya.n: 0時ちょうど、電話。0時5分、扉の制御。……扉は、0時5分から開きません。\n@show sawaguchi left\nsawaguchi.k: 総監、ここ。記録の機械と扉の間、25分、空いてるんです。\n@hide all\n@get nwlog\n\n## c2_sousa\n@show sawaguchi center\nsawaguchi.n: サーバーの写しから、画面の操作の記録が出ました。……ちょっと、見てください。\nsawaguchi.d: 0時10分から、朝5時20分まで。三浦さんは1人で、暗号化を手で止めようとしていました。\n@show chihaya right\nchihaya.d: ……止められた機械が、3つあります。全部、病棟の機械です。\n@hide all\n@get sousa\n\n## c2_sousa_early\n@show sawaguchi center\nsawaguchi.n: あ、こっちはまだ途中です。先に、千早の読んでるほうを。\n@hide sawaguchi\n\n## c2_t_mendes\nmendes.n: 総監、段取りはこうです。侵入の入口は、うちとFBIで追う。\nmendes.n: 密室のほうは、総監の目で。\n\n## c2_clock\n*: 東京とワシントンの時計。13時間ずれて、同じ速さで進んでいる。\n\n## c2_jihanki\n@show onodera center\nonodera.n: 自販機の会社にね、売上の記録を出してもらいましたよ。\n@obj jihanki drop\n@sfx thud\nonodera.k: あの夜、この機械で売れたのは1本だけ。23時42分。缶コーヒーです。\n@hide onodera\n@get jihanki\n\n## c2_t_kanri\nkanri.d: 部長、毎晩23時半すぎに、コーヒー買いに出るんです。1分で戻ってきます。\nkanri.d: 「夜中の1本が、おれの残業代だ」って。\n\n## c2_door\n*: 廊下からサーバー室の扉まで、歩いて20歩。自販機は突き当たり。往復で、1分とかからない。\n\n## c2_think\n@hide all\n@bgm truth\n*: 物はそろった。起きた事を、時刻の順に並べる。\n\n## c2_think_ok\n@sfx correct\n*: 時刻が、1本につながった。\n\n## c2_q_wrong\n*: ……違う。物と時刻を、もう1度見る。\n\n## c2_prebattle\n@bg kasouken\n@show onizuka center\n@bgm tension\nonizuka.k: 総監。殺しの線で、病院の関係者、全員洗ってます。\nonizuka.k: 2回多い。誰かが入って、出た。それが全部です。\n\n## b2_c1\nonizuka.k: 回数計は2回多い。誰かが入って、出たんです。殺しですよ。\n## b2_o1\ntsubasa.k: 23時42分、廊下の自販機で、缶コーヒーが1本売れています。\ntsubasa.k: 出て、戻った。それで2回です。回したのは、三浦さん本人です。\nonizuka.u: 本人が……。\n\n## b2_c2\nonizuka.n: 本人なら、職員証の記録が残るはずでしょう。ないんですよ、記録に。\n## b2_o2\ntsubasa.k: 記録の機械は、23時40分に止められていました。\ntsubasa.k: その2分後の出入りは、どこにも残りません。\nonizuka.t: 先に、記録を……。\n\n## b2_c3\nonizuka.k: じゃあ、なんで逃げなかった。0時5分まで、扉は開いたんでしょうが。\n## b2_o3\ntsubasa.k: 気づいていなかったんです。コーヒーを買って戻り、席に着いた。\ntsubasa.k: 0時に電話が切れ、0時5分に扉が閉じた。気づいた時には、もう出られなかった。\nonizuka.d: ……。\n\n## b2_c4\nonizuka.n: ……それで。朝までの5時間、部長は何をしてたんです。\n## b2_o4\ntsubasa.k: 止めようとしていました。0時10分から5時20分まで、1人で。\ntsubasa.k: 病棟の機械を3つ、守っています。\nonizuka.d: 5時間、1人で……。\n\n## b2_end\n@bgm truth\nonizuka.d: ……殺しじゃない。\nonizuka.k: ……だが、殺されたのと同じだ。閉じこめたのは、機械を止めたやつらです。\nonizuka.k: 総監。入口を開けたやつを、挙げましょう。\n\n## b2_miss\nonizuka.n: それでは、2回の説明になりませんな。\n## b2_miss2\nonizuka.s: 総監。一課を納得させるには、物が要ります。\n\n## c3_brief\n@hide all\n@bg tokumei\n@bgm invest\n@card 4月15日（木）9:00｜特命班の部屋\n@show mendes center\nmendes.n: 総監、入口が分かりました。医療機器メーカーの「メディコア・ジャパン」。保守用の遠隔接続です。\nmendes.k: 22時31分に入ったのは、保守担当の堀健吾のアカウント。接続元は、海外です。\n@get remote\n@obj screenT on\nrosen.n: ワシントンのローゼンです。総監、お金のほうは私が。数字は、嘘つきませんから。\n@show onodera left\nonodera.n: 堀さんには、私が会ってきましょうか。……いや。総監も、一緒にどうです。\n\n## c3_maker\n@hide all\n@bg maker\n@card 11:00｜メディコア・ジャパン　保守部\n@show hori center\nhori.t: ほ、堀です。……あの夜は、家で寝てました。接続なんか、してません。\nhori.t: アカウントを盗まれたんですよ。私だって、被害者なんです。\n@hide all\n\n## c3_pc\n@obj pc on\n@show chihaya center\nchihaya.n: 保守用のパソコンですね。電源の記録、見ます。……あの夜は、1度も起動してないです。\nchihaya.k: 堀さんの手では、つないでいない。そこは本当です。\n@hide chihaya\n@get pc\n\n## c3_nidan\n@obj server blink\n@show chihaya center\nchihaya.k: 保守のアカウントの、設定の記録です。……ん？　あれ？\nchihaya.u: 堀さんのアカウントだけ、二段階の確認が外されてます。1月12日。この部屋の、堀さんの席のパソコンからです。\n@hide chihaya\n@get nidan\n\n## c3_token\n@obj cabinet open\n*: 確認用の小さな機械の棚。堀の分は、いまも棚にある。貸し出しの帳面に、持ち出しの記録はない。\n\n## c3_window\n*: 窓の外を、雲が流れていく。向かいのビルに、病院の看板が見える。\n\n## c3_t_kacho\nkacho.n: 堀ですか。まじめな男ですよ。ただ、去年は元気がなくてね。借金があるって聞きました。\nkacho.n: それが1月の半ばに、急に明るくなりましてね。「全部返した」と。\n@get hensai\n\n## c3_t_hori_nidan\nhori.t: ……外しましたよ。夜中の呼び出しのたびに、あの機械を取りに来るのが、面倒で。\nhori.t: それだけです。売ってなんか、いません。\n\n## c3_t_hori_kane\n@obj tell on\nhori.n: 金には、困っていません。\n*: 堀の右手が、左の手首の上に動いた。\n\n## c3_t_hori_miura\nhori.d: 三浦部長には……点検のたびに、世話になりました。いい人、でした。\n\n## c3_t_rosen1\nrosen.n: 総監、ありました。ダークウェブに、1月13日の出品です。\nrosen.n: 「東京の大学病院。保守の入口。0.3ビットコイン」。買い手がついたのは、1月14日。\n@get darkweb\n\n## c3_t_rosen2\nrosen.k: 送金が1件、合いました。0.3ビットコインは、日本の取引所の口座へ。\nrosen.k: 1月15日に、円で出金。口座の名義は、堀健吾です。\n@get okane\n\n## c3_t_rosen0\nrosen.n: 出品をさがしてます。総監、手がかりを1つください。日付があると、早いんです。\n\n## c3_t_rosen1b\nrosen.n: 払われた0.3ビットコインの行き先を、追ってます。受け取った人の暮らしに、何か変わった事はありませんでしたか。\n\n## c3_t_sawaguchi\nsawaguchi.n: 総監、ドーンがあの入口を使ったのは、買ってから3か月後です。\nsawaguchi.k: 3か月、中を静かに見ていた事になります。\n\n## c3_prebattle\n@hide all\n@bg maker\n@bgm tension\n@show hori center\nhori.t: まだ、何か。……私は被害者だって、言ったじゃないですか。\n\n## b3_c1\nhori.t: アカウントは盗まれたんです。私は、何もしていない。\n## b3_o1\ntsubasa.k: 1月12日。あなたのアカウントだけ、二段階の確認が外されています。\ntsubasa.k: 外したのは、あなたの席のパソコンです。\nhori.u: そ、それは……面倒だったからです！\n\n## b3_c2\nhori.t: 外しただけです！　売ってなんかいない。出品なんて、知りませんよ。\n## b3_o2\ntsubasa.k: 出品は1月13日。確認を外した、次の日です。\ntsubasa.k: 盗んだ者が、あなたの外す日を、前もって知っていた事になります。\nhori.t: ぐ、偶然だ……。\n\n## b3_c3\nhori.n: 偶然ですよ。だいたい、金には困ってない。売る理由が、ないでしょう。\n## b3_o3\ntsubasa.k: 「金」と言うたびに、手首を隠しますね。\nhori.u: ……！\n\n## b3_c4\nhori.t: これは……く、癖です。借金なんか、ありません。\n## b3_o4\nonodera.n: 課長さんに聞きましたよ。去年は、借金で元気がなかったって。\nonodera.n: それが1月の半ばに、「全部返した」と。\nonodera.k: 人は、ログより正直です。\nhori.t: か、返したのは……親に、借りて……。\n\n## b3_c5\nhori.t: 親に借りたんです！　調べれば分かる。\n## b3_o5\ntsubasa.k: 調べました。0.3ビットコインは、日本の取引所の、あなたの名義の口座に入っています。\ntsubasa.k: 1月15日に、円で出金。返済の日と、同じです。\nhori.u: ……あ……。\n\n## b3_c6\nhori.d: ……。\n## b3_o6\ntsubasa.k: 堀さん。病院の入口を売ったのは、あなたです。\n\n## b3_break\n@bgm truth\nhori.d: ……病院が止まるなんて、思わなかった。\nhori.d: 入口が1つ開くだけだと。誰かが、中をのぞくだけだと。\nhori.d: 人が、死ぬなんて……。\n\n## b3_calm\ntsubasa.k: 三浦さんは5時間、1人で止めようとしました。あなたが開けた入口を。\ntsubasa.k: その5時間を、法廷で聞いてください。\n\n## b3_angry\n@sfx shock\ntsubasa.a: 「思わなかった」で、済むか！\ntsubasa.a: あなたが開けた扉の向こうに、1100人の患者がいた。\ntsubasa.a: 三浦さんはその扉を、5時間、1人で押さえていたんだ！\n@show onizuka right\nonizuka.k: ……。\n*: 鬼塚が、黙って姿勢を正した。堀は、顔を上げられない。\n\n## b3_arrest_q\n@show onizuka right\nonizuka.n: 総監。手錠は。\n\n## b3_arrest_self\ntsubasa.k: 自分でかけます。\n@obj tejou close\n@sfx cuff\n*: 伯父の手錠が、小さな音を立てて閉じた。\nonizuka.k: 14時6分。不正アクセス禁止法違反の疑いで、逮捕。\n\n## b3_arrest_oni\ntsubasa.n: 鬼塚課長、お願いします。\n@sfx cuff\nonizuka.k: 14時6分。不正アクセス禁止法違反の疑いで、逮捕。\n\n## b3_last\nhori.d: ……三浦部長には、点検のたびに、缶コーヒーをおごってもらいました。\nhori.d: 廊下の、あの自販機です。\n@hide all\n\n## b3_miss\nhori.t: そ、それが何だと言うんです。\n## b3_miss2\nhori.n: 関係のない話は、やめてください。\n\n## ep_hospital\n@hide all\n@bg rouka\n@bgm calm\n@card 4月15日（木）21:00｜東都医科大学病院\n@show hayase left\nhayase.n: 総監。身代金の期限、過ぎました。……病院、どうしますか。\n\n## ep_a\ntsubasa.k: 払いません。3日前のバックアップから、戻しましょう。\n## ep_b\ntsubasa.k: 払いません。交渉で時間を稼ぎながら、バックアップから戻します。\n\n## ep_hospital2\nhayase.n: 分かりました。なくなった3日分は、紙のカルテから、職員が手で打ち直すそうです。総出で。\n@show kanri right\nkanri.d: ……部長が守った3つの機械は、病棟の点滴の機械でした。\nkanri.d: あれが止まらなかったんで……あの夜、病棟では、誰も急変してないんです。\n@hide all\n\n## ep_shop\n@bg kouhei\n@obj night on\n@bgm home\n@card 23:10｜神田　食堂「こうへい」\n@show kohei center\nkohei.n: おう。食ったか。\nkohei.n: ……手錠、使ったのか。\nkohei.s: ……そうか。じゃあ、味噌汁もう1杯だ。\n@hide all\n\n## ep_hook\n@bg tokumei\n@bgm tension\n@card 4月16日（金）8:00｜特命班の部屋\n@show sawaguchi left\nsawaguchi.k: 総監、1つだけ、いいですか。身代金の画面の、右下の隅。拡大します。\n@obj ransomzoom on\n@sfx shock\n*: 小さな字で、こう書いてある。「ようこそ、総監」。\n@show chihaya right\nchihaya.u: え……これ、総監あてじゃないですか。最初から。\n@show mendes center\nmendes.k: ……続きがありそうですね、総監。\n@hide all\n", "002": "# FILE 002 母の病院\n@intro 夕方の総監室に、母から電話。「ハニー、うちの病院が止まったの」。ワシントンの小児病院へ飛ぶ。\n@next FILE 003「交渉人」につづく\n@end S マーガレット「よくやったわ、ハニー。パンケーキ、5枚にしてあげる」\n@end A リード「いい仕事でした、総監。支局の者も、そう言っています」\n@end B メンデス「総監、次は私ももっと歩きます。靴、買い替えときますよ」\n@view tsubasa 翼 | 物を見て、筋を通す\n@view mendes メンデス | 人に聞く。足で稼ぐ\n@view rosen ローゼン | 数字と記録を読む\n@char rosen name=ローゼン role=FBIの会計担当の捜査官 sex=f skin=#f2d0bb hair=#a8683a hs=wavy eye=#4a9a5a es=soft tilt=-3 jaw=0 brow=1.8 gl=round fit=suit:#3d4a44:#f3efe8 pose=tablet\n@char cruz name=クルス role=夜勤の看護師 sex=f skin=#d8a882 hair=#2a1e1a hs=pony eye=#8a5a2a es=round tilt=5 jaw=0 brow=1.9 blush=1 fit=shirt:#f0a8b8:#fff lan=1 pose=stand v=F,1.02,1.01,1.00,0.80\n@char bates name=ベイツ role=聖ルカ小児病院の情報部長 sex=m skin=#f2d2ba hair=#8a7a6a hs=thin eye=#5a7a8a es=soft tilt=6 jaw=1 brow=2.4 gl=round wr=1 fit=suit:#5a5a66:#f4f7fb:#3a5a7a pose=stand v=M,1.10,1.02,1.02,0.90\n@ev ransom 薬の機械の赤い画面 | 脅 | 聖ルカ小児病院。要求は20ビットコイン。およそ300万ドル。署名は「ドーン」。\n@ev mail 偽の「勤務表」のメール | 信 | 夜中の2時すぎ、クルスに届いた。開いても何も出なかった。1時間たたずに、全部止まった。\n@ev sender メールの送り主 | 元 | 偽のメールは、病院の本物のアドレスから来た。持ち主は、3年前に辞めた職員。\n@ev backup 壊されたバックアップ | 壊 | バックアップは4日前から少しずつ壊れていた。気づいたのは、きのう。\n@ev hoken 保険の契約書 | 保 | サイバー保険の上限は300万ドル。要求の20ビットコインと、同じ額。病院は上限を外に言った事がない。\n@ev gyousha 業者の管理画面の記録 | 業 | 病院のメールは外の業者に預けている。4日前の夜、その管理画面から、誰かが入った。\n@ev belta お金の行き先 | 金 | ローゼンが間違えて追った財布は、ドーンの別の財布と取引していた。その先は、取引所「ベルタ」の入金口。\n@ev douji 入られた時刻 | 時 | 業者の管理画面に入られたのは、ワシントンの4月11日9時31分。東京の時間で22時31分。東京の病院と同じ分。\n\n@place c1 start=ward need=ransom,mail,sender,backup,hoken,gyousha\n@loc ward ナースステーション bg=ward people=margaret,cruz\n@hs kusuri tsubasa 424,106,124,162 薬の機械 -> w_kusuri\n@hs chart any 164,194,146,48 紙のカルテ -> w_chart\n@hs e any 208,40,208,62 子どもたちの絵 -> w_e\n@talk cruz mendes ゆうべ、何がありましたか -> w_t_cruz\n@talk margaret tsubasa 子どもたちは、大丈夫？ -> w_t_mom\n@loc itroom 病院の情報部 bg=itroom people=bates\n@hs mail rosen 244,168,112,86 メールの機械 -> w_mail\n@hs tape tsubasa 494,62,124,190 バックアップの棚 -> w_tape\n@hs keiyaku rosen 400,208,66,44 保険の契約書 -> w_keiyaku\n@talk bates mendes 古いアドレスは、なぜ残っていたんですか -> w_t_bates1\n@talk bates mendes メールの機械は、誰が見ているんですか -> w_t_bates2\n\n@place c2 start=fbi need=belta,douji,f:pittari\n@loc fbi FBIワシントン支局 bg=fbi people=reed,hamilton enter=rosenmiss:miss\n@hs pc2 rosen 392,176,104,82 ローゼンの画面 -> w_belta\n@hs wb tsubasa 244,42,184,116 ホワイトボード -> w_wb | f=pittari\n@talk hamilton tsubasa 入られた時刻は、分かりましたか -> w_t_ham\n@talk reed mendes 理事会は、どう動いていますか -> w_t_reed\n\n@battle b1 foe=cruz title=クルスの思いこみをほどけ bg=ward miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev sender b1_o1 | あのメールは、どこから来たのか。「証拠」。\n@ph b1_c2 ded 0 b1_o2 | 「推理」。おかしいと思えなかったのは、誰のせいか。 | 3年前に辞めた人のアドレスを、病院が消していなかった | クルスさんが、疲れていたから | メールの題が、上手だったから\n@ph b1_c3 ev backup b1_o3 | 相手は、いつから中にいたのか。「証拠」。\n@ph b1_c4 view mendes b1_o4 | ここは理屈ではない。「視点」で、人の話を聞いてきた仲間に代わろう。\n@battle b2 foe=bates title=「払うしかない」を崩せ bg=rijikai miss=b2_miss,b2_miss2 end=b2_end\n@ph b2_c1 ev hoken b2_o1 | 要求の額と、同じ数字が書いてある紙がある。「証拠」。\n@ph b2_c2 ev gyousha b2_o2 | バックアップが壊れ始めた日に、何があったか。「証拠」。\n@ph b2_c3 ev douji b2_o3 | この病院だけの話ではない。時刻を見よう。「証拠」。\n@ph b2_c4 ded 1 b2_o4 | 「推理」。払ったあとに、何が残るか。 | ドーンは、金を受け取れば必ず約束を守る | 上限を教えた者が、病院の近くにいる。払っても、その者は残る | 保険会社が、全部払ってくれる\n\n@flow miss\n play w_miss\n ask ローゼンに、何と言う？ | 半日で気づいて、すぐ言ってくれた -> w_miss_a | 間違えた先を、一緒に見ましょう -> w_miss_b | すぐ言ってくれて、ありがとう -> w_miss_c\n play w_miss_after\n@flow main\n cp\n play in_tokyo\n ask 鳴っているスマホを、どうする？ | 電話に出る -> in_call\n banner FILE 002 | 母の病院\n cp\n play w_arrive\n inv c1\n cp\n bg ward\n play w_pre1\n ask 翼は、どうする？ | クルスさん、少しだけ聞いてください -> w_pre1b\n battle b1\n cp\n play w_fbi\n inv c2\n cp\n play w_pre2\n battle b2\n ask 病院を、どうする？ | 払わない。CISAと72時間で戻す -> w_end_a | 払わない。交渉を引き延ばして、その間に戻す -> w_end_b\n play w_end2\n play w_hook\n\n## in_tokyo\n@bg soukan\n@bgm calm\n@card 4月14日（水）18:10｜霞が関　総監室\n@show yuki left\nyuki.n: 総監、きょうの決裁は、これで最後です。おつかれさまでした。\nyuki.s: あ、それと。お父さまから伝言です。「晩めしは、さば」だそうです。\n@sfx phone\n@obj keitai shake\n*: 机の上で、自分のスマホがふるえている。画面には「Mom」。\n\n## in_call\n@tel margaret\nmargaret.t: ハニー？　ごめんね、仕事中に。……うちの病院が、止まったの。\nmargaret.n: カルテも、薬の機械も、全部。画面が真っ赤で、お金を払えって書いてある。\nmargaret.k: 子どもたちは大丈夫。紙で回してる。……でも、長くは、もたないわ。\n@tel off\n@bgm tension\ntsubasa.k: すぐ行きます。結城さん、ワシントン行き、いちばん早い便をお願いします。\nyuki.u: えっ、いまからですか。……はい、取ります。\nyuki.n: さばは、私からお父さまに謝っておきますね。\n\n## w_arrive\n@hide all\n@bg ward\n@bgm invest\n@card 4月15日（木）5:40｜ワシントン　聖ルカ小児病院\n@show margaret center\nmargaret.s: 来たのね。……顔色が悪いわ。飛行機で、ちゃんと寝た？\nmargaret.n: まあ、あとでいいわ。見て。これが、うちのナースステーションの、いま。\n@show reed left\nreed.n: FBIワシントン支局のリードです、総監。病院の中は、うちの者が押さえました。\nreed.k: 要求は20ビットコイン。およそ300万ドルです。署名は、東京と同じ。「ドーン」。\n@show mendes right\nmendes.n: 総監、こっちでは私が足を使います。ローゼンには、数字と記録を読んでもらう。\n@hide all\n*: この事件の「視点」は、翼、メンデス、ローゼン。メンデスは人に聞く。ローゼンは数字と記録を読む。\n\n## w_kusuri\n@obj kusuri glow\n*: 薬の払い出しの機械。画面は赤い。「20 BTC」。引き出しは、どれも開かない。\n@get ransom\n\n## w_chart\n@obj chart hop\n*: 紙のカルテの山。どの紙にも、手書きの時刻と名前。夜の間に、看護師たちが全部書き起こした。\n@show margaret center\nmargaret.n: 新生児の部屋は、紙で回せる。私が決めたの。\nmargaret.s: 機械がなくたって、子どもは診られるのよ。昔は、みんなそうだったんだから。\n@hide margaret\n\n## w_e\n*: 壁に、子どもたちの絵。ぞう、ふね、おはな。すみに「かんごしさん　ありがとう」と書いてある。\n\n## w_t_cruz\ncruz.d: ……私なんです。夜中の2時すぎに、メールが来て。「来月の勤務表」って。\ncruz.d: 開いたら、何も出なくて。変だなと思って、閉じました。\ncruz.d: そのあと、1時間もしないうちに、全部止まって。……私が、開けたから。\n@get mail\n\n## w_t_mom\nmargaret.n: いまのところ、誰も急変してない。薬は鍵の棚から手で出して、2人で確かめてる。\nmargaret.k: でもね、ハニー。理事会は、もう払う話をしてるわ。「300万ドルで子どもが守れるなら」って。\n\n## w_mail\n@obj mail on\n@show rosen center\nrosen.n: 偽の勤務表のメール、ありました。送り主は……あら。病院の本物のアドレスですね。\nrosen.k: 持ち主は、3年前に辞めた事務の職員です。辞めたのに、アドレスだけ生きてます。\n@hide rosen\n@get sender\n\n## w_tape\n@obj tape shake\n*: バックアップの棚。赤い印のついた物が、いくつもある。\n@show bates center\nbates.t: そ、それが……4日前から、少しずつ壊れていまして。気づいたのは、きのうなんです。\n@hide bates\n@get backup\n\n## w_keiyaku\n@obj keiyaku hop\n@show rosen center\nrosen.n: サイバー保険の契約書ですね。払われる上限は……300万ドル。\nrosen.k: 総監。20ビットコインは、きょうの値で、ほぼ300万ドルです。ぴったりですよ、これ。\n@hide rosen\n@get hoken\n\n## w_t_bates1\nbates.t: 消す係が、決まっていなかったんです。人事は「情報部がやる」と言って。\nbates.d: うちは「人事から言われたら消す」と……。結局、誰も消していませんでした。\n\n## w_t_bates2\nbates.n: メールは、外の業者に預けています。管理の画面は、業者の物でして。\nbates.n: 4日前の夜、その画面から、誰かが入っています。業者は「うちの者ではない」と言っています。\n@get gyousha\n\n## w_pre1\n@hide all\n@bgm calm\n@show cruz center\ncruz.d: 看護師長。……私、辞めます。辞めて、責任を取ります。\n@show margaret left\nmargaret.t: ナタリー……。\n\n## w_pre1b\ntsubasa.n: クルスさん。辞める前に、少しだけ聞いてください。\ntsubasa.n: 物を、順に見せます。\n\n## b1_c1\ncruz.d: 私がメールを開けたから、病院が止まったんです。\n## b1_o1\ntsubasa.k: あのメールは、病院の本物のアドレスから来ています。\ntsubasa.k: にせ物の印は、どこにもなかった。見分けられた人は、この病院に1人もいません。\ncruz.u: 本物の、アドレス……。\n\n## b1_c2\ncruz.t: でも……おかしいって、思うべきでした。\n## b1_o2\ntsubasa.k: アドレスの持ち主は、3年前に辞めた人です。\ntsubasa.k: 消さなかったのは、病院の側です。あなたじゃない。\ncruz.d: ……。\n\n## b1_c3\ncruz.d: それでも。私が開けなければ、あの人たちは入れなかった。\n## b1_o3\ntsubasa.k: バックアップは、4日前から壊されていました。\ntsubasa.k: あなたがメールを開ける4日前に、相手はもう中にいたんです。メールは、最後の合図にすぎません。\ncruz.u: 4日前、から……？\n\n## b1_c4\ncruz.t: じゃあ……私は、どうしていれば、よかったんですか。\n## b1_o4\nmendes.n: どうもしなくていい。あんたは夜勤で、子ども28人を見てた。それで十分だ。\nmendes.s: それとな。止まったあと、最初に紙のカルテを書き始めたのは、あんただって聞いたぞ。看護師長から。\ncruz.d: ……っ。\n\n## b1_end\n@bgm truth\nmargaret.s: ナタリー。辞表は受け取らないわよ。……今夜も夜勤、入れる？\ncruz.d: ……はい。入ります。\nmargaret.n: よろしい。……ありがとう、ハニー。\n@hide all\n\n## b1_miss\ncruz.d: ……それは、私のした事と、関係がありません。\n## b1_miss2\ncruz.d: 慰めは、いいんです。\n\n## w_fbi\n@bg fbi\n@bgm invest\n@card 4月15日（木）11:00｜FBIワシントン支局\n@show reed center\nreed.n: 総監、ここが支局です。机は、好きな所をどうぞ。\n@hide all\n\n## w_miss\n@show rosen center\n@bgm calm\nrosen.d: 総監。……すみません、私です。\nrosen.d: ドーンの財布の住所を、1文字、写し間違えました。半日、違う財布を追っていました。\nrosen.d: 数字の人間が、数字を間違えたんです。\n\n## w_miss_a\ntsubasa.s: 半日で気づいて、すぐ言ってくれた。それで十分です。\n## w_miss_b\ntsubasa.s: 間違えた先に、何があったか。一緒に見ましょう。\n## w_miss_c\ntsubasa.s: すぐ言ってくれて、ありがとうございます。助かります。\n\n## w_miss_after\n@show hamilton left\nhamilton.n: ……待ってください、ローゼン。その「違う財布」、動きがありますよ。\nrosen.u: え？\n@hide all\n@bgm invest\n\n## w_belta\n@obj pc2 on\n@show rosen center\nrosen.k: 間違えた財布、見直しました。……ドーンの別の財布と、取引しています。\nrosen.n: 偶然、仲間の財布に当たったんです。お金の先は、1つの入金口。取引所「ベルタ」です。\n@hide rosen\n@get belta\n\n## w_wb\n@obj wb glow\n*: ホワイトボードに、数字を2つ並べて書く。要求は20ビットコイン。保険の上限は300万ドル。同じ額だ。\n*: 病院は、保険の上限を、外に言った事がない。\n\n## w_t_ham\nhamilton.n: 業者の管理画面に入られた時刻が出ました。ワシントンの11日、朝9時31分です。\nhamilton.k: 東京の時間に直すと、11日の22時31分。……総監。東京の病院が開けられたのと、同じ分です。\n@get douji\n\n## w_t_reed\nreed.n: 理事会は、午後に決を採ります。払う方に傾いています。\nreed.k: FBIは勧めません。ですが、止める権限もありません。止めたいなら、理事を納得させる物が要ります。\n\n## w_pre2\n@hide all\n@bg rijikai\n@bgm tension\n@card 15:00｜聖ルカ小児病院　理事会の部屋\n@show bates center\nbates.t: 総監。理事会は、払うと決めかけています。\nbates.t: ここは子どもの病院です。ほかに、道がありません。\n\n## b2_c1\nbates.t: 相手は、金が欲しいだけです。払えば終わります。\n## b2_o1\ntsubasa.k: 要求は20ビットコイン。この病院の保険の上限と、同じ額です。\ntsubasa.k: 相手は、この病院がいくらまで払えるかを、初めから知っていた。\nbates.u: な……なぜ、それを。\n\n## b2_c2\nbates.t: 知っていたとしても、です。バックアップが壊れている以上、払うしかない。\n## b2_o2\ntsubasa.k: 4日前、メールの業者の管理画面から、誰かが入っています。バックアップが壊れ始めたのも、同じ4日前です。\ntsubasa.k: 壊れたんじゃない。壊されたんです。「払うしかない」と思わせるために、4日かけて。\nbates.d: 4日も、前から……。\n\n## b2_c3\nbates.t: ……では、うちの病院だけが、運悪く狙われたと。\n## b2_o3\ntsubasa.k: 入られたのは、東京の病院と同じ分です。2つの病院は、同じ夜に開けられた。\ntsubasa.k: 運じゃありません。選ばれたんです。\nbates.u: 東京と……同じ。\n\n## b2_c4\nbates.d: 選ばれた……。なら総監。払ったら、どうなるんです。\n## b2_o4\ntsubasa.k: 上限を知る事ができたのは、病院と、保険会社と、その間に立つ人だけです。\ntsubasa.k: 払っても、教えた者は残ります。次も、同じ額を取られる。\n\n## b2_end\n@bgm truth\nbates.d: ……理事には、私から話します。\nbates.n: 払わずに戻す道を、聞かせてください。\n\n## b2_miss\nbates.t: 総監、それでは理事は動きません。\n## b2_miss2\nbates.t: 時間がないんです。子どもたちの話をしているんですよ。\n\n## w_end_a\ntsubasa.k: 払いません。CISAと一緒に、72時間で戻します。その間は、紙で。\n## w_end_b\ntsubasa.k: 払いません。交渉は引き延ばします。その間に、CISAと戻します。\n\n## w_end2\n@hide all\n@bg ward\n@bgm calm\n@card 4月15日（木）19:30｜ナースステーション\n@show margaret center\nmargaret.s: 72時間ね。紙なら、うちの子たちはもう慣れたわ。ナタリーなんか、字がきれいになったって。\n@show reed left\nreed.n: 総監。理事会が、交渉の専門の会社を雇ったそうです。「パラディン・リスク」。腕はいい、と聞いています。\n@show mendes right\nmendes.k: ……腕がいい、ね。\n@hide reed\n@hide mendes\nmargaret.s: ハニー。朝になったら、パンケーキ焼くから。3枚。……4枚にする？\n\n## w_hook\n@hide all\n@bgm tension\n*: 2つの病院は、同じ夜、同じ分に開けられた。\n*: 誰かが、時計を合わせている。\n", "003": "# FILE 003 交渉人\n@intro 身代金を半分に下げてみせた、腕のいい交渉人。だが、相手の返事が、早すぎる。\n@next FILE 004「保険の約款」につづく\n@end S シャピロ「総監、これなら陪審に勝てます。1つも足す物がありません」\n@end A マーガレット「払わずに済んだのね。……ハニー、少し寝なさい」\n@end B ローゼン「総監、数字はまだ隠れています。次は、もっと早く見つけます」\n@view tsubasa 翼 | 物を見て、筋を通す\n@view mendes メンデス | 人に聞く。足で稼ぐ\n@view rosen ローゼン | 数字と記録を読む\n@char rosen name=ローゼン role=FBIの会計担当の捜査官 sex=f skin=#f2d0bb hair=#a8683a hs=wavy eye=#4a9a5a es=soft tilt=-3 jaw=0 brow=1.8 gl=round fit=suit:#3d4a44:#f3efe8 pose=tablet\n@char blair name=ブレア role=パラディン・リスク社の交渉担当 sex=m skin=#f0c8a6 hair=#c89a4a hs=slick eye=#3a9ad6 es=cool tilt=-4 jaw=1 brow=2.2 sm=1 fit=suit:#8a7a5a:#f4f7fb:#c23a4a pose=cross v=M,1.16,1.03,1.12,1.20\n@ev hayai 早すぎる返事 | 速 | 交渉のチャット。ドーンの返事は、毎回2分以内。夜中の3時でも同じ。\n@ev tesuryo 手数料の決まり | 料 | パラディン社は、病院が払った身代金の15％を、手数料で受け取る。\n@ev sanjunana 37件の実績 | 件 | ブレアがこの2年に扱った交渉は37件。相手は、37件ともドーン。\n@ev jougen 最初の要求の額 | 額 | 37件とも、ドーンの最初の要求は、その病院の保険の上限と同じ額だった。\n@ev gopa ブレアの財布 | 財 | ブレアの個人の財布に、ドーンの財布から毎回、身代金の5％が入っている。換金先は取引所ベルタ。\n@ev tsuwa 通話の記録 | 話 | 37件とも、要求が来る前の週に、ブレアは保険の仲介業者と電話している。\n@ev kesu 消そうとした跡 | 消 | ゆうべ、ブレアは会社のサーバーの記録を消そうとした。操作の跡が、全部残っている。\n\n@place c1 start=paladin need=hayai,tesuryo,sanjunana,f:kotowari,kesu,jougen,gopa,tsuwa\n@loc paladin パラディン・リスク社 bg=paladin people=blair\n@hs chat tsubasa 350,50,220,144 交渉のチャット -> n_chat\n@hs laptop rosen 410,184,100,80 机のパソコン -> n_laptop\n@hs sofa any 50,230,190,84 赤いソファ -> n_sofa\n@talk blair tsubasa チャットを、全部見せてください -> n_t_blair1 | f=kotowari\n@talk blair mendes どうやって、半分に下げたんですか -> n_t_blair2 | f=shippai\n@loc fbi FBIワシントン支局 bg=fbi people=shapiro,hamilton cond=f:shippai enter=mendesmiss:miss\n@hs wb tsubasa 244,42,184,116 ホワイトボード -> [sanjunana]n_wb n_wb0 | done=jougen\n@hs pc2 rosen 392,176,104,82 ローゼンの画面 -> [sanjunana]n_gopa n_gopa0 | done=gopa\n@talk shapiro tsubasa これで、逮捕できますか -> [!gopa]n_t_shap0 [!jougen]n_t_shap0 n_t_shap1 | rep=1\n\n@battle b1 foe=blair title=ブレアの芝居を崩せ bg=paladin miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev hayai b1_o1 | 相手の返事の速さが、おかしい。「証拠」。\n@ph b1_c2 ev sanjunana b1_o2 | この2年、ブレアの相手は誰だったか。「証拠」。\n@ph b1_c3 ev jougen b1_o3 | 37件の、最初の数字に注目。「証拠」。\n@ph b1_c4 ev tsuwa b1_o4 | ブレアは、要求の前に誰と話していたか。「証拠」。\n@ph b1_c5 obs eyes b1_o5 | 「観察」。笑顔は動かない。動いているのは、別の所だ。 | eyes:目:84,92,90,38 | mouth:口:106,140,52,26 | arms:腕:44,254,150,60\n@ph b1_c6 ev kesu b1_o6 | ゆうべ、ブレアが何をしたか。「証拠」。\n@ph b1_c7 ded 1 b1_o7 | 「推理」。ブレアは、ドーンの何なのか。正しく言おう。 | あなたは、ドーンの仲間です | あなたは、ドーンの客です。上限を売り、下げる芝居で、両方から金を取った | あなたが、ドーンの頭です\n\n@flow miss\n play n_miss\n ask メンデスに、何と言う？ | 相手を安心させたかったんですね -> n_miss_a | 言ってしまった物は、使いましょう -> n_miss_b | すぐ言ってくれて、助かります -> n_miss_c\n play n_miss_after\n@flow main\n cp\n play n_intro\n ask 母に、何と答える？ | まだ払わないで。交渉人に会ってくる -> n_intro2\n banner FILE 003 | 交渉人\n cp\n play n_arrive\n inv c1\n cp\n play n_pre\n battle b1\n ask 翼は、ブレアに何と言う？ | 静かに告げる -> n_calm | !鬼のように怒る -> n_angry\n ask ブレアを、どうする？ | 逮捕する -> n_end_a | 司法取引で、証人にする -> n_end_b | 泳がせて、次の払いを見張る -> n_end_c\n play n_end2\n\n## n_intro\n@bg ward\n@bgm calm\n@card 4月20日（火）8:20｜聖ルカ小児病院\n@show margaret center\nmargaret.n: ハニー、聞いて。交渉の会社の人が、相手を10ビットコインまで下げたんですって。半分よ。\nmargaret.t: 理事会は、それなら払うって。きょうの午後に決めるわ。\nmargaret.k: ……ねえ。払うの？　それで、いいの？\n\n## n_intro2\ntsubasa.k: まだ払わないで。その交渉人に、会ってきます。\nmargaret.s: そう言うと思った。……コート、着ていきなさい。\n\n## n_arrive\n@hide all\n@bg paladin\n@bgm invest\n@card 9:30｜パラディン・リスク社\n@show blair center\nblair.s: ようこそ、総監。ケヴィン・ブレアです。お会いできて光栄ですよ。\nblair.s: 20から10へ。300万ドルが、150万ドルです。病院の皆さんにも、喜んでいただけました。\nblair.n: 相手はプロです。こちらもプロでないと、話になりませんからね。\n@hide all\n\n## n_chat\n@obj chat glow\n*: 壁の画面に、交渉のチャット。病院の側の言葉と、ドーンの返事が、交互に並んでいる。\n*: ドーンの返事は、毎回2分以内だ。夜中の3時の返事も、1分40秒で来ている。\n@get hayai\n\n## n_laptop\n@obj laptop on\n@show rosen center\nrosen.n: 契約の紙が出てます。手数料は、病院が払った身代金の15％。……いい商売ですね。\nrosen.k: それと、実績の一覧。この2年で37件。……総監。相手の欄、37件とも「ドーン」です。\n@hide rosen\n@get tesuryo\n@get sanjunana\n\n## n_sofa\n*: 赤い革のソファ。客は、ここで「半分になりました」と聞かされる。\n\n## n_t_blair1\nblair.s: チャットを全部、ですか。お見せしたいのは山々ですが。\nblair.n: 会社の決まりでして。交渉の中身は、お客さまにも全部はお見せしていないんです。やり方は、商売の種ですから。\n\n## n_t_blair2\nblair.s: 腕、としか言いようがありませんね。相手の息づかいを読むんです。\n@show mendes left\nmendes.s: なるほど。……まあ、安心してください。FBIは、あなたを調べてるわけじゃないんで。\nblair.s: それは、ありがたい。\n*: 「移動」に、FBIワシントン支局が増えた。\n\n## n_miss\n@show mendes center\n@bgm calm\nmendes.d: 総監。……すみません、私です。\nmendes.d: ブレアに「FBIはあなたを調べていない」と言いました。口を軽くさせたくて。\nmendes.d: 嘘です。それに、相手に手の内を教えたのと同じだ。\n\n## n_miss_a\ntsubasa.s: 相手を安心させたかったんですね。分かります。\n## n_miss_b\ntsubasa.s: 言ってしまった物は、戻りません。使いましょう。\n## n_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## n_miss_after\n@show hamilton left\nhamilton.n: 総監、その事なんですが。ゆうべ、パラディン社のサーバーで、記録を消す操作がありました。\nhamilton.k: 操作したのは、ブレアのアカウントです。消そうとした跡が、全部残っています。\n@show mendes right\nmendes.u: ……安心して、掃除を始めたのか。\n@hide all\n@bgm invest\n@get kesu\n\n## n_wb0\n*: ホワイトボードは、まだ白い。並べる数字が、足りない。\n\n## n_wb\n@obj wb glow\n*: 37件の、ドーンの最初の要求の額を、ホワイトボードに並べる。隣に、それぞれの病院の保険の上限を書く。\n*: 37行とも、左と右が、同じ数字になった。\n@get jougen\n\n## n_gopa0\n@show rosen center\nrosen.n: 追う財布が、まだ決まりません。ブレアの扱った件の一覧があれば、早いんですが。\n@hide rosen\n\n## n_gopa\n@obj pc2 on\n@show rosen center\nrosen.k: ブレアの個人の財布、見つけました。ドーンの財布から、37回、入金があります。\nrosen.n: 額は毎回、身代金の5％。換金先は、取引所ベルタ。口座の名義は、実体のない会社です。\n@hide rosen\n@get gopa\n\n## n_t_shap0\nshapiro.n: 総監、それでは陪審に勝てません。もう1つください。数字の裏づけが、足りない。\n\n## n_t_shap1\nshapiro.n: 数字はそろいました。……あと1つ。「誰から上限を聞いたか」が要ります。\nshapiro.s: と思って、携帯会社に照会しておきました。37件とも、要求の前の週に、ブレアは保険の仲介業者と電話しています。\n@get tsuwa\n\n## n_pre\n@hide all\n@bg paladin\n@bgm tension\n@card 14:00｜パラディン・リスク社\n@show blair center\nblair.s: おや、総監。また、いらしたんですか。\nblair.n: 理事会は、もうすぐ決を採りますよ。150万ドル。皆さん、納得されています。\n\n## b1_c1\nblair.s: 私は病院の味方ですよ、総監。半分に下げたんですから。\n## b1_o1\ntsubasa.k: ドーンの返事は、毎回2分以内です。夜中の3時でも。\ntsubasa.k: 相手は、あなたの言葉を、画面の前で待っていた。まるで、台本があるみたいに。\nblair.n: ……相手も、急いでいるんでしょう。\n\n## b1_c2\nblair.s: 向こうも商売です。早く終わらせたいのは、お互いさまですよ。\n## b1_o2\ntsubasa.k: この2年、あなたが扱った交渉は37件。相手は、37件ともドーンです。\ntsubasa.k: ランサムの集団は、世界に何十もあります。\nblair.n: ドーンは大手ですから。重なる事もあります。\n\n## b1_c3\nblair.s: 偶然ですよ。大きな相手ほど、よく当たる。それだけの事です。\n## b1_o3\ntsubasa.k: 37件とも、最初の要求は、その病院の保険の上限と同じ額でした。\ntsubasa.k: 上限を知っている誰かが、37回、ドーンのそばにいた。\nblair.t: ……私は、上限など知りません。\n\n## b1_c4\nblair.n: 私は交渉人です。保険の中身を知る立場に、ありませんよ。\n## b1_o4\ntsubasa.k: 37件とも、要求が来る前の週に、あなたは保険の仲介業者と電話しています。\nblair.t: ……世間話です。業界の、付き合いで。\n\n## b1_c5\nblair.s: 電話くらい、誰でもするでしょう。……それで、何が言いたいんです。\n## b1_o5\ntsubasa.k: さっきから、机のパソコンばかり見ていますね。\ntsubasa.k: 見られたくない物が、あそこにある。\nblair.u: ……！\n\n## b1_c6\nblair.a: 何も、隠してなどいない！\n## b1_o6\ntsubasa.k: ゆうべ、あなたは会社のサーバーの記録を消そうとしました。操作の跡が、全部残っています。\ntsubasa.k: FBIが「調べていない」と言った、その夜にです。\nblair.u: あ、あれは……整理を……。\n\n## b1_c7\nblair.a: 私は、ドーンの仲間じゃない！　あんな連中と、一緒にしないでくれ！\n## b1_o7\ntsubasa.k: ええ。仲間じゃない。あなたは、ドーンの客です。\ntsubasa.k: 保険の上限を聞き出して、ドーンに売った。交渉で半分に下げてみせて、病院から15％、ドーンから5％。\ntsubasa.k: 両方から、取っていた。\n\n## b1_end\n@bgm truth\nblair.d: ……誰も、損はしていない。\nblair.d: 病院は半額で済んだ。保険は下りる。ドーンは金を得る。……全員が、少しずつ得をする仕組みなんだ。\n\n## b1_miss\nblair.s: 総監。お疲れのようですね。\n## b1_miss2\nblair.s: それが、私と何の関係があるんでしょう。\n\n## n_calm\ntsubasa.k: 損をしたのは、夜の間、紙でカルテを書いた看護師たちです。\ntsubasa.k: それと、あなたの台本どおりに、怖がらされた親たちです。\n## n_angry\n@sfx shock\ntsubasa.a: 子どもの病院だぞ！\ntsubasa.a: 薬の機械が止まった夜、看護師は2人1組で、手で薬を数えてたんだ。あんたの「仕組み」のために！\n*: ブレアの笑顔が、初めて消えた。\n\n## n_end_a\ntsubasa.k: ブレアさん。恐喝の共謀と、証拠を消そうとした疑いで、逮捕します。\n@obj tejou close\n@sfx cuff\nshapiro.n: 罪状は私が読みます。……14時42分。\n## n_end_b\ntsubasa.k: 取引をしましょう。ドーンの窓口を、全部話してください。\nshapiro.n: 条件は私が詰めます。総監、いい判断だと思います。\n## n_end_c\ntsubasa.k: きょうは、ここまでにします。……理事会には、払わないように伝えます。\nshapiro.t: 泳がせる、ですか。見張りは、24時間つけます。\n\n## n_end2\n@hide all\n@bg ward\n@bgm calm\n@card 4月20日（火）18:00｜聖ルカ小児病院\n@show margaret center\nmargaret.s: 理事会、払わないって。CISAの人たちが、あと1日で戻すそうよ。\nmargaret.n: ……交渉人の人、最初に会った時から、笑顔が動かなかったの。看護師は、ああいう顔を信じないのよ。\n@show rosen left\nrosen.k: 総監。ブレアに上限を教えていた仲介業者ですが。東京の、東都医科大学病院の保険も扱っています。\n@hide all\n@bgm tension\n*: 東京の病院の要求も、保険の上限と同じ額だった。上限は、東京でも漏れている。\n", "004": "# FILE 004 保険の約款\n@intro 保険会社から、病院の名簿と「払える上限」の表が漏れた。記録は、1人の部長を指している。\n@next FILE 005「二重の脅迫」につづく\n@end S 小野寺「総監。宇野さんの奥さんから、菓子折りが届いてますよ。……私あてに」\n@end A 早瀬「宇野さんに謝ってきました。総監、止めてくれて助かりました」\n@end B 千早「総監、次は更新の記録、最初に見ます！」\n@meta have=tejou\n@char uno name=宇野 role=あおば損保のサイバー保険の部長 sex=m skin=#f0cdb0 hair=#3a3a40 hs=neat eye=#5a6a7a es=half tilt=6 jaw=1 brow=2.4 gl=rect fit=shirt:#e4e8ee:#fff pose=stand v=M,1.04,1.00,0.94,0.75\n@char unowife name=宇野の妻 role=宇野の家族 sex=f skin=#f8dcc8 hair=#4a3a32 hs=bob eye=#7a5a4a es=soft tilt=4 jaw=0 brow=1.8 fit=shirt:#d8c8e0:#fff pose=stand v=F,0.92,0.98,1.02,0.90\n@ev tejou 伯父の手錠 | 錠 | 父の兄が警視庁で30年使った手錠。\n@ev kiroku3ji 共有フォルダの記録 | 記 | 4月2日の夜中3時4分、宇野のIDで、名簿のある共有フォルダに入った記録。\n@ev jougen7 上限の表 | 表 | あおば損保の名簿。病院ごとの「払える上限」が載っている。東都医科大学病院は7億円。001の要求と同じ額。\n@ev hotel ホテルの記録 | 宿 | 4月2日の夜、宇野は大阪のホテルにいた。部屋の鍵は、0時から朝6時まで動いていない。\n@ev shashin 画面の写真 | 写 | 宇野の妻が撮った写真。4月2日の3時1分、家のパソコンが勝手に動き、「保守ツールを更新しています」と出ている。\n@ev koushin 更新の記録 | 更 | 宇野のパソコンの保守の道具が、4月2日3時1分に更新された。その更新に、IDを抜き取る物がまぎれていた。\n@ev kengen 管理の権限の一覧 | 権 | その保守の道具に更新を出せるのは、管理の権限を持つ者だけ。一覧に、メディコア・ジャパンの堀健吾。\n@ev kuse 出品の文の癖 | 癖 | 売り主「アジャスター」の出品の文は、001の「保守の入口」の出品と、言い回しも句読点も同じ。\n@ev saifu 受け取りの財布 | 財 | 「アジャスター」が代金を受け取った財布は、堀が0.3ビットコインを受け取った財布と同じ。\n\n@place c1 start=aoba need=kiroku3ji,jougen7,hotel,shashin,koushin\n@loc aoba あおば損保 bg=aoba people=hayase\n@hs kyoyu chihaya 204,178,108,84 共有フォルダの画面 -> y_kyoyu\n@hs meibo tsubasa 322,220,66,44 名簿の表 -> y_meibo\n@hs cab onodera 34,94,104,182 書類の棚 -> y_cab\n@talk hayase tsubasa 宇野部長は、いまどこに -> y_t_hayase\n@loc home 宇野の家 bg=home people=uno,unowife cond=f:ie enter=onoderamiss:miss\n@hs homepc chihaya 394,176,104,82 家のパソコン -> [shashin]y_homepc y_homepc0 | done=koushin\n@hs photo any 268,48,74,62 家族の写真 -> y_photo\n@talk uno onodera 4月2日の夜は、どこにいましたか -> y_t_uno\n@talk unowife onodera あの夜、家で何かありませんでしたか -> y_t_wife\n\n@place c2 start=tokumei need=kengen,kuse,saifu\n@loc tokumei 特命班の部屋 bg=tokumei people=sawaguchi,mendes objs=screenT:on\n@hs logs chihaya 46,76,228,148 保守の道具の記録 -> y_kengen\n@talk sawaguchi any 「アジャスター」の出品について -> y_t_sawa\n@talk rosen tsubasa 代金の流れは、追えましたか -> y_t_rosen\n\n@battle b1 foe=hayase title=宇野への疑いを止めろ bg=aoba miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev hotel b1_o1 | その夜、宇野はどこにいたか。「証拠」。\n@ph b1_c2 ev shashin b1_o2 | 同じ時刻、宇野の家で起きていた事がある。「証拠」。\n@ph b1_c3 ded 0 b1_o3 | 「推理」。宇野のIDは、どうやって使われたか。 | 保守の道具の更新にまぎれて、IDが抜き取られた | 宇野の妻が、夫のIDで入った | 宇野が、ホテルから家のパソコンを動かした\n@battle b2 foe=hori title=「アジャスター」の名を言わせろ bg=interview miss=b2_miss,b2_miss2 end=b2_end\n@ph b2_c1 ev kengen b2_o1 | 堀が出入りできた場所は、病院だけではない。「証拠」。\n@ph b2_c2 ev koushin b2_o2 | 宇野のパソコンに、何が、いつ入ったか。「証拠」。\n@ph b2_c3 obs mouth b2_o3 | 「観察」。ある名前を言う時だけ、どこかが震える。 | eyes:目:84,92,90,38 | mouth:口:106,140,52,26 | wrist:手首:80,282,92,50\n@ph b2_c4 ev saifu b2_o4 | 「アジャスター」の代金は、どこに入ったか。「証拠」。\n@ph b2_c5 ded 2 b2_o5 | 「推理」。名簿は、何に使われたか。 | 保険会社を、ゆするため | 自分の保険料を、下げるため | どの病院がいくらまで払えるかを、ドーンの側に売るため\n\n@flow miss\n play y_miss\n ask 小野寺に、何と言う？ | 奥さんには、私からも話します -> y_miss_a | 言ってしまったなら、ちゃんと聞きましょう -> y_miss_b | すぐ言ってくれて、助かります -> y_miss_c\n play y_miss_after\n@flow main\n cp\n play y_intro\n banner FILE 004 | 保険の約款\n cp\n play y_arrive\n inv c1\n cp\n play y_pre1\n ask 翼は、どうする？ | 待ってください、早瀬課長 -> y_pre1b\n battle b1\n cp\n play y_mid\n inv c2\n cp\n play y_pre2\n battle b2\n ask 堀を、どうする？ | 証人にする。ドーンとの連絡の方法を話させる -> y_end_a | 名簿の件も、追って起訴する -> y_end_b\n ask 宇野さんの事を、世間にどう伝える？ | 「宇野さんは被害者です」と、警察からはっきり言う -> y_uno_a | 発表は、会社に任せる -> y_uno_b\n play y_end2\n\n## y_intro\n@bg tokumei\n@bgm invest\n@card 4月26日（月）9:00｜特命班の部屋\n@show sawaguchi left\nsawaguchi.n: 総監、ダークウェブに、また嫌な物が出ました。「あおば損保」の顧客の名簿です。\nsawaguchi.k: 病院ごとに、保険で払える上限の額がついてます。売り主の名前は「アジャスター」。\n@show hayase right\nhayase.n: あおば損保には、もう入りました。名簿のあるフォルダに入った記録は、1つだけです。\nhayase.k: サイバー保険の部長、宇野直人のID。4月2日の、夜中の3時。……本人は、いま会社を休んでいます。\n\n## y_arrive\n@hide all\n@bg aoba\n@card 10:30｜千代田区　あおば損保\n@show hayase center\nhayase.n: ここが宇野の部です。席は、あの窓ぎわ。……きょう、任意で話を聞くつもりです。\n@hide all\n\n## y_kyoyu\n@obj kyoyu on\n@show chihaya center\nchihaya.n: 共有フォルダの記録、出しました。4月2日の3時4分。宇野さんのIDで、名簿を全部開いてます。\nchihaya.t: ……きれいすぎるんですよね。迷わずに、まっすぐ名簿だけ。慣れた人の動きです。\n@hide chihaya\n@get kiroku3ji\n\n## y_meibo\n@obj meibo hop\n*: 名簿の表。病院の名前の横に、保険で払える上限の額。\n*: 東都医科大学病院は、7億円。……001で、ドーンが最初に要求した額と、同じだ。\n@get jougen7\n\n## y_cab\n@obj cab open\n@show onodera center\nonodera.n: 出張の届が出てきましたよ。宇野さん、4月1日から3日まで、大阪です。\nonodera.k: ホテルにも聞きました。2日の夜、部屋の鍵は、0時から朝6時まで動いてません。\n@hide onodera\n@get hotel\n\n## y_t_hayase\nhayase.n: 自宅です。疑われてから、会社に出てこられなくなって。\nhayase.t: ……正直、私は宇野だと思っています。IDが、そう言っているので。\n*: 「移動」に、宇野の家が増えた。\n@flag ie\n\n## y_miss\n@show onodera center\n@bgm calm\nonodera.d: 総監。……すみません、私です。\nonodera.d: 玄関先で、奥さんの前で言ってしまいました。「ご主人のIDで、名簿が盗まれた件で」と。\nonodera.d: 奥さん、何も聞かされていなかったんです。顔が、真っ白になって。\n\n## y_miss_a\ntsubasa.n: 奥さんには、私からも話します。一緒に行きましょう。\n## y_miss_b\ntsubasa.n: 言ってしまったなら、ちゃんと最後まで聞きましょう。奥さんの話も。\n## y_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## y_miss_after\n@show unowife left\nunowife.t: あの……いまのお話。夫が出張だった夜の事ですよね。4月の、2日。\nunowife.k: 私、あの夜の事、覚えています。……変な事が、あったので。\n@hide all\n@bgm invest\n\n## y_t_uno\nuno.d: 大阪です。ホテルで、寝ていました。……誰も、信じてくれませんが。\nuno.d: 20年、この会社で保険を売ってきました。お客さんの秘密を守るのが、仕事だったんです。\n\n## y_t_wife\nunowife.n: 夜中に目が覚めたら、夫の机のパソコンが、ひとりでに光っていたんです。\nunowife.k: 誰も触っていないのに、画面が動いて。怖くて、スマホで写真を撮りました。……これです。\n@obj sumaho hop\n@get shashin\n\n## y_homepc0\n@show chihaya center\nchihaya.n: 会社から持ち帰ってる仕事用のパソコンですね。……どこから見ましょう。手がかりが欲しいです。\n@hide chihaya\n\n## y_homepc\n@obj homepc on\n@show chihaya center\nchihaya.k: 写真と同じ時刻の記録、ありました。3時1分、保守の道具が更新されてます。\nchihaya.u: ……総監、これ。更新の中に、IDとパスワードを抜き取る物が、まぎれてます。\nchihaya.n: この保守の道具、どこかで見たんですよね。……あ。メディコアの、病院のやつです。\n@hide chihaya\n@get koushin\n\n## y_photo\n*: 棚の上に、家族の写真。宇野と、妻と、小学生くらいの娘。うしろに、大阪城。\n\n## y_pre1\n@hide all\n@bg aoba\n@bgm tension\n@card 15:00｜あおば損保\n@show hayase center\nhayase.k: 総監。宇野に、任意同行を求めます。\nhayase.n: 記録は、宇野のIDです。ほかに、入った者はいません。\n\n## y_pre1b\ntsubasa.k: 待ってください、早瀬課長。IDは、本人とは限りません。\n\n## b1_c1\nhayase.n: フォルダに入ったのは、宇野のIDです。本人でしょう。\n## b1_o1\ntsubasa.k: その時刻、宇野さんは大阪のホテルにいました。部屋の鍵は、朝まで動いていません。\nhayase.n: ……ホテルの部屋からでも、遠隔で入れますよ。\n\n## b1_c2\nhayase.k: ホテルから、自分のパソコンにつないで入った。それで説明がつきます。\n## b1_o2\ntsubasa.k: 同じ夜の3時1分、宇野さんの家のパソコンが、ひとりでに動いています。奥さんが写真を撮っていました。\ntsubasa.k: 画面には「保守ツールを更新しています」。本人が操作したなら、こんな画面は出ません。\nhayase.u: 更新……？\n\n## b1_c3\nhayase.t: ……では、誰が、どうやって宇野のIDを。\n## b1_o3\ntsubasa.k: 保守の道具の更新に、IDを抜き取る物がまぎれていました。\ntsubasa.k: 3時1分に抜き取り、3時4分に名簿を開いた。宇野さんは、盗まれた側です。\n\n## b1_end\n@bgm truth\nhayase.d: ……3分で、ですか。\nhayase.n: 宇野さんに、謝らないといけませんね。……私が行きます。\n@hide all\n\n## b1_miss\nhayase.n: 総監、それは宇野の話と、つながりません。\n## b1_miss2\nhayase.t: IDの記録を、くつがえせる物をください。\n\n## y_mid\n@bg tokumei\n@bgm invest\n@card 4月27日（火）9:00｜特命班の部屋\n@show chihaya center\nchihaya.k: 総監。あの保守の道具、調べ直します。更新を出せる人は、限られてるはずなんで。\n@hide all\n\n## y_kengen\n@obj logscroll on\n@show chihaya center\nchihaya.n: 出ました。あの道具に更新を出せるのは、「管理の権限」を持つ人だけです。全部で6人。\nchihaya.u: ……6人目。メディコア・ジャパン、保守担当、堀健吾。\n@hide chihaya\n@get kengen\n\n## y_t_sawa\nsawaguchi.n: 「アジャスター」の出品の文、読みこみました。癖があるんです。\nsawaguchi.k: 「。」のあとに必ず半角の空きが1つ。値段の書き方も。……001の「保守の入口」の出品と、同じ書き手です。\n@get kuse\n\n## y_t_rosen\nrosen.n: 総監、名簿の代金の流れ、追えました。受け取った財布に、見覚えがあります。\nrosen.k: 堀が、病院の入口の代金、0.3ビットコインを受け取った財布。同じ物です。\n@get saifu\n\n## y_pre2\n@hide all\n@bg interview\n@bgm tension\n@card 4月27日（火）14:00｜東京拘置所　接見室\n@show hori center\nhori.d: ……総監。全部、話しました。病院の入口を売った事は。\nhori.d: もう、話す事は、何もありません。\n\n## b2_c1\nhori.d: 私が売ったのは、病院の入口だけです。\n## b2_o1\ntsubasa.k: あなたは、保守の道具の「管理の権限」を持っていました。\ntsubasa.k: あの道具は、病院だけじゃない。あおば損保のパソコンにも入っています。\nhori.t: ……持っていた、だけです。\n\n## b2_c2\nhori.t: 権限があっただけで、使ってはいません。\n## b2_o2\ntsubasa.k: 4月2日の3時1分。宇野部長のパソコンに、保守の道具の更新が入りました。IDを抜き取る物と一緒に。\ntsubasa.k: 更新を出せるのは、6人だけです。\nhori.t: 6人も、いるじゃないですか……。\n\n## b2_c3\nhori.t: 私じゃない。……「アジャスター」なんて名前は、知りません。\n## b2_o3\ntsubasa.k: いま、その名前を言う時だけ、唇が震えました。\ntsubasa.k: 私は、まだその名前を、あなたに言っていません。\nhori.u: ……あ……。\n\n## b2_c4\nhori.t: な、名前は……取り調べで、誰かが言ったのを、聞いたんです。\n## b2_o4\ntsubasa.k: 「アジャスター」が名簿の代金を受け取った財布は、あなたが0.3ビットコインを受け取った財布と、同じです。\nhori.d: ……。\n\n## b2_c5\nhori.d: ……。\n## b2_o5\ntsubasa.k: 堀さん。あなたは名簿を盗んで、「どの病院が、いくらまで払えるか」を売った。\ntsubasa.k: 東都医科大学病院は7億円。三浦さんの病院の値段を決めたのも、あなたです。\n\n## b2_end\n@bgm truth\nhori.d: ……眠れないんです。あれから、1度も。\nhori.d: 三浦部長が死んだと聞いた夜から。目を閉じると、あの廊下の自販機が出てくる。\nhori.n: 総監。名簿に金を払ったのは、ドーンじゃありません。若い声でした。日本語の。……「下請け」だと、名乗っていました。\n\n## b2_miss\nhori.d: ……それは、もう話した事です。\n## b2_miss2\nhori.t: 関係が、ありません。\n\n## y_end_a\ntsubasa.k: 堀さん。「下請け」との連絡の方法を、全部話してください。証人として。\nhori.d: ……話します。それで、少しでも眠れるなら。\n## y_end_b\ntsubasa.k: 名簿の件も、起訴します。そのうえで、「下請け」の事を話してください。\nhori.d: ……はい。全部、話します。\n\n## y_uno_a\ntsubasa.k: 「宇野さんは被害者です」と、警察からはっきり言います。\n## y_uno_b\ntsubasa.n: 発表は会社に任せます。ただ、宇野さんには、私から直接伝えます。\n\n## y_end2\n@hide all\n@bg home\n@bgm calm\n@card 4月28日（水）19:00｜宇野の家\n@show uno center\nuno.s: ……あした、会社に行きます。20年分の机が、待っているので。\n@show unowife left\nunowife.s: 写真、撮っておいてよかった。怖がりも、役に立つんですね。\n@show onodera right\nonodera.s: 奥さん。あの写真がなかったら、私ら、まだ迷ってましたよ。\n@hide all\n@bgm tension\n*: 名簿を買ったのは、ドーンではなく「下請け」。若い声の、日本語を話す者。\n", "005": "# FILE 005 二重の脅迫\n@intro 漏れた患者の記録を使って、プロ野球の投手が脅された。だが、その文は、ドーンの物ではなかった。\n@next FILE 006「サーバーの国」につづく\n@end S 久我「総監。次の登板、見に来てください。……あの子と一緒に」\n@end A 早瀬「穴は閉じました。総監、4000人の次は、出ません」\n@end B 千早「総監、次は口にチャックします。記者さんの前では、特に！」\n@char kuga name=久我 role=プロ野球の投手。背番号18 sex=m skin=#e8c09a hair=#2a2420 hs=buzz eye=#6a4a2a es=cool tilt=-3 jaw=2 brow=3 wide=1 fit=work:#1d3a6a:#fff:18 patchc=#ffffff pose=stand v=M,0.90,0.95,0.96,0.85\n@char bengoshi name=弁護士 role=久我の代理人 sex=f skin=#f8dcc8 hair=#2a2a34 hs=long eye=#5a6a8a es=cool tilt=-4 jaw=0 brow=1.9 gl=rect fit=suit:#2e3440:#f4f7fb pin=1 pose=tablet v=F,0.86,0.96,1.08,0.80\n@char shonen name=少年 role=17歳。高校2年 sex=m skin=#f6d4b8 hair=#2a2e36 hs=messy eye=#4a7a9a es=round tilt=4 jaw=0 brow=2.2 fit=shirt:#f4f4f4:#fff:#2a3a6a pose=stand v=M,1.42,1.07,1.06,1.10\n@ev bunmen 脅迫メールの文 | 文 | 「肩の手術の記録を出されたくなければ、1000万円」。日本語がとても自然。ドーンの文は、いつも機械で訳したような日本語。\n@ev kouza 書いていない物 | 空 | 脅迫メールには、金を受け取る口座も、財布も、期限も書いていない。\n@ev camera 店のカメラ | 映 | 大阪のネットカフェ。メールが送られた時刻、その席に、高校の制服の少年。\n@ev gimei 会員の名前 | 偽 | ネットカフェの会員の帳面。その席の客が書いた名前は「久我翔太」。投手本人の名前。\n@ev page 出ていない1ページ | 頁 | 少年がメールにつけた記録の中に、ドーンの漏えいサイトには出ていない1ページがある。\n@ev chokusetsu 取った先 | 直 | 少年は、漏えいサイトではなく、病院の検査の機械から、記録を直接取っていた。\n@ev ana 開いたままの入口 | 穴 | 病院の検査の機械に、ドーンが残した入口が、まだ1つ開いている。誰でも、そこから患者の記録を取れる。\n\n@place c1 start=ousetsu need=bunmen,kouza,camera,gimei,page\n@loc ousetsu 警視庁_応接室 bg=ousetsu people=kuga,bengoshi\n@hs tegami tsubasa 280,258,72,44 脅迫メールの写し -> d_tegami\n@talk bengoshi onodera メールに、払い方は書いてありましたか -> d_t_ben\n@talk kuga onodera 肩の事を、教えてください -> d_t_kuga\n@loc netcafe 大阪_ネットカフェ bg=netcafe\n@hs camera chihaya 278,12,74,40 店のカメラ -> d_camera\n@hs chobo onodera 560,200,72,56 会員の帳面 -> d_chobo\n@hs seki2 chihaya 222,116,150,160 送り主の席 -> d_seki\n\n@place c2 start=dorm need=chokusetsu,ana,f:wake\n@loc dorm 少年の部屋 bg=dorm people=shonen\n@hs hpc chihaya 372,174,116,90 少年のパソコン -> d_hpc\n@hs posterg any 54,44,102,122 壁のポスター -> d_poster\n@talk shonen onodera どうして、あんなメールを書いたの -> d_t_shonen | f=wake\n@loc kensa 病院の検査室 bg=kensa cond=chokusetsu\n@hs kensaki chihaya 54,84,164,194 検査の機械 -> d_kensaki\n@hs kensapc tsubasa 334,178,108,84 検査室の画面 -> d_kensapc\n\n@battle b1 foe=hayase title=「ドーンの脅迫」という見立てを崩せ bg=ousetsu miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev bunmen b1_o1 | メールの日本語を、ドーンの文と比べよう。「証拠」。\n@ph b1_c2 ev kouza b1_o2 | 金が目当てなら、必ず書く物がある。「証拠」。\n@ph b1_c3 ev gimei b1_o3 | 送り主は、ネットカフェで何と名乗ったか。「証拠」。\n@ph b1_c4 ded 2 b1_o4 | 「推理」。送り主は、どんな人か。 | ドーンの、日本にいる仲間 | 久我に金を貸している者 | 久我に怒っている、若いファン\n@battle b2 foe=shonen title=少年の言い分を聞け bg=dorm miss=b2_miss,b2_miss2 end=b2_end\n@ph b2_c1 view onodera b2_o1 | 久我の本当の気持ちを聞いてきた仲間がいる。「視点」。\n@ph b2_c2 ev page b2_o2 | 少年が取った記録には、ネットに出ていない物がまじっている。「証拠」。\n@ph b2_c3 ev ana b2_o3 | 少年が通った道は、まだ開いている。「証拠」。\n@ph b2_c4 ded 0 b2_o4 | 「推理」。少年に、本当の事を言おう。軽くも、重くもしない。 | 君がした事は脅迫だ。でも、君が見つけた穴で、次の4000人を守れる | 何もなかった事にしよう | 君は、ドーンの仲間だ\n\n@flow miss\n play d_miss\n ask 千早に、何と言う？ | 記者だと、知らなかったんですね -> d_miss_a | 言ってしまった先を、確かめましょう -> d_miss_b | すぐ言ってくれて、助かります -> d_miss_c\n play d_miss_after\n@flow main\n cp\n play d_intro\n banner FILE 005 | 二重の脅迫\n cp\n inv c1\n cp\n play d_pre1\n battle b1\n cp\n play d_mid\n flowx miss\n inv c2\n cp\n play d_pre2\n battle b2\n ask 少年を、どうする？ | 家庭裁判所へ送る。決まりどおりに -> d_end_a | その前に、久我と少年を会わせる -> d_end_b\n play d_end2\n\n## d_intro\n@bg ousetsu\n@bgm invest\n@card 5月3日（月）10:00｜警視庁　応接室\n@show bengoshi left\nbengoshi.n: 久我翔太の代理人です。きのう、本人にこのメールが届きました。\nbengoshi.k: 「肩の手術の記録を出されたくなければ、1000万円」。……東都医科大学病院の、本物の記録がついています。\n@show kuga right\nkuga.d: ……手術は去年の秋です。球団にも、言ってません。\n@show hayase center\nhayase.n: ドーンの漏えいサイトに、あの病院の患者4000人分が出ています。その中の1人を狙った、二重の脅迫でしょう。\n@hide all\n\n## d_tegami\n@obj tegami hop\n*: 脅迫メールの写し。「隠して投げてたんですね。ファンをだましてたんですね。記録を出されたくなければ、1000万円」。\n*: 日本語が、自然すぎる。ドーンの文は、いつも機械で訳したような、かたい日本語だった。\n@get bunmen\n\n## d_t_ben\nbengoshi.n: それが、妙なんです。口座も、暗号資産の財布も、書いていません。\nbengoshi.k: 期限もありません。「1000万円」とあるだけ。払いようが、ないんです。\n@get kouza\n\n## d_t_kuga\nkuga.d: 痛み止めを打って投げてました。……去年の秋から、球が5キロ落ちた。\nkuga.d: 「隠して投げてた」と言われたら、そのとおりです。だますつもりは、なかったんですけど。\n\n## d_camera\n@obj camera glow\n@show chihaya center\nchihaya.n: メールの出どころ、大阪のこの店でした。カメラの記録、もらいます。\nchihaya.u: ……え。送った時刻に座ってるの、制服の男の子です。高校生ですよ、これ。\n@hide chihaya\n@get camera\n\n## d_chobo\n@obj chobo hop\n@show onodera center\nonodera.n: 会員の帳面です。その席の客が書いた名前は……「久我翔太」。\nonodera.k: 偽名に、投手本人の名前を書いてる。……これは、金の欲しい人間のやる事じゃないですねえ。\n@hide onodera\n@get gimei\n\n## d_seki\n@obj pc2 on\n@show chihaya center\nchihaya.k: 席のパソコンに、送ったファイルの跡が残ってます。久我さんの記録、6ページ。\nchihaya.n: 沢口さんに照らしてもらいました。漏えいサイトに出てるのは5ページ。……1ページ、どこにも出てない物があります。\n@hide chihaya\n@get page\n\n## d_pre1\n@hide all\n@bg ousetsu\n@bgm tension\n@show hayase center\nhayase.k: 総監。ドーンの交渉サイトに、こちらから連絡を入れます。二重の脅迫には、まとめて当たるべきです。\n\n## b1_c1\nhayase.n: これはドーンの二重の脅迫です。記録の出どころが、ドーンなんですから。\n## b1_o1\ntsubasa.k: メールの日本語が、自然すぎます。ドーンの文は、いつも機械で訳したような日本語でした。\ntsubasa.k: 「だましてたんですね」。これは、日本語で怒っている人の文です。\nhayase.n: ……日本人の仲間がいる、という事でしょう。\n\n## b1_c2\nhayase.k: ドーンに、日本語のできる者が加わった。それだけの事です。\n## b1_o2\ntsubasa.k: メールには、口座も、財布も、期限も書いてありません。\ntsubasa.k: ドーンは、金の受け取り方を書き忘れる相手じゃない。この送り主は、金を受け取る気がないんです。\nhayase.t: 金が、目当てじゃない……。\n\n## b1_c3\nhayase.t: では、何が目当てなんです。1000万円と、書いてあるのに。\n## b1_o3\ntsubasa.k: 送り主は、ネットカフェの帳面に「久我翔太」と書いています。\ntsubasa.k: 相手の名前を、自分で名乗った。……言いたい事があるのは、金じゃなく、久我さんに対してです。\nhayase.u: 本人の名前を……。\n\n## b1_c4\nhayase.n: ……総監。送り主は、どんな人間だと見ますか。\n## b1_o4\ntsubasa.k: 久我さんに怒っている、若いファンです。カメラには、高校の制服が映っていました。\ntsubasa.k: 「隠して投げていたのか」。それを、本人にぶつけたかった。\n\n## b1_end\n@bgm truth\nhayase.d: ……高校生、ですか。\nhayase.n: ドーンへの連絡は、止めます。その子に、会いに行きましょう。\n@hide all\n\n## b1_miss\nhayase.n: 総監、それは脅迫の中身と、関係がありません。\n## b1_miss2\nhayase.t: ドーンではない、と言える物をください。\n\n## d_mid\n@bg tokumei\n@bgm calm\n@card 5月4日（火）9:00｜特命班の部屋\n@show sawaguchi left\nsawaguchi.n: 少年の身元、割れました。17歳。大阪の高校の2年です。保護者には、連絡済みです。\n@hide all\n\n## d_miss\n@show chihaya center\nchihaya.d: 総監。……すみません、私です。\nchihaya.d: きのう、ロビーで話しかけてきた人に、少年のネットの名前を言っちゃいました。雑談のつもりで。\nchihaya.d: その人、新聞の記者でした。野々村さんっていう……。\n\n## d_miss_a\ntsubasa.n: 記者だと、知らなかったんですね。\n## d_miss_b\ntsubasa.n: 言ってしまった先を、確かめましょう。まず、野々村さんに会います。\n## d_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## d_miss_after\n@show nonomura left\nnonomura.n: 野々村です。……先に言います。あの名前は、書きません。17歳ですから。\nnonomura.k: その代わり、というわけじゃないですけど。漏えいサイトの運営者の噂を、1つ。あそこの「お知らせ」は、いつも東京の朝9時に出るそうです。\n@show chihaya right\nchihaya.u: 東京の、朝……。\n@hide all\n@bgm invest\n\n## d_hpc\n@obj hpc on\n@show chihaya center\nchihaya.n: 少年のパソコン、見せてもらいます。……記録を取った先、漏えいサイトじゃないです。\nchihaya.k: 病院の、検査の機械に、直接つないでます。入口が、開いてたんです。\n@hide chihaya\n@get chokusetsu\n*: 「移動」に、病院の検査室が増えた。\n\n## d_poster\n*: ゲームのポスターの横に、背番号18のタオル。何度も洗って、色がうすくなっている。\n\n## d_t_shonen\nshonen.a: ……去年の秋から、球が遅くなったやろ。みんな「衰えた」って言うてた。\nshonen.d: おれは「ちがう、調子が悪いだけや」って、ずっと言い返してたのに。\nshonen.d: 記録見たら、手術してるやん。……黙ってたんかって。腹立って。\n\n## d_kensaki\n@obj kensaki glow\n@show chihaya center\nchihaya.k: ありました。検査の機械に、外から入れる入口が、1つ残ってます。ドーンが置いていった物です。\nchihaya.t: 病院を戻した時に、ここだけ見落としてます。……いまも、誰でも入れます。\n@hide chihaya\n@get ana\n\n## d_kensapc\n*: 検査室の画面に、古い記録の跡。ドーンの道具とは、名前のつけ方がちがう。もっと古い、別の誰かの道具だ。\n\n## d_pre2\n@hide all\n@bg dorm\n@bgm calm\n@card 5月4日（火）16:00｜少年の部屋\n@show shonen center\nshonen.a: ……警察やろ。逮捕しに来たん。\n\n## b2_c1\nshonen.a: 悪いのは久我やんか。隠して投げてたんやから。\n## b2_o1\nonodera.n: 久我さんに、聞いてきたよ。痛み止めを打って投げてたそうだ。\nonodera.n: 医者には止められた。でも「球場に来る子に、休みますとは言えなかった」って。\nshonen.u: ……。\n\n## b2_c2\nshonen.t: ……でも、記録はもうネットに出てる。おれが見たって、同じやろ。\n## b2_o2\ntsubasa.k: 君がメールにつけた6ページのうち、1ページは、ネットのどこにも出ていません。\ntsubasa.k: 君は、漏えいサイトから取ったんじゃない。病院の機械から、直接取った。\nshonen.u: な、なんで分かるん……。\n\n## b2_c3\nshonen.t: ……たまたま、開いてたんや。病院の機械が。入ってみたら、入れただけで。\n## b2_o3\ntsubasa.k: その入口は、ドーンが残した物です。いまも開いています。\ntsubasa.k: 君が通った道を、ほかの誰かも通れる。4000人の次が、出ます。\nshonen.d: ……おれ、そんなつもりや……。\n\n## b2_c4\nshonen.d: ……おれ、どうなるん。\n## b2_o4\ntsubasa.k: 君がした事は、脅迫です。そこは、変わりません。\ntsubasa.k: でも、君が見つけた穴のおかげで、次の4000人を守れます。……両方、本当です。\n\n## b2_end\n@bgm truth\nshonen.d: ……ごめんなさい。\nshonen.d: 18番、好きやっただけやねん。ずっと。\n@hide all\n\n## b2_miss\nshonen.a: 関係ないやろ、それ。\n## b2_miss2\nshonen.a: 大人は、すぐそうやって話そらす。\n\n## d_end_a\ntsubasa.n: 決まりどおり、家庭裁判所へ送ります。……君が穴を見つけた事も、ちゃんと書きます。\n## d_end_b\ntsubasa.n: その前に、会ってほしい人がいます。\n@bg ousetsu\n@show kuga center\nkuga.d: ……ごめんな。隠してて。\nkuga.n: 18番のタオル、まだ持っててくれるか。秋には、ちゃんと投げるから。\n@show shonen left\nshonen.d: ……はい。\n\n## d_end2\n@hide all\n@bg kensa\n@bgm calm\n@card 5月5日（水）11:00｜病院の検査室\n@show chihaya center\nchihaya.s: 入口、閉じました！　今度は、3回確かめました。\n@show sawaguchi left\nsawaguchi.k: 総監。検査の機械に、もう1つ跡があります。ドーンより前の、古い道具です。\nsawaguchi.n: 名前のつけ方が、どこかの国の役所みたいなんですよね。\n@hide all\n@bgm tension\n*: ドーンより前に、誰かが、この病院の中にいた。\n", "006": "# FILE 006 サーバーの国\n@intro ドーンのサーバーがある国は、協力を断った。「サーバーは見つからない」。だが、画面の向こうの男は、何かを言おうとしている。\n@next FILE 007「金の川」につづく\n@end S パーク「総監。……あの人の目を読めた人は、ラングレーにもいません」\n@end A ハミルトン「番号から住所まで、1日でした。総監、次の一手を」\n@end B オカフォー「総監、次は棚に入れる前に、必ず声をかけます」\n@view tsubasa 翼 | 物を見て、筋を通す\n@view park パーク | 外国の事を調べる\n@view okafor オカフォー | 記録と映像を読む\n@char kane name=ケイン role=CIA副長官 sex=f skin=#f4d6c4 hair=#d8d4cc hs=shortf eye=#5aa07a es=soft tilt=5 jaw=0 brow=1.6 sm=1 wr=1 fit=suit:#5b4a5e:#f6efe6 pin=1 pose=stand\n@char mikhailov name=ミハイロフ role=東欧の国の警察のサイバー課長 sex=m skin=#f0d0b8 hair=#6a6a70 hs=slick eye=#5a8aa0 es=half tilt=5 jaw=2 brow=3 wr=1 remote=1 fit=suit:#4a5a4a:#e8ece8:#5a2a2a pin=1 pose=stand v=M,0.88,0.95,0.90,0.60\n@ev kotowari 断りの書類 | 断 | 条約で頼んだサーバーの記録の提出を、東欧の国は断った。理由は「サーバーは見つからない」。\n@ev cia 使えない情報 | 外 | CIAは、そのサーバーの中を見ている。だが外国の情報として集めた物は、法廷では使えない。\n@ev denki 電気代の支払い | 電 | データセンターの電気代を払っているのは「ヴェルナ電力商会」。大統領の甥の会社。公開の記録にある。\n@ev bango 映った番号 | 番 | テレビ会議の最後、ミハイロフが紙を一瞬カメラに映した。書いてあったのは「R-17 / C-09」。\n\n@place c1 start=langley need=cia,denki,f:kaigi\n@loc langley CIA_ラングレー bg=langley people=nair,kane\n@hs map park 120,40,400,170 壁の地図 -> s_map\n@talk nair tsubasa サーバーの中を、見ているんですか -> s_t_nair\n@talk kane tsubasa あの国の事を、教えてください -> s_t_kane\n@loc fbi FBI本部の一室 bg=fbi people=hamilton,shapiro\n@hs pc2 okafor 392,176,104,82 公開の記録 -> s_denki\n@hs wb tsubasa 244,42,184,116 ホワイトボード -> s_wb\n@talk shapiro tsubasa もう1度、会議を開けますか -> s_t_shap | f=kaigi\n\n@battle b1 foe=mikhailov title=ミハイロフの本当の言葉を読め bg=hq miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev denki b1_o1 | 「見つからない」のか、「探せない」のか。金の出どころを見せよう。「証拠」。\n@ph b1_c2 obs eyes b1_o2 | 「観察」。彼は、こちらを見ていない時がある。 | eyes:目:282,142,98,36 | brow:まゆ:282,122,98,18 | hair:かみ:262,40,140,76\n@ph b1_c3 view okafor b1_o3 | 会議の最後に、何かが映った。「視点」で、映像を読む仲間に代わろう。\n@ph b1_c4 ded 0 b1_o4 | 「推理」。あの番号は、何の番号か。 | データセンターの、棚と段の番号 | 彼の家の電話番号 | 大統領の口座の番号\n\n@flow miss\n play s_miss\n ask オカフォーに、何と言う？ | 決まりを守ったんですね -> s_miss_a | 棚の中を、一緒に見ましょう -> s_miss_b | すぐ言ってくれて、助かります -> s_miss_c\n play s_miss_after\n@flow main\n cp\n play s_intro\n banner FILE 006 | サーバーの国\n cp\n inv c1\n cp\n flowx miss\n play s_pre\n battle b1\n ask 番号を、どう使う？ | 先に、ミハイロフと家族を逃がす手配をする -> s_end_a | すぐ使う。サーバーの住所を割り出す -> s_end_b | 使わない。数か月かけて、別の道を探す -> s_end_c\n play s_end2\n\n## s_intro\n@bg hq\n@bgm invest\n@card 5月10日（月）9:00｜ワシントン　FBI本部\n@show weiss left\nweiss.n: 総監。条約で頼んでいたサーバーの記録ですが、東欧の国が断ってきました。\nweiss.n: 理由は1行です。「該当するサーバーは、見つからない」。\n@get kotowari\n@show nair right\nnair.k: 見つからない、ね。……総監。ラングレーに来てください。壁の地図を、お見せします。\n@hide all\n*: この事件の「視点」は、翼、パーク、オカフォー。パークは外国の事を調べる。オカフォーは記録と映像を読む。\n\n## s_map\n@obj map glow\n@show park center\npark.n: 赤い点が、ドーンのサーバーです。東欧の国の首都。川ぞいのデータセンター。\npark.k: 外国の事なので、調べました。……ここまでは、CIAの仕事です。\n@hide park\n\n## s_t_nair\nnair.k: 見ています。その国のサーバーなら、私たちは中まで。\nnair.n: ただし、法廷では使えません。外国の情報として集めた物ですから。……FBIは、自分の足で、同じ所まで来てください。\n@get cia\n\n## s_t_kane\nkane.s: 紅茶はいかが、総監。……あの国はね、小さいけれど、古い国ですよ。\nkane.n: 大統領の一族が、電気も、通信も、建物も持っています。警察も、一族には手を出せません。\n\n## s_denki\n@obj pc2 on\n@show okafor center\nokafor.n: 公開の記録を当たりました。データセンターの電気代を払っている会社です。\nokafor.k: 「ヴェルナ電力商会」。社長は……大統領の甥です。これは、誰でも見られる記録です。法廷に出せます。\n@hide okafor\n@get denki\n\n## s_wb\n*: ホワイトボードに書く。「見つからない」と「探せない」。あの国の警察は、どちらなのか。\n\n## s_t_shap\nshapiro.n: 開けます。向こうのサイバー課長、ミハイロフが出ると言っています。\nshapiro.t: ただ、同じ答えでしょうね。「見つからない」。……それでも、やりますか。\n\n## s_pre\n@hide all\n@bg hq\n@bgm tension\n@card 5月11日（火）10:00｜FBI本部　テレビ会議\n@obj wall on\nmikhailov.n: 東欧警察サイバー課の、ミハイロフです。……総監。お若い、ですな。\nmikhailov.n: お答えは、書面と同じです。\n\n## b1_c1\nmikhailov.n: 該当するサーバーは、わが国には、見つかりません。\n## b1_o1\ntsubasa.k: データセンターの電気代を払っているのは、ヴェルナ電力商会です。大統領の甥の会社。\ntsubasa.k: 「見つからない」のではなく、「探せない」のではありませんか。\nmikhailov.n: ……それは、民間の契約です。\n\n## b1_c2\nmikhailov.n: 民間の会社が、どこに電気を売ろうと、警察の知る事では、ありません。\n## b1_o2\n*: ミハイロフの目が、画面の外へ動いた。左へ。……3度目だ。\n*: 翼は、口には出さない。画面の外に、誰かがいる。この男は、見張られている。\nmikhailov.n: ……。\n\n## b1_c3\nmikhailov.n: 協力は、できません。……以上です。失礼する。\n## b1_o3\nokafor.k: 総監。切れる直前の0.4秒です。ミハイロフが、手元の紙を、カメラに向けました。\nokafor.n: 録画を起こします。……「R-17 / C-09」。\n@get bango\n\n## b1_c4\nmikhailov.n: ……以上です。失礼する。\n## b1_o4\ntsubasa.k: データセンターの、棚と段の番号です。17番の棚の、9段目。\ntsubasa.k: 彼は「探せない」。だから、探さなくていいように、場所を教えた。\n\n## b1_end\n@bgm truth\n@show park left\npark.d: ……記録に残らないやり方を、選んだんです。見張りの目の前で。\npark.n: 見つかれば、あの人は終わりです。家族も。\n@show hamilton right\nhamilton.k: 番号があれば、公開の住所まで割り出せます。1日ください。……使うかどうかは、総監が。\n\n## b1_miss\nmikhailov.n: ……質問の意味が、分かりかねます。\n## b1_miss2\nmikhailov.n: お答えできません。\n\n## s_miss\n@show okafor center\n@bgm calm\nokafor.d: 総監。……すみません、私です。\nokafor.d: きのうの会議の録画を、NSAの決まりの棚に入れてしまいました。特命班からは、見えない棚です。\nokafor.d: 出すには、書類が3枚要ります。早くて、あさってです。\n\n## s_miss_a\ntsubasa.n: 決まりを守ったんですね。責めません。\n## s_miss_b\ntsubasa.n: 棚の中で何が起きているか、一緒に見ましょう。\n## s_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## s_miss_after\nokafor.u: ……待ってください。あの棚は、入れた映像を、自動で分析にかけます。\nokafor.k: 文字が映っていれば、読める形に起こされているはずです。……会議を、もう1度見る必要がありますね。\n@hide all\n@bgm invest\n\n## s_end_a\ntsubasa.k: 番号は、まだ使いません。先に、ミハイロフさんと家族を、国の外へ出します。\n@show kane center\nkane.s: その手配なら、こちらでやりましょう。……法廷より少し広い世界の、仕事ですからね。\n## s_end_b\ntsubasa.k: すぐ使います。相手に気づかれる前に、住所を押さえます。\n@show park center\npark.t: ……分かりました。ミハイロフの身は、こちらで見張ります。間に合えば、ですが。\n## s_end_c\ntsubasa.k: 番号は使いません。彼を危なくしない道を、探します。\n@show shapiro center\nshapiro.t: 数か月かかりますよ。……でも、そういう決め方は、嫌いじゃありません。\n\n## s_end2\n@hide all\n@bg fbi\n@bgm calm\n@card 5月12日（水）16:00｜FBI本部の一室\n@show okafor left\nokafor.n: 総監。次からは、棚に入れる前に、声をかけます。\n@show hamilton right\nhamilton.k: それと、1つ。電気代を払っているヴェルナ電力商会ですが。\nhamilton.n: クラウドの大企業、ヘリオス社の、あの国での代理店です。\n@hide all\n@bgm tension\n*: ドーンのサーバーを守る国。その国の電気を持つ一族。その一族と組む、世界の大企業。\n", "007": "# FILE 007 金の川\n@intro 身代金は、足跡を消す仕組みの中へ消えた。だが、川には出口がある。翼のスマホに、差出人のない知らせが届く。\n@next FILE 008「下請け」につづく\n@end S 判事「見事な申し立てでした、総監。1行も、直す所がありません」\n@end A ローゼン「総監、13日が見えました。数字は、やっぱり嘘をつきません」\n@end B シャピロ「総監、次の申し立ては、出す前に必ずお見せします」\n@view tsubasa 翼 | 物を見て、筋を通す\n@view mendes メンデス | 人に聞く。足で稼ぐ\n@view rosen ローゼン | 数字と記録を読む\n@char rosen name=ローゼン role=FBIの会計担当の捜査官 sex=f skin=#f2d0bb hair=#a8683a hs=wavy eye=#4a9a5a es=soft tilt=-3 jaw=0 brow=1.8 gl=round fit=suit:#3d4a44:#f3efe8 pose=tablet\n@char ross name=ロス role=取引所ベルタの法務担当 sex=f skin=#d8a888 hair=#3a2a2a hs=bob eye=#3ab0a0 es=cool tilt=-2 jaw=0 brow=1.9 fit=suit:#1a2a4a:#e8f6f4 pin=1 pose=tablet v=F,0.90,0.97,1.10,0.85\n@char hanji name=判事 role=連邦の治安判事 sex=f skin=#f2d6c4 hair=#b8b4b0 hs=shortf eye=#6a7a9a es=narrow tilt=3 jaw=1 brow=2 wr=1 gl=round fit=suit:#1c1c22:#f4f4f4 pose=stand v=F,0.74,0.92,0.90,0.70\n@ev mixer 川の出口 | 川 | 身代金は、足跡を混ぜて消す仕組み（ミキサー）へ入った。だが出口の3割が、取引所ベルタの、同じ1つの入金口へ入っている。\n@ev mochi 入金口の持ち主 | 主 | ベルタの入金口の持ち主は、東欧の国の輸出入の会社「ドナウ貿易」。\n@ev jusho 会社の住所 | 住 | ドナウ貿易の登記の住所は、ドーンのサーバーがあるデータセンターと、同じ建物。\n@ev kiroku 入金口の記録 | 記 | ベルタが令状で出した、入金口の3か月分の記録。出所のはっきりした物。\n@ev juusan 毎月13日 | 13 | 入金口からは、毎月13日に、その月に受け取った額の2割が、同じ1つの口座へ出ていく。\n\n@place c1 start=belta need=mochi,jusho,kiroku,f:chobo1\n@loc belta 取引所ベルタ bg=belta people=ross\n@hs chart rosen 150,50,340,150 大きな画面 -> k_chart\n@hs nyukin tsubasa 414,188,102,82 会社の登記 -> k_toki\n@hs kiroku rosen 172,226,66,44 入金口の記録 -> k_kiroku\n@talk ross mendes あの入金口は、誰の物ですか -> k_t_ross1\n@talk ross tsubasa ベルタの帳簿は、1つですか -> k_t_ross2 | f=chobo1\n\n@battle b1 foe=hanji title=判事を納得させろ bg=rijikai miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev kiroku b1_o1 | 判事が欲しいのは、出所のはっきりした記録。「証拠」。\n@ph b1_c2 ev mixer b1_o2 | その金が、犯罪の金だと言える流れを見せよう。「証拠」。\n@ph b1_c3 ev jusho b1_o3 | 受け取った会社は、どこにあるか。「証拠」。\n@ph b1_c4 ev juusan b1_o4 | 金は、入金口からどこへ出ていくか。「証拠」。\n@ph b1_c5 ded 1 b1_o5 | 「推理」。令状で、何を求めるか。広すぎても、狭すぎてもいけない。 | ベルタの全部の客の記録 | 入金口の先の、毎月13日に金が出ていく口座の記録 | 創業者ストーンの、個人のサーバー\n\n@timeline t1 wrong=k_wrong title=入金口の3か月\n ev 入金口から、2割が出ていく | 3月13日\n ev 東京の病院が止まる | 4月12日\n ev 入金口から、2割が出ていく | 4月13日\n ev ワシントンの病院が止まる | 4月15日\n ev ブレアの5％が、ベルタで換金される | 4月21日\n ev 入金口から、2割が出ていく | 5月13日\n q くり返し起きている動きは、何日？ | 毎月1日 | *毎月13日 | 毎月の末日\n q その日、出ていくのは、受け取った額のどれだけ？ | 全部 | 半分 | *2割\n hit 毎月13日、2割が同じ口座へ | 13日\n\n@flow miss\n play k_miss\n ask シャピロに、何と言う？ | 急いでくれたんですね -> k_miss_a | 判事の言葉を、もう1度教えてください -> k_miss_b | すぐ言ってくれて、助かります -> k_miss_c\n play k_miss_after\n@flow main\n cp\n play k_intro\n ask ゴーストの知らせを、どうする？ | 部下に見せる -> k_show | 自分の胸にしまう -> k_hide\n banner FILE 007 | 金の川\n cp\n play k_arrive\n inv c1\n cp\n flowx miss\n play k_think\n timeline t1\n play k_think_ok\n cp\n play k_pre\n battle b1\n ask 入金口を、どうする？ | 凍結する。金の流れを止める -> k_end_a | 泳がせる。13日を待つ -> k_end_b | ロスを証人にする -> k_end_c\n play k_end2\n\n## k_intro\n@bg fbi\n@bgm invest\n@card 5月14日（金）7:50｜FBIワシントン支局\n@show rosen center\nrosen.n: 総監、身代金の流れです。ドーンの財布から出たお金は、「ミキサー」に入ります。\nrosen.n: 何千人ものお金を混ぜて、足跡を消す仕組みです。ふつうは、そこで追えなくなります。\nrosen.k: ただ。002で、私が間違えて追った財布が、手がかりになりました。ミキサーの出口の3割が、ベルタの同じ入金口に入っています。\n@get mixer\n@hide all\n@sfx phone\n*: 翼の個人のスマホが、1度だけ鳴った。差出人は、ない。\n*: 「ベルタの帳簿は、2つある。客に見せる帳簿と、創業者だけが見る帳簿」。\n*: 「それと、総監。時差でつらい時は、温かい物を」。\n\n## k_show\n@show rosen center\nrosen.t: 差出人なし、送り元もたどれない、ですか。……総監、これは令状には書けません。\nrosen.n: 出所の分かる記録で、同じ物を、見つけ直しましょう。\n@hide all\n## k_hide\n*: 画面を消して、ポケットに戻す。誰の知らせか分からない物を、まだ、誰にも見せない。\n\n## k_arrive\n@hide all\n@bg belta\n@card 10:00｜ニューヨーク　取引所ベルタ\n@show ross center\nross.n: 法務のロスです。令状は拝見しました。ベルタは、捜査に協力します。\nross.s: うちは、まっとうな取引所ですから。隠す物は、ありません。\n@hide all\n\n## k_chart\n@obj chart glow\n@show rosen center\nrosen.n: 1日の取引が、小さな国の予算くらいあります。……この中から、1つの入金口を追うんです。\nrosen.s: 川は大きいほど、出口が目立つんですよ。\n@hide rosen\n\n## k_toki\n@obj nyukin on\n*: 入金口の持ち主「ドナウ貿易」の登記を出す。住所は、東欧の国の首都。川ぞいの、ビルの4階。\n*: ……006で見た、データセンターと同じ建物だ。\n@get jusho\n\n## k_kiroku\n@obj kiroku hop\n@show rosen center\nrosen.n: 入金口の3か月分の記録、令状で受け取りました。ベルタが正式に出した物です。\nrosen.k: これなら、どこに出しても「出所は？」と聞かれません。\n@hide rosen\n@get kiroku\n\n## k_t_ross1\nross.n: 入金口は、お客さまの物です。うちは、場所を貸しているだけ。\nross.n: 持ち主は、東欧の国の輸出入の会社です。「ドナウ貿易」。書類は、そろっています。\n@get mochi\n\n## k_t_ross2\nross.u: 帳簿、ですか？　……1つです。もちろん。\nross.n: 監査も毎年受けています。2つあるなんて話は、聞いた事がありません。\n*: ロスの目は、まっすぐだ。嘘をついている顔ではない。……この人は、知らない。\n\n## k_miss\n@bg fbi\n@show shapiro center\n@bgm calm\nshapiro.d: 総監。……すみません、私です。\nshapiro.d: 令状の申し立てに、あの差出人のない知らせを、理由として書いてしまいました。\nshapiro.d: 判事に、5分で却下されました。「匿名の一文で、扉は開けられない」と。\n\n## k_miss_a\ntsubasa.n: 急いでくれたんですね。分かります。\n## k_miss_b\ntsubasa.n: 判事の言葉を、もう1度、正確に教えてください。\n## k_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## k_miss_after\nshapiro.n: 判事は、こうも言いました。「出所の明らかな記録を、並べて持ってきなさい」。\n@show rosen left\nrosen.k: ……並べる。そうですね。3か月分を、日付の順に、並べ直してみます。\n@hide all\n\n## k_think\n@bgm truth\n*: 入金口の記録と、これまでの事件を、日付の順に並べる。\n\n## k_wrong\n*: ……違う。記録の日付を、もう1度見る。\n\n## k_think_ok\n@sfx correct\n@show rosen center\nrosen.u: 13日。毎月、13日です。受け取った額の、きっちり2割。行き先は、毎回同じ口座。\nrosen.s: 総監、癖が見えました。\n@hide rosen\n@get juusan\n\n## k_pre\n@hide all\n@bg rijikai\n@bgm tension\n@card 5月17日（月）11:00｜連邦裁判所　判事の部屋\n@show hanji center\nhanji.n: また来ましたか。……今度は、匿名の手紙ではないでしょうね。\nhanji.k: 私を納得させなさい、総監。扉を開けるのは、物だけです。\n\n## b1_c1\nhanji.n: 匿名の知らせでは、令状は出せません。出所は、どこです。\n## b1_o1\ntsubasa.k: ベルタが、令状に応じて正式に出した、入金口の3か月分の記録です。\
