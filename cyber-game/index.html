ntsubasa.k: 出所は、ベルタ自身です。\nhanji.n: ……よろしい。続けて。\n\n## b1_c2\nhanji.n: 入金口に金が入った。それだけでは、犯罪の金とは言えません。\n## b1_o2\ntsubasa.k: ドーンの財布から出た身代金は、ミキサーに入ります。その出口の3割が、この1つの入金口に集まっています。\ntsubasa.k: 病院が払った金が、ここへ流れている。追跡の記録があります。\nhanji.n: ふむ。\n\n## b1_c3\nhanji.k: 受け取った会社は、ただの貿易会社かもしれません。\n## b1_o3\ntsubasa.k: ドナウ貿易の住所は、ドーンのサーバーがあるデータセンターと、同じ建物です。\nhanji.u: ……同じ建物。\n\n## b1_c4\nhanji.n: では、その金は、入金口からどこへ行くのです。\n## b1_o4\ntsubasa.k: 毎月13日に、その月に受け取った額の2割が、同じ1つの口座へ出ていきます。3か月、1度も欠かさず。\ntsubasa.k: 誰かへの、決まった支払いです。\n\n## b1_c5\nhanji.k: ……それで、総監。あなたは、私に何を求めるのですか。\n## b1_o5\ntsubasa.k: 入金口の先の、毎月13日に金が出ていく口座の記録です。それだけを。\ntsubasa.k: ベルタの客の全部でも、創業者の個人の物でもありません。\n\n## b1_end\n@bgm truth\nhanji.s: 20歳で、欲しい物を「それだけ」と言えるのは、珍しい。\nhanji.n: 令状を出します。13日の口座の記録まで。……創業者の個人のサーバーは、まだ理由が足りません。覚えておきなさい。\n@hide all\n\n## b1_miss\nhanji.n: それは、いまの問いの答えになっていません。\n## b1_miss2\nhanji.k: 総監。物で、話しなさい。\n\n## k_end_a\ntsubasa.k: 入金口を凍結します。病院の金を、これ以上流させません。\n@show rosen center\nrosen.t: 創業者のストーンに、気づかれますね。……でも、止まる金は、止まります。\n## k_end_b\ntsubasa.k: 泳がせます。次の13日に、金がどこへ着くかを見ます。\n@show rosen center\nrosen.k: 6月13日ですね。……暦に、赤丸をつけておきます。\n## k_end_c\ntsubasa.k: ロスさんに、証人になってもらいます。彼女は、何も知らされていない。\n@show mendes center\nmendes.n: 自分の会社に帳簿が2つあると知ったら、あの人は怒りますよ。……いい証人になる。\n\n## k_end2\n@hide all\n@bg fbi\n@bgm calm\n@card 5月17日（月）17:00｜FBIワシントン支局\n@show rosen center\nrosen.n: 総監。13日のお金が着く口座、銀行が分かりました。太平洋の、小さな島国の銀行です。\n@hide all\n@bgm tension\n*: 帳簿は2つある、と知らせてきたのは、誰なのか。なぜ、時差の事まで知っているのか。\n", "008": "# FILE 008 下請け\n@intro 病院の入口を実際に開けた「下請け」。海外の者だと、誰もが思っていた。チャットの言葉が、妙に若い。\n@next FILE 009「夜明けの突入」につづく\n@end S 小野寺「総監。広瀬くんの親御さんが、深々と頭を下げてましたよ。……私も、下げ返しました」\n@end A 槙「うちの捜査で、ここまで来ました。総監、FBIに渡しましょう」\n@end B 沢口「総監、次は言葉を選びます。ログより先に、人を見ます」\n@char hirose name=広瀬 role=福岡の大学の情報学部2年。19歳 sex=m skin=#f6d6bc hair=#3a342e hs=messy eye=#6a8a5a es=half tilt=6 jaw=0 brow=2.2 gl=round fit=hoodie:#6a6a7a pose=pocket v=M,1.28,1.05,0.98,0.70\n@char keiji name=県警の刑事 role=福岡県警 sex=m skin=#e8bd98 hair=#3a3a3e hs=buzz eye=#5a5a4a es=soft tilt=3 jaw=2 brow=3 wide=1 fit=suit:#5a5248:#ece7dd:#3a4a3a pose=stand v=M,0.88,0.95,1.00,1.10\n@ev namae 下請けの名前 | 名 | 堀の供述。名簿を買った「下請け」のチャットの名前は「lv19」。\n@ev wakai チャットの言葉 | 若 | 「lv19」の日本語は、若い。「まじすか」「了解っす」。訳した文ではない。\n@ev jikoku チャットの時刻 | 刻 | 「lv19」が書きこむのは、平日の12時10分から12時50分と、16時30分より後だけ。\n@ev jikanwari 時間割 | 割 | 福岡の大学の情報学部2年。昼休みは12時10分から12時50分。4限は16時20分に終わる。\n@ev seki 席の記録 | 席 | 大学のネットワークの記録。「lv19」の書きこみは、PC教室のこの席から。使っていたのは、2年の広瀬悠真。\n@ev kokyakuA 「顧客A」 | 客 | 広瀬はゲームの中で「会社のセキュリティのテストの仕事」と誘われた。1回5万円分。標的の名前は「顧客A」と伏せられていた。\n@ev zenkiroku 取ってあった記録 | 全 | 広瀬は、自分の操作の記録を全部取ってあった。4月12日のニュースを見てから。自首するつもりだった。\n@ev nj 指示役の回線 | 線 | 記録の中に、指示を出していた者の接続の跡。アメリカ、ニュージャージー州の、住宅の回線。\n@ev rokuon 通話の録音 | 声 | 指示役の声が入った通話の録音。英語。アメリカの東海岸の訛りがある。\n\n@place c1 start=tokumei need=wakai,jikoku,jikanwari,seki\n@loc tokumei 特命班の部屋 bg=tokumei people=maki,sawaguchi\n@hs logs chihaya 46,76,228,148 チャットの記録 -> h_logs\n@hs sousa chihaya 286,76,178,148 書きこみの時刻 -> h_jikoku\n@talk maki tsubasa 下請けは、どこの者だと見ますか -> h_t_maki\n@loc lab2 福岡の大学_PC教室 bg=lab2 people=keiji\n@hs jikan tsubasa 330,44,250,100 黒板の時間割 -> h_jikan\n@hs seki2 chihaya 274,182,102,84 まん中の席 -> h_seki\n@talk keiji onodera この大学の学生について -> h_t_keiji\n\n@place c2 start=dorm need=kokyakuA,zenkiroku,nj,rokuon\n@loc dorm 広瀬の部屋 bg=dorm people=hirose enter=sawamiss:miss\n@hs hpc chihaya 372,174,116,90 広瀬のパソコン -> h_hpc\n@hs usb chihaya 486,220,56,32 机のUSB -> [zenkiroku]h_usb h_usb0 | done=nj\n@hs posterg any 54,44,102,122 ゲームのポスター -> h_poster\n@talk hirose onodera どうやって、誘われたの -> h_t_hirose1\n@talk hirose onodera いつ、病院だと知ったの -> h_t_hirose2\n@talk hirose tsubasa さっき出してくれた物を、聞かせてください -> h_t_hirose3\n\n@battle b1 foe=maki title=「下請けは海外」を崩せ bg=tokumei miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev wakai b1_o1 | チャットの日本語を、よく読もう。「証拠」。\n@ph b1_c2 ev jikoku b1_o2 | 書きこむ時刻に、癖がある。「証拠」。\n@ph b1_c3 ev jikanwari b1_o3 | その時刻と、ぴったり合う物を、福岡で見た。「証拠」。\n@ph b1_c4 ev seki b1_o4 | 書きこみは、どの席から出たか。「証拠」。\n@battle b2 foe=hirose title=広瀬の言葉を聞け bg=dorm miss=b2_miss,b2_miss2 end=b2_end\n@ph b2_c1 ev kokyakuA b2_o1 | 広瀬は、標的が何かを知らされていたか。「証拠」。\n@ph b2_c2 ded 1 b2_o2 | 「推理」。広瀬の責任を、正しい重さで言おう。 | 君は、何も悪くない | 君は入口を開けた。止めたのは、指示した者だ。重さは違う。でも、ゼロではない | 君が、三浦さんを殺した\n@ph b2_c3 ev zenkiroku b2_o3 | 逃げる人は、記録を消す。広瀬は、どうしていたか。「証拠」。\n@ph b2_c4 view onodera b2_o4 | ここから先は、人の話だ。「視点」で、人に聞く仲間に代わろう。\n\n@flow miss\n play h_miss\n ask 沢口に、何と言う？ | 三浦さんの事を、思ったんですね -> h_miss_a | 広瀬くんに、一緒に謝りましょう -> h_miss_b | すぐ言ってくれて、助かります -> h_miss_c\n play h_miss_after\n@flow main\n cp\n play h_intro\n banner FILE 008 | 下請け\n cp\n inv c1\n cp\n play h_pre1\n battle b1\n cp\n play h_mid\n inv c2\n cp\n play h_pre2\n battle b2\n ask 広瀬を、どうする？ | 家庭裁判所へ送る。記録を全部つけて -> h_end_a | 協力者として扱う。指示役を追うために -> h_end_b\n play h_end2\n\n## h_intro\n@bg tokumei\n@bgm invest\n@card 5月17日（月）9:00｜特命班の部屋\n@show maki center\nmaki.n: 総監、警察庁サイバー特別捜査部の槙です。堀の供述から、名簿を買った「下請け」の名前が出ました。\nmaki.k: チャットの名前は「lv19」。ドーンの下で、実際に病院の入口を開ける役です。\n@get namae\nmaki.n: まあ、海外の者でしょう。こういう下請けは、たいてい東欧か、東南アジアです。\n@hide all\n\n## h_logs\n@obj logscroll on\n@show chihaya center\nchihaya.n: 「lv19」のチャット、読みました。……日本語、うまいっていうか。\nchihaya.k: 「まじすか」「了解っす」「あざます」。総監、これ、訳した文じゃないです。私の後輩が、こう書きます。\n@hide chihaya\n@get wakai\n\n## h_jikoku\n@show chihaya center\nchihaya.n: 書きこみの時刻を並べました。平日の、12時10分から12時50分。それと、16時30分より後だけ。\nchihaya.t: 朝も、午後の早い時間も、1回もないんです。……何かに、縛られてる人の時間です。\n@hide chihaya\n@get jikoku\n\n## h_t_maki\nmaki.n: 海外です。日本語は、翻訳の道具か、日本語のできる仲間を使っているんでしょう。\nmaki.k: ただ、接続をたどると、最後は九州の大学のネットワークに出ます。踏み台にされたんだと思いますが。\n*: 「移動」に、福岡の大学が増えた。\n\n## h_jikan\n@obj jikan glow\n*: 黒板に、情報学部2年の時間割。昼休みは、12時10分から12時50分。4限は、16時20分に終わる。\n*: ……「lv19」が書きこむ時刻と、同じだ。\n@get jikanwari\n\n## h_seki\n@obj seki2 on\n@show chihaya center\nchihaya.k: 大学のネットワークの記録、出してもらいました。「lv19」の書きこみ、踏み台じゃないです。\nchihaya.u: この教室の、まん中の席から、じかに出てます。使ってたのは……2年の、広瀬悠真。19歳。\n@hide chihaya\n@get seki\n\n## h_t_keiji\nkeiji.n: 広瀬ですか。目立たん、まじめな子ですよ。成績もよか。\nkeiji.t: ただ、4月の半ばから、大学に出てきとらんとです。下宿に、こもっとるらしくて。\n\n## h_pre1\n@hide all\n@bg tokumei\n@bgm tension\n@show maki center\nmaki.k: 総監。大学は踏み台です。本体は海外にいる。国際手配の準備を、進めさせてください。\n\n## b1_c1\nmaki.n: 下請けは、海外の者です。経験から言って、まず間違いありません。\n## b1_o1\ntsubasa.k: 「まじすか」「了解っす」「あざます」。この日本語は、訳した物じゃありません。\ntsubasa.k: 日本で育った、若い人の書き方です。\nmaki.n: ……日本語のできる仲間を、雇ったんでしょう。\n\n## b1_c2\nmaki.k: 日本の若者を1人、通訳に使っている。それなら、説明がつきます。\n## b1_o2\ntsubasa.k: 書きこみは、平日の12時10分から12時50分と、16時30分より後だけです。\ntsubasa.k: 海外の本体が指示しているなら、こんな時刻には縛られません。\nmaki.t: ……たしかに、妙な時刻ですが。\n\n## b1_c3\nmaki.n: 仕事の合間に書いている。会社員か何かでしょう。\n## b1_o3\ntsubasa.k: 福岡の大学の、情報学部2年の時間割です。昼休みが12時10分から12時50分。4限が16時20分まで。\ntsubasa.k: 会社員じゃない。授業の合間に、書いているんです。\nmaki.u: 時間割と……同じ。\n\n## b1_c4\nmaki.t: しかし、大学のネットワークは、踏み台にされただけでは。\n## b1_o4\ntsubasa.k: 書きこみは、PC教室のまん中の席から、じかに出ています。踏み台じゃありません。\ntsubasa.k: その席を使っていたのは、2年の広瀬悠真。19歳です。\n\n## b1_end\n@bgm truth\nmaki.d: ……19歳。\nmaki.n: 国際手配は、取り下げます。総監。福岡へ、ご一緒します。\n@hide all\n\n## b1_miss\nmaki.n: 総監、それでは海外の線は消えません。\n## b1_miss2\nmaki.k: 根拠を、もう1つください。\n\n## h_mid\n@bg dorm\n@bgm calm\n@card 5月18日（火）15:00｜福岡　広瀬の部屋\n@show hirose center\nhirose.d: ……来ると、思ってました。\n@hide all\n\n## h_miss\n@show sawaguchi center\nsawaguchi.d: 総監。……すみません、私です。\nsawaguchi.d: 部屋に入ってすぐ、広瀬に言ってしまいました。「人が死んだんだぞ」と。\nsawaguchi.d: 三浦さんの、あの5時間の記録を読んだのは、私なんで。……抑えられませんでした。\n\n## h_miss_a\ntsubasa.n: 三浦さんの事を、思ったんですね。\n## h_miss_b\ntsubasa.n: 広瀬くんに、一緒に謝りましょう。言った事は、消えないので。\n## h_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## h_miss_after\n@show hirose left\nhirose.d: ……いいんです。本当の事、なんで。\nhirose.d: あの……これ。記録とは別に、取ってあった物があります。あとで、聞いてください。\n@hide all\n@bgm invest\n\n## h_hpc\n@obj hpc on\n@show chihaya center\nchihaya.n: パソコン、見せてもらいます。……え。操作の記録、全部取ってあります。1行も消してない。\nchihaya.k: 日付は、4月12日の夜から。ニュースを見た日からです。\n@hide chihaya\n@get zenkiroku\n\n## h_usb0\n@show chihaya center\nchihaya.n: USBですね。先に、パソコンのほうを見せてください。\n@hide chihaya\n\n## h_usb\n@obj usb hop\n@show chihaya center\nchihaya.k: USBに、記録の写しが入ってました。この中に、指示を出してた人の接続の跡があります。\nchihaya.u: アメリカです。ニュージャージー州の、ふつうの家の回線。\n@hide chihaya\n@get nj\n\n## h_poster\n*: ゲームのポスター。「QUEST」。広瀬は、このゲームの中で、声をかけられた。\n\n## h_t_hirose1\nhirose.d: ゲームの中です。同じチームの人に。「会社のセキュリティのテストの仕事がある」って。\nhirose.d: 1回、5万円分の暗号資産でした。相手の名前は、いつも「顧客A」とか「顧客B」で。\nhirose.d: ……テストだと、思ってたんです。本当に。\n@get kokyakuA\n\n## h_t_hirose2\nhirose.d: 4月12日の、夜のニュースです。「東京の病院で、システムが止まり、男性が1人」って。\nhirose.d: 日付と、時刻が。……おれが「顧客A」に入った夜でした。\nhirose.d: それから、寝てません。警察に行こうと思って、毎朝、玄関までは行くんです。\n\n## h_t_hirose3\nhirose.n: 通話の、録音です。指示してきた人の、声が入ってます。\nhirose.d: 最後の指示の時だけ、文字じゃなくて、声で来たんです。怖くなって、録りました。\n@get rokuon\n*: 英語の、男の声。早口で、言い回しに、アメリカの東海岸の訛りがある。\n\n## h_pre2\n@hide all\n@bg dorm\n@bgm calm\n@show hirose center\nhirose.d: ……おれ、人殺しですよね。\n\n## b2_c1\nhirose.d: 知らなかったんです。病院だなんて。\n## b2_o1\ntsubasa.k: 標的は「顧客A」と伏せられていました。指示にも、病院という言葉は1度も出ていません。\ntsubasa.k: 知らなかったのは、本当です。記録が、そう言っています。\nhirose.d: ……でも。\n\n## b2_c2\nhirose.d: でも、開けたのは、おれです。おれが、殺したんです。\n## b2_o2\ntsubasa.k: 君は、入口を開けた。病院を止めたのは、指示を出した者です。\ntsubasa.k: 重さは違います。……でも、ゼロではない。それは、君も分かっているはずです。\nhirose.d: ……はい。\n\n## b2_c3\nhirose.d: 自首する日を、決められなくて。……おれ、逃げてたんです。\n## b2_o3\ntsubasa.k: 逃げる人は、記録を消します。\ntsubasa.k: 君は、1行も消さずに、全部取ってあった。自分に不利な物まで。\nhirose.u: ……。\n\n## b2_c4\nhirose.d: ……親に、何て言えばいいか、分からないんです。\n## b2_o4\nonodera.n: 一緒に行くよ。私が。\nonodera.n: 親ってのはね、「やってしまった」より、「言いに来なかった」ほうが、こたえるんだ。……30年、刑事やって、それだけは分かってる。\nhirose.d: ……っ。\n\n## b2_end\n@bgm truth\nhirose.d: ……全部、話します。記録も、録音も、渡します。\nhirose.n: 指示してきた人を、捕まえてください。\n@hide all\n\n## b2_miss\nhirose.d: ……それは、いいんです。\n## b2_miss2\nhirose.d: 慰めてほしいんじゃ、ないんです。\n\n## h_end_a\ntsubasa.n: 家庭裁判所へ送ります。君が取ってあった記録を、全部つけて。\n## h_end_b\ntsubasa.n: 君を、協力者として扱います。指示役を追うのに、君の記録が要る。\n\n## h_end2\n@hide all\n@bg tokumei\n@bgm calm\n@card 5月19日（水）9:00｜特命班の部屋\n@show mendes center\nmendes.k: 総監。ニュージャージーの回線の持ち主、FBIで割りました。ジョナサン・ケイル。31歳。\nmendes.n: 録音の声と、訛りも合います。ドーンの「管理人」です。\n@show maki left\nmaki.n: ここから先は、FBIの仕事ですね。……総監、飛行機を取ります。\n@hide all\n@bgm tension\n*: 19歳に入口を開けさせた男が、ニュージャージーの住宅にいる。\n", "009": "# FILE 009 夜明けの突入\n@intro ニュージャージーの住宅に、ドーンの「管理人」がいる。夜明け前、家は静かだ。合図を出すのは、翼。\n@next FILE 010「夜明けの頭」につづく\n@end S ボーモント「誰も撃たず、誰も撃たれず。総監、これが一番いい朝です」\n@end A 千早「電源、入ったまま写せました！　今度は、画面も撮りました！」\n@end B グラント「総監、次は扉を全部、先に開けます」\n@meta have=tejou\n@view tsubasa 翼 | 物を見て、筋を通す\n@view mendes メンデス | 人に聞く。足で稼ぐ\n@view chihaya 千早 | 機械と記録を読む\n@char kale name=ケイル role=ドーンの「管理人」。31歳 sex=m skin=#f0cdb2 hair=#5a4a3a hs=messy eye=#6a8aa0 es=half tilt=5 jaw=1 brow=2.4 beard=stubble fit=hoodie:#4a4a52 pose=hands v=M,1.06,1.00,0.98,0.80\n@char emily name=エミリー role=ケイルの妻 sex=f skin=#f8dcc8 hair=#c89a5a hs=long eye=#5a9a7a es=soft tilt=5 jaw=0 brow=1.8 fit=shirt:#e8d8c8:#fff pose=stand v=F,0.96,0.99,1.00,0.85\n@ev tejou 伯父の手錠 | 錠 | 父の兄が警視庁で30年使った手錠。\n@ev buhin 道具の部品 | 部 | ケイルのパソコンに、ドーンの道具の元になった部品。電源が入ったまま、全部写した。\n@ev kata 名前のつけ方 | 型 | 部品の名前のつけ方は、数年前に流出した、ある国の情報機関の古い道具と同じ。\n@ev ue ケイルの話 | 上 | ケイルは道具を作っていない。「上」から渡された。上とは会った事がない。月に1度、ドラガンと声だけで話す。\n@ev rokuon 地下の録音 | 録 | 地下の機械に、ドラガンとの通話が全部録音されている。ケイルが、自分を守るために残した。\n@ev kyaku 「客」 | 客 | 録音の中で、ドラガンは「客」の話をする。金ではなく、「特定の病院を止めてくれ」と頼む者がいる。\n@ev shonichi 客の注文 | 初 | 4月の録音。ドラガンの声。「客の注文だ。総監の初日に、目に見える形で」。\n\n@place c1 start=study need=buhin,kata,ue,rokuon,kyaku,shonichi\n@loc study ケイルの書斎 bg=study people=kale,ortega enter=grantmiss:miss\n@hs kpc chihaya 222,144,132,96 ついたままのパソコン -> t_kpc\n@hs tana tsubasa 466,46,140,202 本棚 -> t_tana\n@hs chika tsubasa 36,84,92,190 奥の扉 -> t_chika\n@talk kale mendes 道具は、誰が作ったんだ -> t_t_kale1\n@talk kale mendes 「上」とは、誰だ -> t_t_kale2\n@loc basement 地下の部屋 bg=basement cond=f:chika\n@hs rokuon chihaya 214,114,212,152 回っている機械 -> t_rokuon\n@hs tape2 tsubasa 466,86,138,178 日付のついた棚 -> [rokuon]t_tape t_tape0 | done=shonichi\n\n@battle b1 foe=kale title=ケイルの口を開かせろ bg=study miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev kata b1_o1 | あの道具は、ただの犯罪の道具ではない。どこから来たか。「証拠」。\n@ph b1_c2 ev rokuon b1_o2 | ケイルは「上」を信じていなかった。その印がある。「証拠」。\n@ph b1_c3 ev kyaku b1_o3 | 東京の病院は、金で選ばれたのか。「証拠」。\n@ph b1_c4 obs eyes b1_o4 | 「観察」。ケイルは、話しながら、どこかを見ている。 | eyes:目:84,92,90,38 | mouth:口:106,140,52,26 | wrist:手:80,282,92,50\n@ph b1_c5 view mendes b1_o5 | 家族を守る話は、人と話してきた仲間に。「視点」。\n@ph b1_c6 ded 2 b1_o6 | 「推理」。客の注文を、正しく言おう。 | できるだけ高い身代金を取れ | アメリカの病院を先に止めろ | 総監の初日に、目に見える形で\n\n@flow miss\n play t_miss\n ask グラントに、何と言う？ | 安全を先に見たんですね -> t_miss_a | あの扉を、いま一緒に見ましょう -> t_miss_b | すぐ言ってくれて、助かります -> t_miss_c\n play t_miss_after\n@flow main\n cp\n play t_intro\n ask ボーモントに、どう答える？ | 合図を出す -> t_go | もう少しだけ待つ -> t_wait\n play t_entry\n banner FILE 009 | 夜明けの突入\n cp\n inv c1\n cp\n play t_pre\n battle b1\n ask ケイルを、どうする？ | 証人にする。家族ごと守る -> t_end_a | 録音を使って、ドラガンを動かす -> t_end_b\n play t_end2\n\n## t_intro\n@bg njhouse\n@bgm tension\n@card 5月20日（木）5:58｜ニュージャージー州　住宅地\n@tel beaumont\nbeaumont.n: 全隊、配置よし。……総監、いつでも行けます。\nbeaumont.n: 中に、熱が3つ。大人が2つ。小さいのが1つ。……子どもがいます。\nbeaumont.k: 合図をください。待てと言われれば、何時間でも待てます。\n\n## t_go\ntsubasa.k: 行ってください。子どもの部屋は、最後に。静かに。\n## t_wait\ntsubasa.k: 30秒だけ、待ってください。……2階の灯りが、消えてからに。\n@obj mado glow\nbeaumont.n: 了解。……消えました。行きます。\n\n## t_entry\n@tel off\n@sfx door\n@obj van shake\n*: ――ドン！　玄関の扉が、内側へ倒れる。\n*: ――黒い影が6つ、音もなく廊下へ流れこむ。\n@tel ortega\nortega.k: 入ります。……1階、よし。2階、よし。\nortega.n: 確保。男1名。武器なし。……女性と子どもは、寝室で無事です。\n@tel off\n\n## t_miss\n@show grant center\n@bgm calm\ngrant.d: 総監。……すみません、私です。\ngrant.d: 書斎の奥の扉を、物置だと判断して、後回しにしました。熱が映らなかったので。\ngrant.d: まだ、開けていません。\n\n## t_miss_a\ntsubasa.n: 安全を先に見たんですね。それは、正しい順番です。\n## t_miss_b\ntsubasa.n: あの扉を、いま一緒に見ましょう。\n## t_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## t_miss_after\n@sfx door\n@obj chika open\n@show emily left\nemily.t: ……撃たないで。私です。エミリー・ケイル。\nemily.d: 夫を、守りたいんです。あの扉の下に、機械があります。夫が、全部録ってきた物が。\n@hide all\n@bgm invest\n@flag chika\n*: 「移動」に、地下の部屋が増えた。\n\n## t_kpc\n@show chihaya center\nchihaya.k: 電源、入ったままです。……触りません。このまま、中身を写します。今度は、画面も先に撮りました。\nchihaya.n: ありました。ドーンの道具の、元になった部品です。\n@get buhin\nchihaya.u: ……総監。部品の名前のつけ方が、変です。3文字と、数字4けた。\nchihaya.n: 何年か前に流出した、どこかの国の情報機関の道具と、同じつけ方です。\n@hide chihaya\n@get kata\n\n## t_tana\n*: 本棚に、プログラムの本と、家族の写真。写真の中の子どもは、3歳くらい。クレヨンの絵が、はさんである。\n\n## t_chika\n*: 書斎の奥の扉。床に、何度も開け閉めした跡がある。物置にしては、よく使われている。\n\n## t_t_kale1\nkale.d: 作ってない。おれは、配ってただけだ。\nkale.n: 道具は、上から来た。完成した物が、ある朝、届いてた。おれは説明書を書いて、下請けに貸した。\n## t_t_kale2\nkale.t: 知らない。会った事がない。顔も、名前も。\nkale.n: 月に1度、ドラガンと話す。声だけだ。金の話と、次の標的の話。……それだけだ。\n@get ue\n\n## t_rokuon\n@obj rokuon glow\n@show chihaya center\nchihaya.u: 録音機です。……古い型ですけど、回ってます。いまも。\nchihaya.k: ドラガンとの通話、全部入ってます。2年分。日付の札つきで。\n@hide chihaya\n@get rokuon\n\n## t_tape0\n*: 棚に、日付の札。……何が入っているのか、まず機械を確かめたい。\n\n## t_tape\n@obj rokuon spin\n*: 3月の札を取って、機械にかける。ドラガンの声。「今度は、金じゃない。客がいる。特定の病院を、止めてほしいそうだ」。\n@get kyaku\n*: 4月の札。「客の注文だ。総監の初日に、目に見える形で。……画面の隅に、あいさつを入れておけ」。\n@get shonichi\n\n## t_pre\n@hide all\n@bg study\n@bgm tension\n@card 5月20日（木）7:10｜ケイルの書斎\n@show kale center\nkale.d: ……弁護士を呼んでくれ。それまで、何も話さない。\nkale.t: おれは、ただの管理人だ。\n\n## b1_c1\nkale.n: おれは管理人だ。道具を配って、金を数えただけだ。\n## b1_o1\ntsubasa.k: あなたが配った道具の部品は、ある国の情報機関の道具と、同じ名前のつけ方です。\ntsubasa.k: ただの犯罪の道具じゃない。国が作った物です。\nkale.u: ……国？\n\n## b1_c2\nkale.t: 知らない。上から渡された物だ。おれは、上を信じて、言われたとおりに。\n## b1_o2\ntsubasa.k: あなたは、ドラガンとの通話を、2年分、全部録音していました。\ntsubasa.k: 信じている相手の声は、録りません。あなたは、いつか切られると分かっていた。\nkale.d: ……。\n\n## b1_c3\nkale.n: ……東京の病院？　あれは、ただの標的の1つだ。金になる所を選んだだけだ。\n## b1_o3\ntsubasa.k: 3月の録音で、ドラガンは言っています。「今度は、金じゃない。客がいる」。\ntsubasa.k: 東京の病院は、金で選ばれたんじゃない。誰かの注文です。\nkale.t: ……聞いたのか。あれを。\n\n## b1_c4\nkale.t: 客の事は、知らない。本当だ。……おれは、何も。\n## b1_o4\ntsubasa.k: さっきから、本棚ばかり見ていますね。\ntsubasa.k: 家族の写真が、あそこにある。……話せば、家族が危ない。そう思っている。\nkale.u: ……！\n\n## b1_c5\nkale.d: ……ドラガンは、裏切った者の家を知ってる。おれが話せば、エミリーと、あの子が。\n## b1_o5\nmendes.n: ケイル。証人保護って制度がある。名前も、家も、変える。家族ごとだ。\nmendes.n: おれにも子どもがいる。……奥さんは、あんたを守るために、あの扉を自分で開けて出てきたぞ。\nkale.d: エミリーが……。\n\n## b1_c6\nkale.d: ……分かった。4月の注文は、変だった。金の話が、1つもなかった。\n## b1_o6\ntsubasa.k: 「総監の初日に、目に見える形で」。\ntsubasa.k: 客は、私の就任の朝に合わせて、病院を止めさせた。\n\n## b1_end\n@bgm truth\nkale.d: ……そうだ。画面の隅の「ようこそ、総監」も、注文だ。おれが、入れた。\nkale.n: 客が誰かは、ドラガンしか知らない。……あいつは来週、休暇を取る。インド洋の島だ。毎年、同じホテルに。\n@hide all\n\n## b1_miss\nkale.t: ……弁護士を呼んでくれ。\n## b1_miss2\nkale.n: それが、何だって言うんだ。\n\n## t_end_a\ntsubasa.k: ケイルさん。証人になってください。家族は、きょうから、こちらで守ります。\n@show emily center\nemily.d: ……ありがとう。あの子には、まだ、何も分からないの。\n## t_end_b\ntsubasa.k: 録音を使います。ドラガンに、あなたが捕まった事を、まだ知らせません。\n@show mendes center\nmendes.k: 休暇は、予定どおりに取らせる。……島で、待つわけですね。\n\n## t_end2\n@hide all\n@bg njhouse\n@bgm calm\n@card 5月20日（木）8:30｜住宅地\n@show chihaya left\nchihaya.s: 総監！　今回は、電源を落とす前の画面、ちゃんと撮りました。3枚も！\n@show mendes right\nmendes.k: ……総監。「初日に、目に見える形で」。あなたが総監になる日を、前もって知っていた者がいる。\n@hide all\n@bgm tension\n*: 就任の日は、発表の3日前まで、両国の政府の中でしか知られていなかった。\n", "010": "# FILE 010 夜明けの頭\n@intro インド洋の島。休暇中のドラガンが捕まった。抵抗はしない。「引き渡しの前に、総監と話したい」。\n@next 第1章「身代金の章」完。第2章「完全密室の章」につづく\n@end S 耕平「……よくやった。きょうは、何も聞かん。食え」\n@end A メンデス「総監、第1章はここまでですね。……次は、もっと近い所の話になりそうです」\n@end B ローゼン「総監、次の目録は、3回読み上げます」\n@meta have=miura,shonichi,juusan\n@view tsubasa 翼 | 物を見て、筋を通す\n@view mendes メンデス | 人に聞く。足で稼ぐ\n@view rosen ローゼン | 数字と記録を読む\n@char rosen name=ローゼン role=FBIの会計担当の捜査官 sex=f skin=#f2d0bb hair=#a8683a hs=wavy eye=#4a9a5a es=soft tilt=-3 jaw=0 brow=1.8 gl=round fit=suit:#3d4a44:#f3efe8 pose=tablet\n@char dragan name=ドラガン role=ランサム集団「ドーン」の頭。37歳 sex=m skin=#f0cfb4 hair=#2a2a30 hs=slick eye=#8a9aa8 es=cool tilt=-6 jaw=1 brow=2.6 beard=goatee sm=1 fit=shirt:#f4f0e4:#fff pose=cross v=M,0.86,0.94,0.92,0.65\n@char shocho name=署長 role=島の国の警察 sex=m skin=#b07a50 hair=#1e1a18 hs=buzz eye=#6a4a2a es=soft tilt=4 jaw=2 brow=3 wide=1 fit=work:#3a6a8a:#fff:POLICE patchc=#ffffff pose=stand v=M,0.92,0.96,0.94,1.10\n@ev miura 三浦部長の5時間 | 5 | 東京の病院。三浦部長は、閉じこめられたあと5時間、1人で暗号化を止めようとして、亡くなった。\n@ev shonichi 客の注文 | 初 | ケイルの録音。ドラガンの声。「客の注文だ。総監の初日に、目に見える形で」。\n@ev juusan 毎月13日 | 13 | ベルタの入金口からは、毎月13日に、受け取った額の2割が、同じ1つの口座へ出ていく。\n@ev kami 紙の財布 | 紙 | ドラガンの鞄の中の、1枚の紙。口座を動かす鍵が、手で書いてある。\n@ev shinzoku 鍵で動く口座 | 族 | 紙の財布の鍵で動く口座は、毎月13日の金を受け取り、大統領の親族の会社へ送っていた。\n@ev senkyo 6月の選挙 | 選 | ドラガンの国は、6月に大統領の選挙を控えている。\n\n@place c1 start=resort need=kami,shinzoku,senkyo\n@loc resort リゾートのテラス bg=resort\n@hs laptop rosen 276,206,128,64 ノートパソコン -> o_laptop\n@hs kaban tsubasa 470,276,90,66 ドラガンの鞄 -> o_kaban\n@loc station 島の警察署 bg=station people=shocho enter=rosenmiss:miss\n@hs mokuroku rosen 240,218,66,44 持ち物の目録 -> o_mokuroku\n@hs nimotsu tsubasa 330,208,84,46 持ち物の箱 -> o_nimotsu\n@talk shocho mendes 引き渡しの手続きは -> o_t_shocho\n\n@battle b1 foe=dragan title=ドラガンの取引を見きわめろ bg=station miss=b1_miss,b1_miss2 end=b1_end\n@ph b1_c1 ev miura b1_o1 | 「戻る」と言えない物が、1つある。「証拠」。\n@ph b1_c2 ev shonichi b1_o2 | 東京の病院は、事故ではない。選ばれ方を見せよう。「証拠」。\n@ph b1_c3 ev juusan b1_o3 | ドラガンの取引の札を、こちらはもう知っている。「証拠」。\n@ph b1_c4 ev shinzoku b1_o4 | 数字だけではない。口座と、行き先がある。「証拠」。\n@ph b1_c5 obs mouth b1_o5 | 「観察」。「知らない」と言う時だけ、顔のどこかが動く。 | eyes:目:84,92,90,38 | mouth:口:106,140,52,26 | arms:腕:44,254,150,60\n@ph b1_c6 ded 0 b1_o6 | 「推理」。客とドラガンの間に立ったのは、誰か。 | 大統領府の者 | ケイル | ベルタの創業者\n\n@flow miss\n play o_miss\n ask ローゼンに、何と言う？ | 空港は、あわただしかったですからね -> o_miss_a | 書き忘れた物を、いま一緒に見ましょう -> o_miss_b | すぐ言ってくれて、助かります -> o_miss_c\n play o_miss_after\n@flow main\n cp\n play o_intro\n banner FILE 010 | 夜明けの頭\n cp\n inv c1\n cp\n play o_pre\n battle b1\n ask ドラガンを、どうする？ | 司法取引をする。大統領の事を話させる -> o_end_a | 取引なしで起訴する -> o_end_b | 送金の流れを、選挙の前に公表する -> o_end_c\n play o_end2\n play o_home\n\n## o_intro\n@bg resort\n@bgm calm\n@card 5月28日（金）10:20｜インド洋の島　リゾート\n@show shocho left\nshocho.s: ようこそ、総監。暑いでしょう。……アメリカからの依頼どおり、けさ、捕まえました。\nshocho.n: 抵抗は、ありません。朝食の途中でした。「卵を食べ終わっていいか」と聞かれましたよ。\n@show mendes right\nmendes.k: ……落ち着いたもんだ。\nshocho.n: それと、本人が言っています。「引き渡しの前に、総監と話したい」と。\n@hide all\n\n## o_laptop\n@obj laptop glow\n@show rosen center\nrosen.n: ノートパソコンです。島の国の決まりで、引き渡しまで数週間かかります。中は、まだ見られません。\nrosen.t: 待つしかない物は、待ちます。……ほかを、見ましょう。\n@hide rosen\n\n## o_kaban\n@obj kaban hop\n*: ドラガンの鞄。本が2冊、日焼け止め、サングラス。本の間に、紙が1枚はさんである。\n*: 手で書いた、長い文字の列。……口座を動かす「鍵」だ。紙の財布。\n@get kami\n\n## o_miss\n@show rosen center\n@bgm calm\nrosen.d: 総監。……すみません、私です。\nrosen.d: 空港で作った持ち物の目録に、あの紙を、書き忘れました。本の間の、1枚です。\nrosen.d: 目録にない物は、法廷で「あとから入れた」と言われます。\n\n## o_miss_a\ntsubasa.n: 空港は、あわただしかったですからね。\n## o_miss_b\ntsubasa.n: 書き忘れた物を、いま、署長の前で一緒に確かめましょう。\n## o_miss_c\ntsubasa.s: すぐ言ってくれて、助かります。\n\n## o_miss_after\n@show shocho left\nshocho.n: 心配いりません。鞄を開けた時の写真を、うちの署で撮ってあります。日付も、時刻も入っています。\nrosen.u: ……ありがとうございます。では、その紙の鍵で動く口座を、確かめさせてください。\n@hide all\n@bgm invest\n\n## o_mokuroku\n@obj mokuroku hop\n@show rosen center\nrosen.k: 紙の鍵で動く口座、たどれました。……毎月13日のお金が、着く口座です。007の。\nrosen.n: そこから先は、1つの会社へ送られています。社長は、大統領の、義理の弟です。\n@hide rosen\n@get shinzoku\n\n## o_nimotsu\n@obj nimotsu hop\n*: 持ち物の箱。旅券、ホテルの鍵、新聞。新聞の1面に、ドラガンの国の大統領の顔。「6月の選挙へ、支持を訴える」。\n@get senkyo\n\n## o_t_shocho\nshocho.n: 裁判所の手続きに、数週間かかります。小さな国ですから、判事が2人しかいないんです。\nshocho.t: ……けさから、ある国の大使館が、3回も電話をかけてきます。「手違いだ、放せ」と。\nshocho.s: 放しませんよ。卵を最後まで食べさせた礼は、もう済みましたからね。\n\n## o_pre\n@hide all\n@bg station\n@bgm tension\n@card 5月28日（金）14:00｜島の警察署\n@show dragan center\ndragan.s: 総監。お若い。写真より、ずっと。\ndragan.n: 座ってください。私は、逃げません。……話をしましょう。ビジネスの話を。\n\n## b1_c1\ndragan.s: これは、ビジネスです。病院が払えば、病院は戻る。誰も、傷つかない。\n## b1_o1\ntsubasa.k: 東京の病院で、人が1人死にました。三浦さん。58歳。\ntsubasa.k: 閉じこめられて、5時間、1人で病棟の機械を守って。……戻りません。\ndragan.n: ……あれは、事故です。\n\n## b1_c2\ndragan.n: 事故ですよ。うちは、人を殺さない。金にならないからです。\n## b1_o2\ntsubasa.k: あの病院は、金で選んだんじゃない。「総監の初日に、目に見える形で」。\ntsubasa.k: あなたの声です。ケイルの地下の録音にありました。\ndragan.n: ……ケイルは、録っていたのか。用心深い男だ。\n\n## b1_c3\ndragan.s: なら、取引です。私は、ある大統領の話ができる。あなたの知らない話を。\n## b1_o3\ntsubasa.k: 毎月13日。受け取った身代金の、2割。\ntsubasa.k: その話なら、もう知っています。\ndragan.u: ……。\n\n## b1_c4\ndragan.n: 数字を知っていても、証拠がないでしょう。あの口座は、誰の名前でもない。\n## b1_o4\ntsubasa.k: あなたの鞄の、紙の鍵で動く口座です。そこから、大統領の義理の弟の会社へ送られています。\ntsubasa.k: 証拠は、あなたが本にはさんで持ってきました。\ndragan.d: ……休暇に、仕事を持ってくるものじゃないな。\n\n## b1_c5\ndragan.n: ……客の名は、知らない。本当です。\n## b1_o5\ntsubasa.k: 「知らない」と言う時だけ、口の端が上がります。\ntsubasa.k: 名前は知らない。……でも、名前のほかに、知っている事がある。\ndragan.s: ……よく見ている。\n\n## b1_c6\ndragan.n: 私は、客と直接は話していない。間に、人が立った。\n## b1_o6\ntsubasa.k: 大統領府の者です。あなたを守り、2割を受け取る側が、客を取り次いだ。\ntsubasa.k: 客は、あなたではなく、あなたの国の大統領に、頼んだんです。\n\n## b1_end\n@bgm truth\ndragan.n: ……そのとおりです。注文は、大統領府の男が持ってきた。\ndragan.k: 総監。1つだけ、お礼に。その男は言いました。「客は、あの総監の国の言葉を話していた」と。\ndragan.s: 英語か、日本語か。……それは、聞いていません。あなたには、国が2つありますからね。\n@hide all\n\n## b1_miss\ndragan.s: 総監。それは、取引の役に立ちませんよ。\n## b1_miss2\ndragan.n: 話を、戻しましょう。\n\n## o_end_a\ntsubasa.k: 取引をします。大統領の事を、全部、法廷で話してください。\n@show mendes center\nmendes.n: 検事のシャピロが、条件を詰めます。……総監、選挙の前に間に合わせましょう。\n## o_end_b\ntsubasa.k: 取引はしません。病院を止めた罪で、起訴します。\n@show mendes center\nmendes.n: 大統領の線は、紙の鍵と、13日の記録で追えます。……あなたらしい決め方だ。\n## o_end_c\ntsubasa.k: 送金の流れを、公表します。選挙の前に。あの国の人たちが、決める事です。\n@show rosen center\nrosen.k: 数字は、全部そろえます。誰が読んでも分かる形に。\n\n## o_end2\n@hide all\n@bg airport\n@bgm calm\n@card 5月29日（土）18:00｜島の空港\n@show shocho left\nshocho.s: また来てください、総監。今度は、仕事ではなく。\n@show rosen right\nrosen.n: 総監。目録、3回読み上げました。今度は、1つも抜けていません。\n@hide all\n*: 飛行機が、夕日の中へ上がっていく。\n\n## o_home\n@bg kouhei\n@obj night on\n@bgm home\n@card 5月31日（月）23:00｜神田　食堂「こうへい」\n@show kohei center\nkohei.n: おう。……焼けたな。南のほうか。\nkohei.n: 食ったか。……飛行機のめしは、めしのうちに入らん。座れ。\nkohei.s: さば、取ってある。今度は、ちゃんと間に合ったな。\n@hide all\n@bgm tension\n*: 客は、翼の国の言葉を話す。英語か、日本語か。\n*: 就任の日を、前もって知っていた者。……近くに、いる。\n"};

  const P = C.places[key]; let id = P.start; await enterLoc(P, key, id, true);

    showPeople(L);
    const i = await choose([{ l: '調べる', sub: '物を見る' }, { l: '話す', sub: '人に聞く' }, { l: '移動', sub: '場所を変える' }, { l: '視点', sub: VIEWS[st.view].n + 'から代わる' }], { cls: 'grid', msg: `${L.n}。手がかり ${needCount(P)} / ${P.need.length}` });

/* --- showdown --- */
let focus = 5;
function drawBhud(B, i){ const h = $('#bhud'); h.hidden = false; h.innerHTML = `<div class="wall"><span>${CHARS[B.foe].name}の言い分</span><div class="segs">${B.ph.map((_, k) => `<i class="${k < i ? 'broken' : ''}"></i>`).join('')}</div></div><div class="focus"><span>集中</span>${[0, 1, 2, 3, 4].map(k => `<b class="${k < focus ? 'on' : ''}"></b>`).join('')}</div>`; }
function lastLine(id){ const b = STORY[id].filter(x => x.who && x.who !== '*'); return b[b.length - 1]; }
async function observe(B, ph){

    const ox = slot ? POS[slot.dataset.pos] : 0, oy = slot ? CY : 0, zs = slot ? CS : 1, done = v => { hsG.innerHTML = ''; menu.innerHTML = ''; ch.classList.remove('tell-loop', 'tell-' + ph.a); res(v); };

async function battle(key){
  const B = C.battles[key]; await setBg(B.bg); hideChar('all'); if (!bg.querySelector(`.mini[data-id="${B.foe}"]`)) showChar(B.foe, 'center'); setPlace('追及'); $('#viewbadge').hidden = true; focus = 5;
  AudioSys.bgm('battle'); await banner('追及', B.title);
  const vs = Object.keys(VIEWS).filter(v => v !== 'tsubasa');
  for (let i = 0; i < B.ph.length; i++){
    const ph = B.ph[i]; window.__ph = ph; drawBhud(B, i); await play(ph.c); const claim = lastLine(ph.c);
    for (let ok = false; !ok;){
      drawBhud(B, i); if (!bg.querySelector(`.mini[data-id="${B.foe}"]`)) showChar(B.foe, 'center'); setSpeaker('*');
      const c = await choose([{ l: '証拠', sub: '物を出す' }, { l: '推理', sub: '答えを言う' }, { l: '視点', sub: '仲間に代わる' }, { l: '観察', sub: '動きを見る' }, { l: 'ヒント', cls: 'hint' }], { cls: 'grid battle', msg: `${CHARS[claim.who].name}「${claim.t}」`, kind: 'claim' });

      else if (c === 1){ if (ph.t !== 'ded') await narr('まだ、言い切れる答えがない。物か、人の話か、相手の動きで崩そう。'); else { const j = await choose(ph.o.map(l => ({ l })).concat([{ l: 'やめる', back: 1, cls: 'back' }]), { msg: '何と言う？' }); if (j >= 0) res = j === ph.a; } }
      else if (c === 2){ if (!vs.length){ await narr('いまは、代われる仲間がいない。'); } else { const j = await choose(vs.map(v => ({ l: VIEWS[v].n, sub: VIEWS[v].d })).concat([{ l: 'やめる', back: 1, cls: 'back' }]), { msg: '誰に代わる？' }); if (j >= 0){ if (ph.t === 'view' && vs[j] === ph.a) res = true; else await narr(`${VIEWS[vs[j]].n}は、首を横に振った。いまは、出番ではないらしい。`); } } }

/* --- timeline puzzle --- */
async function timeline(key){
  const T = C.timelines[key], E = T.events, tl = $('#tl'); tl.hidden = false; const order = E.map((x, i) => i).sort(() => Math.random() - 0.5); let n = 0;

/* --- flow --- */
async function runFlow(F, from, top){
  for (let i = from; i < F.length; i++){
    const s = F[i];
    if (s.op === 'cp'){ if (top){ st.step = i; saveProgress(); setPlace(''); } }
    else if (s.op === 'play') await play(s.a);
    else if (s.op === 'inv') await investigate(s.a);
    else if (s.op === 'battle') await battle(s.a);
    else if (s.op === 'bg') await setBg(s.a);
    else if (s.op === 'flowx') await runFlow(C.flows[s.a], 0, false);
    else if (s.op === 'timeline') await timeline(s.a);
    else if (s.op === 'banner'){ hideChar('all'); await banner(s.a, s.b); }
    else if (s.op === 'ask'){ const j = await choose(s.opts.map(o => ({ l: o.l, cls: o.angry ? 'angry' : '' })), { msg: s.msg }); if (s.opts[j].b) await play(s.opts[j].b); }
  }
}
async function runCase(id, resume){
