<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>総監翼 止まった病院</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: one screen. Top = the scene (640x400), bottom = a manga speech panel and big command buttons. */
:root{ --ink:#141833; --night:#1b2150; --paper:#fffaf0; --line:#11132a; --sun:#ffc531; --teal:#22c9bd; --rose:#ff4f6d; --sky:#6fd0ff; --mute:#8d93b8;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif; --f-disp:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background-image:radial-gradient(#252b63 1.6px,transparent 1.7px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stagewrap{position:relative;width:min(100%,calc((100dvh - 320px) * 1.6));max-width:100%;aspect-ratio:8/5;flex:none;border:4px solid var(--line);border-radius:14px;overflow:hidden;background:#000;box-shadow:6px 6px 0 #0008}
#stage{display:block;width:100%;height:100%}
#stage.quake{animation:quake .4s}
#app.hurt #stagewrap{animation:hurt .45s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@keyframes hurt{0%,100%{filter:none;transform:none}25%{filter:sepia(1) saturate(6) hue-rotate(-40deg);transform:translateX(-8px)}60%{transform:translateX(8px)}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}#fade.on{opacity:1}
/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;gap:8px;padding:8px;pointer-events:none}
#place{background:var(--line);color:var(--sun);border:2px solid var(--sun);border-radius:999px;padding:3px 12px;font-size:clamp(11px,1.6vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
#place:empty{display:none}
#viewbadge{display:flex;align-items:center;gap:4px;background:var(--paper);color:var(--line);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:clamp(11px,1.6vw,14px)}
#viewbadge svg{width:30px;height:30px;border-radius:50%;background:var(--sky)}
#hudbtns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#hudbtns button{position:relative;background:var(--paper);color:var(--line);border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-size:clamp(11px,1.6vw,14px);box-shadow:2px 2px 0 var(--line)}
#b-ev[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--rose);color:#fff;border-radius:999px;font-size:11px;min-width:18px;line-height:18px;text-align:center}
#bhud{position:absolute;left:8px;right:8px;top:44px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:clamp(10px,1.5vw,13px)}
#bhud .wall,#bhud .focus{background:#000a;border:2px solid var(--paper);border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:6px}
#bhud .segs{display:flex;gap:3px}#bhud .segs i{width:clamp(14px,3vw,26px);height:12px;background:var(--rose);border:2px solid #fff;border-radius:3px;display:block}
#bhud .segs i.broken{background:transparent;border-style:dashed;opacity:.5}
#bhud .focus b{width:12px;height:12px;border-radius:50%;border:2px solid #fff;display:block}#bhud .focus b.on{background:var(--teal)}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000b;text-align:center;animation:fadein .2s}
#card .c1{font-weight:900;font-size:clamp(15px,3vw,26px);color:var(--sun);letter-spacing:.06em}#card .c2{font-size:clamp(13px,2.4vw,20px)}
#getpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,460px);background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--sun);animation:pop .25s}
.gp-h{background:var(--line);color:var(--sun);padding:5px 12px;font-weight:900;font-size:clamp(12px,2vw,16px);border-radius:8px 8px 0 0}
.gp-b{display:flex;gap:10px;padding:10px 12px;align-items:flex-start;font-size:clamp(12px,2vw,16px)}.gp-b p{margin:4px 0 0;font-weight:500;font-size:.92em;line-height:1.5}
.evk{flex:none;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:10px;background:var(--sun);border:2px solid var(--line);font-family:var(--f-body);font-weight:900;font-size:1.15em;color:var(--line)}
#cutin{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
#cutin.banner{background:repeating-linear-gradient(-45deg,#ffc531 0 18px,#ffb000 18px 36px);color:var(--line);animation:slidein .25s}
#cutin .bn{font-family:var(--f-disp);font-size:clamp(26px,7vw,60px);letter-spacing:.1em;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
#cutin .bs{font-size:clamp(13px,2.6vw,22px);background:var(--line);color:var(--paper);padding:3px 14px;border-radius:999px}
#cutin.eyes{background:#000c}
#cutin.eyes svg{width:100%;height:42%;border-block:5px solid var(--line);animation:slidein .18s;background:var(--sun)}
#cutin.eyes .ct{position:absolute;right:6%;bottom:16%;font-family:var(--f-disp);font-size:clamp(28px,8vw,64px);color:#fff;-webkit-text-stroke:3px var(--rose);paint-order:stroke fill;transform:rotate(-6deg);animation:pop .2s}
#tl{position:absolute;left:8px;top:44px;bottom:8px;width:min(60%,330px);background:#fffaf0f2;color:var(--line);border:3px solid var(--line);border-radius:12px;padding:6px 10px;overflow:auto;font-size:clamp(11px,1.8vw,15px)}
#tl h3{margin:0 0 4px;font-weight:900;font-size:1.05em}#tl p{margin:3px 0;display:flex;gap:8px;line-height:1.35}#tl b{flex:none;width:3.2em;color:#b3202a;font-variant-numeric:tabular-nums}#tl .q{opacity:.6}#tl .hit{background:var(--sun);border-radius:6px;padding:2px 4px}
@keyframes fadein{from{opacity:0}}@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}@keyframes slidein{from{transform:translateX(-100%)}}
/* panel */
#panel{width:min(100%,calc((100dvh - 320px) * 1.6));max-width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#dialog{position:relative;background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-height:74px;box-shadow:5px 5px 0 #0008;cursor:pointer;font-size:clamp(15px,2.5vw,21px);line-height:1.55}
#dialog[data-kind="narr"]{background:#2a316e;color:var(--paper);border-color:var(--sky);font-weight:500}
#dialog[data-kind="me"]{background:#e6f6ff}
#dialog[data-kind="claim"]{background:#ffe9ec;border-color:var(--rose)}
#name{position:absolute;top:-15px;left:14px;background:var(--rose);color:#fff;border:3px solid var(--line);border-radius:999px;padding:0 14px;font-size:.8em;line-height:1.5}
#dialog[data-kind="me"] #name{background:#2a7fd6}
#text{min-height:3.1em;white-space:pre-wrap}
#dialog[data-kind="claim"] #text,#dialog.short #text{min-height:1.5em}
#dialog.short{min-height:0;padding-block:10px}
#bhud span{white-space:nowrap}
#next{position:absolute;right:12px;bottom:4px;color:var(--rose);animation:bob .7s infinite alternate}@keyframes bob{to{transform:translateY(4px)}}
#menu{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:0 5px 6px 0}
#menu.grid,#menu.two{display:grid;grid-template-columns:repeat(2,1fr)}#menu.grid.battle .hint{grid-column:1/-1}
@media (min-width:640px){#menu.grid{grid-template-columns:repeat(4,1fr)}#menu.grid.battle{grid-template-columns:repeat(5,1fr)}#menu.grid.battle .hint{grid-column:auto}}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--sun);color:var(--line);border:3px solid var(--line);border-radius:14px;padding:9px 14px;font-size:clamp(14px,2.3vw,19px);box-shadow:4px 4px 0 var(--line);min-width:0}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.opt small{font-size:.72em;font-weight:500;opacity:.8}.opt:disabled{opacity:.45;cursor:default}
.opt.back{background:var(--paper)}.opt.hint{background:var(--sky);align-items:center}.opt.ghost{background:#c9cde6}.opt.seen{background:#f2dfa0}.opt.seen span::after{content:" ✓"}.opt.angry{background:var(--rose);color:#fff}
/* modal */
#modal{position:absolute;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:16px}
.mbox{width:min(100%,560px);max-height:calc(100dvh - 48px);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--paper);color:var(--line);border:4px solid var(--line);border-radius:16px;padding:14px;box-shadow:6px 6px 0 var(--sun)}
.mbox h2{margin:0;font-family:var(--f-body);font-weight:900;font-size:clamp(16px,3vw,22px)}
.evlist,.loglist,.setlist{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0;user-select:text;-webkit-user-select:text}
.evrow{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;color:var(--line);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:clamp(13px,2.1vw,16px)}
.evrow:disabled{opacity:1;cursor:default}.evrow small{display:block;font-weight:500;line-height:1.45}.evrow:not(:disabled){box-shadow:3px 3px 0 var(--line)}
.loglist p{margin:0;font-weight:500;font-size:14px;line-height:1.5}.loglist b{margin-right:8px;color:#b3202a}
.setlist label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}.setlist input[type=range]{width:50%}.setlist input[type=checkbox]{width:24px;height:24px}
.mclose{align-self:flex-end;background:var(--line);color:var(--paper);border:0;border-radius:10px;padding:8px 18px}
/* title + result */
#title,#result{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--ink);background-image:radial-gradient(#2a3072 2px,transparent 2.2px);background-size:16px 16px;padding:16px;overflow:auto}
.tbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;align-items:center;max-width:820px}
#titlechar{width:clamp(120px,30vw,260px);grid-row:span 3;filter:drop-shadow(6px 6px 0 #0008)}#titlechar svg{display:block;width:100%}
.t-file{display:inline-block;background:var(--rose);color:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:900;letter-spacing:.1em;font-size:clamp(12px,2vw,16px);transform:rotate(-3deg)}
.t-h1{margin:6px 0 0;font-family:var(--f-disp);font-size:clamp(30px,8vw,68px);line-height:1.05;color:var(--sun);-webkit-text-stroke:2px var(--line);text-shadow:5px 5px 0 var(--rose);text-wrap:balance}
.t-sub{margin:10px 0 0;font-size:clamp(13px,2.2vw,18px);line-height:1.6;font-weight:500;max-width:30em}
#t-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}#t-btns .opt{align-items:center;min-width:9em}#t-cont{background:var(--teal)}
#t-load{font-size:15px;color:var(--sky)}
.t-note{grid-column:1/-1;font-size:12px;font-weight:500;color:var(--mute);margin:8px 0 0;line-height:1.6}
@media (max-width:560px){.tbox{grid-template-columns:1fr;justify-items:center;text-align:center}#titlechar{grid-row:auto}#t-btns{justify-content:center}}
.rbox{text-align:center;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rf{font-weight:900;color:var(--sun);font-size:clamp(16px,3.4vw,26px)}.rs{font-family:var(--f-disp);font-size:clamp(34px,9vw,72px);color:#fff;-webkit-text-stroke:2px var(--rose)}
.rank{font-family:var(--f-disp);font-size:clamp(60px,16vw,120px);line-height:1;color:var(--sun);text-shadow:6px 6px 0 var(--rose);animation:pop2 .5s}.rank-B{color:var(--sky)}@keyframes pop2{from{transform:scale(3);opacity:0}}
.rd,.rc,.rn{margin:0;font-size:clamp(13px,2.4vw,18px)}.rc{font-weight:500}.rn{color:var(--teal)}.credit{font-size:11px;color:var(--mute);font-weight:500;line-height:1.6}
/* ---------- characters ---------- */
.eye-shut,.eye-smile,.m-open,.fx-sweat,.fx-anger{display:none}
.ch.blink .eye-open{display:none}.ch.blink .eye-shut{display:inline}
.ch.eyes-smile .eye-open,.ch.eyes-smile .eye-shut{display:none}.ch.eyes-smile .eye-smile{display:inline}
.ch.talk .m-open{display:inline}.ch.talk .m-shape{display:none}
.m-open{transform-box:fill-box;transform-origin:50% 20%}
.brow{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.ch-head{transform-origin:120px 200px}.ch-hairb{transform-origin:120px 200px}
.ch[data-e="t"] .fx-sweat{display:inline;animation:sweat 1.1s infinite}.ch[data-e="a"] .fx-anger{display:inline;animation:pulse .45s infinite alternate;transform-box:fill-box;transform-origin:center}
.ch[data-e="d"] .iris{transform:translateY(2.5px)}.ch[data-e="t"] .iris{animation:dart 1.4s infinite}.ch[data-e="u"] .iris{transform:scale(.82);transform-box:fill-box;transform-origin:center}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}@keyframes pulse{to{transform:scale(1.3)}}@keyframes dart{0%,100%{transform:none}30%{transform:translateX(-2.5px)}65%{transform:translateX(2.5px)}}
.slot{transition:opacity .2s}.slot.dim{filter:brightness(.62) saturate(.8)}.slot-in{animation:enter .28s both;transform-box:fill-box;transform-origin:50% 100%}
#chars.away .slot{opacity:0;pointer-events:none}
@keyframes enter{from{transform:translateY(30px);opacity:0}}
.slot-in.jump{animation:jump .45s}.slot-in.shake{animation:shake .5s}.slot-in.droop{animation:droop .7s both}.slot-in.shiver{animation:shiver .5s}.slot-in.hop{animation:hop .4s}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-22px) scale(1.03)}60%{transform:translateY(4px)}}@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px) scale(1.04)}30%{transform:translateX(9px) scale(1.04)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
@keyframes droop{to{transform:translateY(9px) rotate(1.5deg)}}@keyframes shiver{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.hand-r{transition:transform .35s}.ch.tell .hand-r{animation:tell 2.4s}.ch.tell-loop .hand-r{animation:tell 2.6s infinite}
@keyframes tell{0%,12%,88%,100%{transform:none}28%,72%{transform:translate(44px,-6px)}}
/* hotspots */
.hot rect{fill:#ffc53122;stroke:#ffc531;stroke-width:2.5;stroke-dasharray:8 6;animation:dash 1s linear infinite;cursor:pointer}
.hot .ring{fill:none;stroke:#fff;stroke-width:3;animation:ring 1.1s infinite;transform-box:fill-box;transform-origin:center}.hot .dot{fill:#ff4f6d;stroke:#fff;stroke-width:2}
.hot text{fill:#fff;font:900 12px var(--f-body);pointer-events:none}.hot .hl{font-size:13px;paint-order:stroke;stroke:#11132a;stroke-width:4px;stroke-linejoin:round}
.hot.seen rect{fill:#22c9bd22;stroke:#22c9bd}.hot.seen .dot{fill:#22c9bd}.hot.seen .ring{animation:none;opacity:.4}
.hot.ghost rect{fill:#ffffff14;stroke:#c9cde6;animation:none}.hot.ghost .dot{fill:#6a70a0}.hot.ghost .ring{animation:none;opacity:.3}.hot.ghost .hl{opacity:.7}
.zone rect{fill:#6fd0ff26;stroke:#6fd0ff;stroke-width:3;stroke-dasharray:7 5;animation:dash 1s linear infinite;cursor:pointer}.zone text{fill:#fff;font:900 15px var(--f-body);paint-order:stroke;stroke:#11132a;stroke-width:4px}
@keyframes dash{to{stroke-dashoffset:-28}}@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.cuffx .flash{animation:flash .5s both}.cuffx .cl{animation:cl .5s both}.cuffx .cr{animation:cr .5s both}@keyframes flash{from{opacity:.9}to{opacity:0}}@keyframes cl{from{transform:translateX(-200px)}}@keyframes cr{from{transform:translateX(200px)}}
/* ---------- scene objects ---------- */
.steam{animation:steam 2.4s infinite linear}.steam.s2{animation-delay:-.8s}.steam.s3{animation-delay:-1.6s}@keyframes steam{from{transform:translateY(8px);opacity:0}30%{opacity:.75}to{transform:translateY(-16px);opacity:0}}
.nr{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s infinite ease-in-out alternate}.nr.n2{animation-delay:-1s}.nr.n3{animation-delay:-2s}@keyframes sway{from{transform:skewX(-3deg)}to{transform:skewX(3deg)}}
.tvflick{animation:tvf 3.1s infinite steps(1)}@keyframes tvf{0%,100%{opacity:0}48%{opacity:.14}50%{opacity:0}77%{opacity:.08}79%{opacity:0}}
#bg[data-scene="kouhei"] .sec{transform-origin:250px 86px;animation:spin 60s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cuffs{opacity:0;transition:opacity .4s}#bg[data-tsutsumi="open"] .cuffs{opacity:1}#bg[data-tsutsumi="open"] .wrap{opacity:.25;transform:translate(8px,10px);transition:.4s}
#bg[data-night="on"] .nightshade{opacity:.5}#bg[data-night="on"] .win rect{fill:#1a2452}#bg[data-night="on"] .sun{fill:#f4f4dc}
.scr-on{display:none}[data-screenl="on"] .screenL .scr-on,[data-screenr="on"] .screenR .scr-on,[data-screent="on"] .mon2 .scr-on,[data-pc="on"] .pc .scr-on{display:inline}
[data-screenl="on"] .screenL .scr-off,[data-screenr="on"] .screenR .scr-off,[data-screent="on"] .mon2 .scr-off{display:none}
.cloud{animation:cloud 26s linear infinite alternate}@keyframes cloud{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
.blink{animation:blk 1.2s infinite steps(1)}@keyframes blk{50%{opacity:.15}}
.led{animation:blk 1s infinite steps(1)}.lockled{animation:blk .8s infinite steps(1)}
.fl.f1{animation:flk 4.3s infinite steps(1)}@keyframes flk{0%,100%{opacity:1}91%{opacity:.4}93%{opacity:1}96%{opacity:.5}}
.tape{animation:sway2 2.4s infinite ease-in-out alternate;transform-box:fill-box;transform-origin:0 50%}@keyframes sway2{from{transform:rotate(-1deg)}to{transform:rotate(1.2deg)}}
.jglow{animation:glow 2.6s infinite alternate}@keyframes glow{from{opacity:.75}to{opacity:1}}[data-jihanki="blink"] .jglow{animation:blk .3s 4 steps(1)}
.can{opacity:0}[data-jihanki="drop"] .can{animation:drop .6s both}@keyframes drop{0%{opacity:1;transform:translateY(-40px)}70%{opacity:1;transform:translateY(12px)}85%{transform:translateY(8px)}100%{opacity:1;transform:translateY(12px)}}
.redglow rect{animation:glow 1.4s infinite alternate}.rs{animation:rs 1.2s infinite alternate}@keyframes rs{to{fill:#c9262a}}
.chair{transform-box:fill-box;transform-origin:20% 100%;transition:transform .5s cubic-bezier(.5,1.6,.6,1)}[data-chair="fall"] .chair{transform:rotate(-58deg)}
.recv{transition:transform .35s;transform-box:fill-box;transform-origin:0 100%}[data-phone="lift"] .recv{transform:translateY(-14px) rotate(-14deg)}
.lkdoor{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s}[data-locker="open"] .lkdoor{transform:scaleX(.14) skewY(-8deg)}[data-locker="open"] .bottle{animation:hop2 .6s .5s}@keyframes hop2{50%{transform:translateY(-8px)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:rot .5s linear infinite}@keyframes rot{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}[data-gear="spin"] .gear{animation:spin 1.2s linear 2}
.wave{stroke-dasharray:6 4;animation:dash 1.2s linear infinite}
.candy{transform-box:fill-box;transform-origin:50% 100%}[data-candy="shake"] .candy{animation:shiver .5s 2}
.logroll{animation:roll 16s linear infinite}@keyframes roll{from{transform:translate(62px,100px)}to{transform:translate(62px,-54px)}}[data-logscroll="on"] .logroll{animation-duration:5s}

      <div><span class="t-file">FILE 001</span><h1 class="t-h1">止まった病院</h1></div>
      <p class="t-sub">20歳でFBIと警察庁の長になった総監・翼。初登庁の朝、東京の病院が止まり、地下のサーバー室で人が死んでいた。扉は、中から閉まっていた。</p>
      <div><div id="t-btns"><button id="t-new" class="opt"><span>はじめから</span></button><button id="t-cont" class="opt" hidden><span>つづきから</span></button></div><div id="t-load" hidden>声を読みこんでいます…</div></div>
      <p class="t-note">調べる。人に聞く。視点を代える。証拠で、相手の言い分を崩す。音と声が出ます。遊ぶ時間は30分ほど。物語と人物は架空です。</p>

<script>
const STORY_TXT = "## pro_shop\n@bg kouhei\n@bgm home\n@card 4月12日（月）6:30｜神田　食堂「こうへい」\n@show kohei center\nkohei.n: 食え。卵は甘いほうだ。\nkohei.n: ……上着はそれだけか。きょうは風が冷たいぞ。\n*: 画面の光っている所をタップして、店の中を見てみよう。\n\n## pro_tv\nnews.n: きょうから、日米統合サイバー捜査総監の翼氏が、霞が関に登庁します。\nnews.n: 20歳。FBI、CIA、警察庁の長を1人で兼ねるのは、世界で初めてです。\nkohei.s: ……テレビのお前は、少し太って見えるな。\n\n## pro_miso\n*: 豆腐とわかめの味噌汁。湯気が立っている。\nkohei.n: 冷めるぞ。話はあとだ。\n\n## pro_tsutsumi\n@obj tsutsumi open\n@sfx get\nkohei.k: 兄貴の手錠だ。警視庁で30年使った。\nkohei.n: お前が持ってろ。使わずに済むなら、それが一番いい。\n@get tejou\n\n## pro_takano\n@sfx door\n@show takano right\ntakano.n: おはようございます、総監。警護課の鷹野です。\ntakano.n: 車は表に回してあります。7時30分に出ます。\nkohei.n: 行ってこい。……晩めしは、取っておく。\n\n## pro_brief\n@hide all\n@bg kaigi\n@bgm calm\n@card 8:00｜霞が関　警察庁20階　会議室\n@show yuki left\nyuki.n: 秘書官の結城です。日米合同ブリーフィング、画面はもうつながっています。\n@obj screenL on\noconnor.n: FBI副長官のオコナーです。今夜、全米で病院が3つ、ランサムウェアで止まりました。\n@obj screenR on\nkane.s: CIAのケインです。おはようございます、総監。ラングレーは夜ですが、紅茶はいれてあります。\n@show chihaya right\nchihaya.s: 技官の千早です。24です。総監より4つ上です。\nchihaya.t: ……すみません、いま言う事じゃなかったです。\n@sfx phone\nyuki.u: 総監、警視庁の早瀬課長からです。スピーカーにします。\n@bgm tension\n@tel hayase\nhayase.k: 早瀬です。文京区の東都医科大学病院のシステムが、けさ6時に全部止まりました。\nhayase.k: 画面に身代金の要求。それと、地下2階のサーバー室で、男性が1人亡くなっています。\nhayase.k: 扉は、中から閉まっていました。\n@tel off\n\n## pro_go\ntsubasa.k: 現場へ行きます。千早さん、小野寺さん、一緒に来てください。\n@hide yuki\n@show onodera left\nonodera.n: 承知しました。足で稼ぐのは、私の仕事です。\nchihaya.s: はいっ。機械は、私が見ます。\n\n## c1_arrive\n@hide all\n@bg rouka\n@bgm invest\n@card 9:40｜東都医科大学病院　地下2階\n@show onizuka center\nonizuka.k: 総監ご本人ですか。捜査一課の鬼塚です。\nonizuka.n: 人が死んだら一課です。サイバーかどうかは、そのあとで決めます。\n@show hayase left\nhayase.n: 扉は電子錠です。記録では、ゆうべ22時14分に、情報システム部長の三浦さんの職員証で入っています。\nhayase.n: そのあと、誰も入っていません。出た記録もありません。\n@show kanri right\nkanri.t: けさ6時に、扉が開かなくなりました。消防の人に、横の壁を外してもらったんです。\nonizuka.n: 部長はモニターの前で倒れていました。外傷なし。持病は心臓。\nonizuka.k: 病死でしょう。だが、決めるのは見てからだ。\n@get nyutai\n@hide all\n*: 「調べる」で物を見る。「話す」で人に聞く。「移動」で場所を変える。\n*: 「視点」で、小野寺と千早に代わる。人が変わると、見える物と聞ける話が変わる。\n\n## c1_door\n@show furukawa center\nfurukawa.n: 科捜研の古川です。触りません。写真が先です。\nfurukawa.k: この錠は、分解すれば、何回開いたかが分かります。1日ください。\n@hide furukawa\n\n## c1_kabe\n*: 消防が外した壁の板。ここから中に入れる。扉そのものは、いまも閉じたままだ。\n\n## c1_jihanki\n@obj jihanki blink\n*: 廊下の突き当たりの自販機。缶コーヒーの列が、1本ぶん減っている。\n\n## c1_reader\n@show chihaya center\nchihaya.k: 入退室の機械ですね。……あれ。記録が、ゆうべの23時40分で終わってます。\nchihaya.t: そのあとは真っ白です。止まったのか、消されたのか、まだ分かりません。\n@hide chihaya\n\n## c1_t_kanri_hito\nkanri.d: 部長は、毎晩、最後まで残る人でした。\nkanri.d: 心臓の薬は、いつも更衣室のロッカーです。サーバー室は、飲食も私物も禁止なので。\n*: 「移動」に、更衣室が増えた。\n\n## c1_t_kanri_tobira\nkanri.n: 扉は去年、新しい電子錠に替えました。中の非常ボタンも、同じ機械につながっています。\nkanri.t: 機械が止まると……中からも、開きません。\n\n## c1_t_onizuka\nonizuka.n: 病死です。争った跡がない。\nonizuka.n: ただ、机の缶コーヒーは気に入りません。サーバー室は、飲食禁止のはずだ。\n\n## c1_t_hayase\nhayase.n: 要求は50ビットコイン。いまの値で7億円ちょっと。期限は48時間です。\nhayase.k: 署名は「ドーン」。世界で、病院ばかりを狙う集団です。\n\n## c1_monitor\n*: 赤い画面。「あなたの病院は暗号化された。50BTC」。残り時間の数字が、1秒ずつ減っていく。\n@get ransom\n\n## c1_coffee\n*: 飲みかけの缶コーヒー。廊下の自販機と同じ銘柄。まだ半分残っている。\n@get coffee\n\n## c1_chair\n@obj chair fall\n@sfx thud\n*: 椅子の脚が1本、曲がっている。扉の内側、取っ手のまわりに、新しい傷がいくつもある。\n@get kizu\n\n## c1_phone\n@obj phone lift\n@show chihaya center\nchihaya.n: 内線、つながりません。……電話の機械ごと、止まってます。0時ちょうどから。\n@hide chihaya\n@get phone\n\n## c1_rack\n@show chihaya center\nchihaya.k: 暗号化は、全部いっぺんじゃないです。順番に止められてます。\nchihaya.n: 順番は、持ち帰って見ます。\n@hide chihaya\n\n## c1_tape\n@show onodera center\nonodera.d: モニターの前。キーボードに手を伸ばした形で、倒れていたそうです。\nonodera.n: 最後まで、何かを打っていたんですね。\n@hide onodera\n\n## c1_locker\n@obj locker open\n@sfx door\n*: 三浦のロッカー。上着と、薬の瓶。「発作の時に1錠」と書いてある。瓶は、ほとんど減っていない。\n@get kusuri\n\n## c1_locker_bench\n*: 長いすに、たたんだ新聞。きのうの夕刊だ。\n\n## c1_prebattle\n@hide all\n@show onizuka center\n@bgm tension\nonizuka.n: 総監。そろそろ、まとめましょう。\nonizuka.k: 持病の発作。争った跡なし。入った記録は本人だけ。\nonizuka.k: ……病死です。事件じゃない。\n\n## c1_prebattle2\ntsubasa.k: 待ってください。それでは、筋が通りません。\nonizuka.s: ほう。なら、聞かせてもらいましょうか。\nonizuka.k: 一課は、物でしか動きませんよ。\n*: 「追及」が始まる。相手の言い分を聞いて、4つの手から選ぶ。\n*: 「証拠」は物を出す。「推理」は答えを言う。「視点」は仲間に代わる。「観察」は相手の動きを見る。\n\n## b1_c1\nonizuka.k: 持病の発作だ。病死で終わりです。\n## b1_o1\ntsubasa.k: 薬は、更衣室のロッカーにありました。ほとんど減っていません。\ntsubasa.k: 発作の人が、薬を取りに行かなかった。なぜです。\nonizuka.u: ……。\n\n## b1_c2\nonizuka.n: 取りに行く間もなく、倒れたんでしょう。\n## b1_o2\ntsubasa.k: 椅子の脚が曲がり、扉の内側は傷だらけです。\ntsubasa.k: 倒れる前に、この人は、扉を開けようとしていた。\nonizuka.t: 椅子で、扉を……。\n\n## b1_c3\nonizuka.k: だが、管理者は言った。扉が止まったのは、けさ6時だ。夜中は開いたはずです。\n## b1_o3\nchihaya.k: 6時は「気づいた時刻」です。止まった時刻じゃありません。\nchihaya.n: 入退室の記録は、23時40分で切れてます。夜中に何が止まったかは、まだ誰も見てません。\nonizuka.t: ……むう。\n\n## b1_c4\nonizuka.n: 開かないなら、電話で助けを呼べばいい。あの部屋には内線がある。\n## b1_o4\ntsubasa.k: 内線は、0時ちょうどに切れています。\ntsubasa.k: 電話の機械ごと、止められていた。\nonizuka.u: 電話まで……。\n\n## b1_c5\nonizuka.k: ……なら総監。あの部屋で、何が起きたと言うんです。\n## b1_o5\ntsubasa.k: 三浦さんは、あの部屋に閉じこめられていた。\ntsubasa.k: 病気で死んだんじゃない。出られなくて、死んだんです。\n\n## b1_end\n@bgm truth\nonizuka.d: ……分かりました。事件です。\nonizuka.k: 一課とサイバー、合同でやりましょう。\nonizuka.n: ただし総監。閉じこめたのが「人」なのか「機械」なのか。そこは、まだ分かりませんよ。\n\n## b1_miss\nonizuka.n: それは、いまの話と関係がありませんな。\n## b1_miss2\nonizuka.s: 総監。物で話してください。\n\n## c2_kasouken\n@hide all\n@bg kasouken\n@bgm calm\n@card 4月13日（火）10:00｜警視庁　科捜研\n@show shiraishi center\nshiraishi.n: 分かった事と、分からない事を、分けて言います。飴、どうぞ。\n@show furukawa left\nfurukawa.k: 錠前の回数計は、記録より2回多く回っています。\nfurukawa.n: 最後の2回は、ゆうべ22時14分のあとです。\n@get counter\n@show kiryu right\nkiryu.n: 缶コーヒーの飲み口からは、三浦さんのDNAだけです。急ぎで、けさ出ました。\nshiraishi.n: 分からないのは、その2回を誰が回したか。なぜ記録にないか。\n@hide all\n@show onizuka center\n@bgm tension\nonizuka.k: 2回。入って、出た。……誰かがいたんですよ、総監。\nonizuka.a: 閉じこめたのは「人」だ。殺しの線で行きます。\n@hide all\n@bgm invest\n\n## c2_t_furukawa\nfurukawa.n: 錠前は、開いた回数を覚えています。誰が開けたかは、覚えていません。\nfurukawa.k: ただ、2回の間は短い。回り方の跡で分かります。せいぜい、数分です。\n\n## c2_t_kiryu\nkiryu.n: 解剖の結果が来ました。心臓の発作。外傷なし。\nkiryu.n: 亡くなったのは、朝5時20分ごろです。\n@get kaibou\n\n## c2_t_miyashita\nmiyashita.n: 缶の中身は、1つずつ消していきます。毒の有無は、1週間ください。\nmiyashita.n: いまのところ、何も出ていません。\n\n## c2_gear\n@obj gear spin\n*: 分解された錠前。小さな歯車の数字が、記録より2つ進んでいる。\n\n## c2_candy\n@obj candy shake\n@show shiraishi center\nshiraishi.s: どうぞ。考える時は、甘い物です。\n@hide shiraishi\n\n## c2_miss\n@show chihaya center\n@bgm calm\nchihaya.d: 総監、すみません、私です。\nchihaya.d: 病院のサーバーの写しを取る時に、電源を落とす前の画面を、撮り忘れました。\nchihaya.d: 画面の時刻が、どこまで本当か……もう、分かりません。\n\n## c2_miss_a\ntsubasa.s: すぐ言ってくれて、助かりました。次の手を、一緒に考えましょう。\n## c2_miss_b\ntsubasa.s: 大丈夫です。時刻は、ほかの機械にも残ります。\n## c2_miss_c\ntsubasa.s: 千早さんが、一番早く言ってくれた。それが大事です。\n\n## c2_miss_after\n@show sawaguchi left\nsawaguchi.n: 落とす直前の、ネットワークの機械の記録は、私が取ってあります。\nsawaguchi.n: 時刻は、そっちに残っています。\n@show mendes right\nmendes.s: 千早、自分で言えたな。それでいい。\nchihaya.s: ……はいっ。取り返します。\n@hide all\n@bgm invest\n\n## c2_nwlog\n@obj logscroll on\n@show chihaya center\nchihaya.k: 沢口さんの記録、読めました。順番が出ます。\nchihaya.n: 22時31分、外から侵入。23時40分、入退室の記録の機械が止まる。\nchihaya.n: 0時ちょうど、電話。0時5分、扉の制御。……扉は、0時5分から開きません。\n@show sawaguchi left\nsawaguchi.k: 総監、ここです。記録の機械と扉の間が、25分、空いてます。\n@hide all\n@get nwlog\n\n## c2_sousa\n@show sawaguchi center\nsawaguchi.n: サーバーの写しから、画面の操作の記録が出ました。\nsawaguchi.d: 0時10分から、朝5時20分まで。三浦さんは1人で、暗号化を手で止めようとしていました。\n@show chihaya right\nchihaya.d: ……止められた機械が、3つあります。全部、病棟の機械です。\n@hide all\n@get sousa\n\n## c2_sousa_early\n@show sawaguchi center\nsawaguchi.n: こっちの解析は、まだ途中です。先に、千早の読んでいる記録を。\n@hide sawaguchi\n\n## c2_t_mendes\nmendes.n: 総監、段取りはこうです。侵入の入口は、うちとFBIで追います。\nmendes.n: 密室のほうは、総監の目で。\n\n## c2_clock\n*: 東京とワシントンの時計。13時間ずれて、同じ速さで進んでいる。\n\n## c2_jihanki\n@show onodera center\nonodera.n: 自販機の会社に、売上の記録を出してもらいました。\n@obj jihanki drop\n@sfx thud\nonodera.k: ゆうべ、この機械で売れたのは1本だけ。23時42分。缶コーヒーです。\n@hide onodera\n@get jihanki\n\n## c2_t_kanri\nkanri.d: 部長は、毎晩23時半すぎに、コーヒーを買いに出るんです。1分で戻ります。\nkanri.d: 「夜中の1本が、おれの残業代だ」って。\n\n## c2_door\n*: 廊下からサーバー室の扉まで、歩いて20歩。自販機は突き当たり。往復で、1分とかからない。\n\n## c2_think\n@hide all\n@bgm truth\n*: 物はそろった。起きた事を、時刻の順に並べる。\n\n## c2_think_ok\n@sfx correct\n*: 時刻が、1本につながった。\n\n## c2_q_wrong\n*: ……違う。物と時刻を、もう1度見る。\n\n## c2_prebattle\n@bg kasouken\n@show onizuka center\n@bgm tension\nonizuka.k: 総監。殺しの線で、病院の関係者を全員、洗っています。\nonizuka.k: 2回多い。誰かが入って、出た。それが全部です。\n\n## b2_c1\nonizuka.k: 回数計は2回多い。誰かが入って、出たんです。殺しですよ。\n## b2_o1\ntsubasa.k: 23時42分、廊下の自販機で、缶コーヒーが1本売れています。\ntsubasa.k: 出て、戻った。それで2回です。回したのは、三浦さん本人です。\nonizuka.u: 本人が……。\n\n## b2_c2\nonizuka.n: 本人なら、職員証の記録が残るはずだ。記録には、ありません。\n## b2_o2\ntsubasa.k: 記録の機械は、23時40分に止められていました。\ntsubasa.k: その2分後の出入りは、どこにも残りません。\nonizuka.t: 先に、記録を……。\n\n## b2_c3\nonizuka.k: なら、なぜ逃げなかった。0時5分まで、扉は開いたんだ。\n## b2_o3\ntsubasa.k: 気づいていなかったんです。コーヒーを買って戻り、席に着いた。\ntsubasa.k: 0時に電話が切れ、0時5分に扉が閉じた。気づいた時には、もう出られなかった。\nonizuka.d: ……。\n\n## b2_c4\nonizuka.n: ……それで、朝までの5時間。部長は、何をしていたんです。\n## b2_o4\ntsubasa.k: 止めようとしていました。0時10分から5時20分まで、1人で。\ntsubasa.k: 病棟の機械を3つ、守っています。\nonizuka.d: 5時間、1人で……。\n\n## b2_end\n@bgm truth\nonizuka.d: ……殺しじゃない。\nonizuka.k: だが、殺されたのと同じだ。閉じこめたのは、機械を止めたやつらです。\nonizuka.k: 総監。入口を開けたやつを、挙げましょう。\n\n## b2_miss\nonizuka.n: それでは、2回の説明になりませんな。\n## b2_miss2\nonizuka.s: 総監。一課を納得させるには、物が要ります。\n\n## c3_brief\n@hide all\n@bg tokumei\n@bgm invest\n@card 4月15日（木）9:00｜特命班の部屋\n@show mendes center\nmendes.n: 総監、入口が分かりました。医療機器メーカー「メディコア・ジャパン」の、保守用の遠隔接続です。\nmendes.k: 22時31分に入ったのは、保守担当の堀健吾のアカウント。接続元は、海外です。\n@get remote\n@obj screenT on\nrosen.n: ワシントンのローゼンです。総監、お金のほうは、私が追います。\n@show onodera left\nonodera.n: 堀さんには、私が会ってきましょうか。……いえ。総監も、ご一緒に。\n\n## c3_maker\n@hide all\n@bg maker\n@card 11:00｜メディコア・ジャパン　保守部\n@show hori center\nhori.t: 堀です。……あの夜は、家で寝ていました。接続なんか、していません。\nhori.t: アカウントを、盗まれたんです。私も、被害者ですよ。\n@hide all\n\n## c3_pc\n@obj pc on\n@show chihaya center\nchihaya.n: 保守用のパソコンです。電源の記録を見ます。……あの夜は、1度も起動していません。\nchihaya.k: 堀さんの手では、つないでいない。そこは本当です。\n@hide chihaya\n@get pc\n\n## c3_nidan\n@obj server blink\n@show chihaya center\nchihaya.k: 保守のアカウントの、設定の記録です。……あれ。\nchihaya.u: 堀さんのアカウントだけ、二段階の確認が外されてます。1月12日。この部屋の、堀さんの席のパソコンからです。\n@hide chihaya\n@get nidan\n\n## c3_token\n@obj cabinet open\n*: 確認用の小さな機械の棚。堀の分は、いまも棚にある。貸し出しの帳面に、持ち出しの記録はない。\n\n## c3_window\n*: 窓の外を、雲が流れていく。向かいのビルに、病院の看板が見える。\n\n## c3_t_kacho\nkacho.n: 堀は、まじめな男です。ただ、去年は元気がなかった。借金があると聞きました。\nkacho.n: それが1月の半ばに、急に明るくなりましてね。「全部返した」と。\n@get hensai\n\n## c3_t_hori_nidan\nhori.t: ……外しました。夜中の呼び出しのたびに、あの機械を取りに来るのが、面倒で。\nhori.t: それだけです。売ってなんか、いません。\n\n## c3_t_hori_kane\n@obj tell on\nhori.n: 金には、困っていません。\n*: 堀の右手が、左の手首の上に動いた。\n\n## c3_t_hori_miura\nhori.d: 三浦部長には、点検のたびに、お世話になりました。……いい人でした。\n\n## c3_t_rosen1\nrosen.n: 総監、見つけました。ダークウェブに、1月13日の出品です。\nrosen.n: 「東京の大学病院。保守の入口。0.3ビットコイン」。買い手がついたのは、1月14日。\n@get darkweb\n\n## c3_t_rosen2\nrosen.k: 送金が1件、合いました。0.3ビットコインは、日本の取引所の口座へ。\nrosen.k: 1月15日に、円で出金。口座の名義は、堀健吾です。\n@get okane\n\n## c3_t_rosen0\nrosen.n: 出品をさがしています。総監、手がかりを1つください。日付があると、早いです。\n\n## c3_t_rosen1b\nrosen.n: 買い手に払われた0.3ビットコインの行き先を、追っています。受け取った人の暮らしに、変わった事はありませんか。\n\n## c3_t_sawaguchi\nsawaguchi.n: 総監、ドーンがあの入口を使ったのは、買ってから3か月後です。\nsawaguchi.k: 3か月、中を静かに見ていた事になります。\n\n## c3_prebattle\n@hide all\n@bg maker\n@bgm tension\n@show hori center\nhori.t: まだ、何か。……私は被害者だと、言ったはずです。\n\n## b3_c1\nhori.t: アカウントは盗まれたんです。私は、何もしていない。\n## b3_o1\ntsubasa.k: 1月12日。あなたのアカウントだけ、二段階の確認が外されています。\ntsubasa.k: 外したのは、あなたの席のパソコンです。\nhori.u: そ、それは……面倒だったからです！\n\n## b3_c2\nhori.t: 外しただけだ。売ってなどいない。出品なんて、知りません。\n## b3_o2\ntsubasa.k: 出品は1月13日。確認を外した、次の日です。\ntsubasa.k: 盗んだ者が、あなたの外す日を、前もって知っていた事になります。\nhori.t: ぐ、偶然だ……。\n\n## b3_c3\nhori.n: 偶然です。だいたい、金には困っていない。売る理由が、ありません。\n## b3_o3\ntsubasa.k: 「金」と言うたびに、手首を隠しますね。\nhori.u: ……！\n\n## b3_c4\nhori.t: これは……癖です。借金なんか、ありません。\n## b3_o4\nonodera.n: 課長さんに伺いました。去年は、借金で元気がなかった。\nonodera.n: それが1月の半ばに、「全部返した」と。\nonodera.k: 人は、ログより正直です。\nhori.t: か、返したのは……親に、借りて……。\n\n## b3_c5\nhori.t: 親に借りたんです。調べれば分かる。\n## b3_o5\ntsubasa.k: 調べました。0.3ビットコインは、日本の取引所の、あなたの名義の口座に入っています。\ntsubasa.k: 1月15日に、円で出金。返済の日と、同じです。\nhori.u: ……あ……。\n\n## b3_c6\nhori.d: ……。\n## b3_o6\ntsubasa.k: 堀さん。病院の入口を売ったのは、あなたです。\n\n## b3_break\n@bgm truth\nhori.d: ……病院が止まるなんて、思わなかった。\nhori.d: 入口が1つ開くだけだと。誰かが、中をのぞくだけだと。\nhori.d: 人が、死ぬなんて……。\n\n## b3_calm\ntsubasa.k: 三浦さんは5時間、1人で止めようとしました。あなたが開けた入口を。\ntsubasa.k: その5時間を、法廷で聞いてください。\n\n## b3_angry\n@sfx shock\ntsubasa.a: 「思わなかった」で、済むか！\ntsubasa.a: あなたが開けた扉の向こうに、1100人の患者がいた。\ntsubasa.a: 三浦さんはその扉を、5時間、1人で押さえていたんだ！\n@show onizuka right\nonizuka.k: ……。\n*: 鬼塚が、黙って姿勢を正した。堀は、顔を上げられない。\n\n## b3_arrest_q\n@show onizuka right\nonizuka.n: 総監。手錠は。\n\n## b3_arrest_self\ntsubasa.k: 自分でかけます。\n@obj tejou close\n@sfx cuff\n*: 伯父の手錠が、小さな音を立てて閉じた。\nonizuka.k: 14時6分。不正アクセス禁止法違反の疑いで、逮捕。\n\n## b3_arrest_oni\ntsubasa.n: 鬼塚課長、お願いします。\n@sfx cuff\nonizuka.k: 14時6分。不正アクセス禁止法違反の疑いで、逮捕。\n\n## b3_last\nhori.d: ……三浦部長には、点検のたびに、缶コーヒーをおごってもらいました。\nhori.d: 廊下の、あの自販機です。\n@hide all\n\n## b3_miss\nhori.t: そ、それが何だと言うんです。\n## b3_miss2\nhori.n: 関係のない話は、やめてください。\n\n## ep_hospital\n@hide all\n@bg rouka\n@bgm calm\n@card 4月15日（木）21:00｜東都医科大学病院\n@show hayase left\nhayase.n: 総監。身代金の期限が過ぎました。病院を、どうしますか。\n\n## ep_a\ntsubasa.k: 払いません。3日前のバックアップから、戻しましょう。\n## ep_b\ntsubasa.k: 払いません。交渉で時間を稼ぎながら、バックアップから戻します。\n\n## ep_hospital2\nhayase.n: 承知しました。失われた3日分は、紙のカルテから、職員が手で打ち直すそうです。\n@show kanri right\nkanri.d: ……部長が守った3つの機械は、病棟の点滴の機械でした。\nkanri.d: あれが止まらなかったので、あの夜、病棟では誰も急変していません。\n@hide all\n\n## ep_shop\n@bg kouhei\n@obj night on\n@bgm home\n@card 23:10｜神田　食堂「こうへい」\n@show kohei center\nkohei.n: 食ったか。\nkohei.n: ……手錠、使ったのか。\nkohei.s: そうか。なら、味噌汁はもう1杯だ。\n@hide all\n\n## ep_hook\n@bg tokumei\n@bgm tension\n@card 4月16日（金）8:00｜特命班の部屋\n@show sawaguchi left\nsawaguchi.k: 総監、1つだけ。身代金の画面の、右下の隅です。拡大します。\n@obj ransomzoom on\n@sfx shock\n*: 小さな字で、こう書いてある。「ようこそ、総監」。\n@show chihaya right\nchihaya.u: ……これ、総監あてです。最初から。\n@show mendes center\nmendes.k: 続きがありそうだな、総監。\n@hide all\n";

  AudioSys.bgm('truth'); const sc = st.miss + st.hints * 0.5 + st.retries * 2, rank = sc <= 1 ? 'S' : sc <= 4 ? 'A' : 'B';
  const r = $('#result'); r.innerHTML = `<div class="rbox"><div class="rf">FILE 001　止まった病院</div><div class="rs">解決</div><div class="rank rank-${rank}">${rank}</div><div class="rd">まちがい ${st.miss} 回　／　ヒント ${st.hints} 回</div><p class="rc">${{ S: '耕平「……味噌汁、もう1杯だ。卵も焼く」', A: '鬼塚「総監。次も、一課は付き合いますよ」', B: '千早「総監、次は私も、もっと早く気づきます！」' }[rank]}</p><p class="rn">FILE 002「母の病院」につづく</p><button id="again" class="opt"><span>タイトルへ</span></button><p class="credit">声：Open JTalk と HTS voice "Mei"（© Nagoya Institute of Technology / MMDAgent Project Team, CC BY 3.0）を加工。物語と人物は架空です。</p></div>`; r.hidden = false;
  $('#again').onclick = () => location.reload();
}
/* --- title --- */
async function boot(){
  requestAnimationFrame(tick); bg.innerHTML = SCENES.rouka(); curBg = 'rouka';
  const tv = $('#titlechar'); tv.innerHTML = `<svg viewBox="0 -14 240 330"><g class="ch" data-id="tsubasa">${charSVG('tsubasa')}</g></svg>`; applyExpr(tv.querySelector('.ch'), 'k');
  const sv = loadSave(), bc = $('#t-cont'); bc.hidden = !sv || !sv.cp || sv.cp === 'pro';
  const start = async cp => { AudioSys.init(); $('#t-load').hidden = false; $('#t-btns').hidden = true; await AudioSys.loadPack(); $('#title').hidden = true; curBg = null; updHud(); run(cp); };
  $('#t-new').onclick = () => start('pro');
  bc.onclick = () => { st.flags = new Set(sv.flags); st.ev = sv.ev; st.seen = new Set(sv.seen); st.miss = sv.miss; st.hints = sv.hints; st.retries = sv.retries; st.cp = sv.cp; start(sv.cp); };
}
boot();
