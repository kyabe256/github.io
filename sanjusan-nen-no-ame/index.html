<script>/* ---------- people: inked bust portraits. viewBox 0 0 600 760, slight three-quarter view, light from the upper right ----------

const PORT = (() => {
  const INK = '#2a1d22';
  const r = n => Math.round(n * 10) / 10, P = (...a) => a.map(v => typeof v === 'number' ? r(v) : v).join(' ');
  const mixc = (a, b, t) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), x = h(a), y = h(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const EMO = { // eye opening, brow inner dy, brow outer dy, mouth kind
    n: [1, 0, 0, 'flat'], k: [.82, 3.5, -1, 'firm'], d: [.74, -4.5, 2.5, 'down'], a: [.86, 7, -3.5, 'grit'], u: [1.28, -7, -6, 'open'], s: [.72, -1, 0, 'smile'], t: [.95, -5.5, 1, 'wavy'], c: [0, 0, 1, 'flat'], p: [1.06, -6.5, .5, 'wavy'], o: [1.38, -8, -7, 'open'], g: [.92, 6.5, -3, 'firm'] };
  function build(c, emo = 'n', o = {}){
    const E = EMO[emo] || EMO.n, male = c.sex !== 'f', age = c.age || 35, kid = age < 14, old = age >= 60, mid = age >= 42, cx = 300, tx = -9;
    const fw = (kid ? 73 : male ? 81 : 74) * (c.fw || 1), top = kid ? 126 : 110, eyeY = kid ? 240 : 230, chin = (kid ? 320 : male ? 331 : 322) + (c.long || 0), fh = chin - eyeY;
    const nw = (kid ? 30 : male ? (old ? 47 : 51) : 38) * (c.nw || 1), ncx = cx + 6, sw = kid ? 102 : male ? 164 : 132, shY = kid ? 420 : male ? 426 : 420, pit = [ncx - 4, kid ? 384 : male ? 396 : 388];
    const skin = c.skin || '#fbe3cf', sh1 = mixc(skin, '#cf7f63', .34), sh2 = mixc(skin, '#a0543f', .5), hairC = c.hair || '#2c232b', hairHi = mixc(hairC, '#ffe9d6', .42), grey = c.grey || 0;
    const hc = grey ? mixc(hairC, '#d6d0cb', grey) : hairC, hInk = grey > .5 ? '#3b3f45' : INK, jw = c.jaw ?? (kid ? .1 : male ? .42 : .1);
    const L = (d, w = 2, x = '') => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
    const F = (d, fill, w = 2.6, x = '') => `<path d="${d}" fill="${fill}" stroke="${w ? INK : 'none'}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${x}/>`;
    const T = (d, fill, op = 1) => `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
    /* --- skeleton landmarks --- */
    const TL = [cx - fw + 7, eyeY - 30], CL = [cx - fw + 4, eyeY + 22], JL = [cx - fw + 14 + (1 - jw) * 7, eyeY + fh * .72], CHL = [cx + tx - 19 - jw * 7, chin - 5], CH = [cx + tx, chin], CHR = [cx + tx + 21 + jw * 8, chin - 5],
      JR = [cx + fw - 9 - (1 - jw) * 9, eyeY + fh * .6], CR = [cx + fw + 1, eyeY + 14], TR = [cx + fw - 1, eyeY - 34];
    const face = P('M', ...TL, 'C', TL[0] - 3, eyeY - 4, CL[0] - 1, CL[1] - 12, ...CL, 'C', CL[0] + 1, CL[1] + 22, JL[0] - 5, JL[1] - 16, ...JL, 'C', JL[0] + 6, JL[1] + 15, CHL[0] - 14, CHL[1] - 7, ...CHL, 'Q', ...CH, ...CHR,
      'C', CHR[0] + 15, CHR[1] - 4, JR[0] - 5, JR[1] + 17, ...JR, 'C', JR[0] + 8, JR[1] - 20, CR[0], CR[1] + 22, ...CR, 'C', CR[0], CR[1] - 20, TR[0] + 2, TR[1] + 12, ...TR, 'C', TR[0] - 2, top + 22, cx + 52, top, cx + 2, top, 'C', cx - 50, top, TL[0] + 2, top + 26, ...TL, 'Z');
    /* --- neck and shoulders (bare; the clothes go over) --- */
    const nL = ncx - nw, nR = ncx + nw, nbL = [nL - 3, pit[1] - 18], nbR = [nR + 4, pit[1] - 23];
    const torso = P('M', nL + 1, chin - 34, 'L', nL - 1, nbL[1] - 14, 'C', nL - 4, nbL[1] + 6, cx - sw + 78, shY - 30, cx - sw + 10, shY - 2, 'C', cx - sw - 12, shY + 6, cx - sw - 22, shY + 40, cx - sw - 26, shY + 90, 'L', cx - sw - 34, 760, 'L', cx + sw + 34, 760, 'L', cx + sw + 26, shY + 88,

    if (male && !kid) neck += L(P('M', ncx - 9, chin + 26, 'q', 5, 7, 1, 15), 1.3, 'opacity=".6"');

    /* --- clothes --- */
    const K = c.cloth || { t: 'shirt' }, col = K.c || '#3a4250', colS = mixc(col, '#05070a', .42), colH = mixc(col, '#ffffff', .22), white = K.w || '#e9ebe8', whS = mixc(white, '#59606e', .32);
    const bodyOut = P('M', nbL[0] - 2, nbL[1] + 2, 'C', nL - 6, nbL[1] + 14, cx - sw + 80, shY - 34, cx - sw + 6, shY - 8, 'C', cx - sw - 18, shY, cx - sw - 30, shY + 36, cx - sw - 34, shY + 92, 'L', cx - sw - 44, 760, 'L', cx + sw + 44, 760, 'L', cx + sw + 34, shY + 90,
      'C', cx + sw + 30, shY + 34, cx + sw + 18, shY - 2, cx + sw - 6, shY - 10, 'C', cx + sw - 80, shY - 36, nR + 8, nbR[1] + 14, nbR[0] + 2, nbR[1] + 2);
    const armL = L(P('M', cx - sw + 18, shY + 70, 'C', cx - sw + 26, shY + 150, cx - sw + 20, 700, cx - sw + 24, 760), 2, 'opacity=".75"'), armR = L(P('M', cx + sw - 20, shY + 66, 'C', cx + sw - 28, shY + 150, cx + sw - 24, 700, cx + sw - 26, 760), 2, 'opacity=".75"');
    const shirt = (open) => { // collar band wraps the base of the neck; wings fall from it
      let s = F(P('M', nbL[0] - 1, nbL[1] + 3, 'C', nbL[0] + 6, pit[1] + 16, pit[0] - 10, pit[1] + 40, pit[0] - 2, 760, 'L', pit[0] + 40, 760, 'C', pit[0] + 18, pit[1] + 40, nbR[0] - 4, pit[1] + 10, nbR[0] + 1, nbR[1] + 3, 'C', nbR[0] - 14, pit[1] + 2, nbL[0] + 16, pit[1] + 6, nbL[0] - 1, nbL[1] + 3, 'Z'), white, 0);
      if (open) s += F(P('M', pit[0] - 16, pit[1] + 6, 'L', pit[0] + 2, pit[1] + 62, 'L', pit[0] + 20, pit[1] + 4, 'Q', pit[0] + 2, pit[1] + 12, pit[0] - 16, pit[1] + 6, 'Z'), skin, 0) + T(P('M', pit[0] - 16, pit[1] + 6, 'L', pit[0] + 2, pit[1] + 62, 'L', pit[0] + 4, pit[1] + 30, 'Z'), sh1, .6);
      s += F(P('M', nbL[0] - 3, nbL[1] - 2, 'C', nbL[0] + 2, pit[1] - 2, pit[0] - 20, pit[1] + 8, pit[0] - 3, pit[1] + 13, 'L', pit[0] - 36, pit[1] + 52, 'L', nbL[0] - 15, nbL[1] + 16, 'Z'), white, 2.4) + T(P('M', pit[0] - 3, pit[1] + 13, 'L', pit[0] - 36, pit[1] + 52, 'L', pit[0] - 30, pit[1] + 34, 'Z'), whS, .7);
      s += F(P('M', nbR[0] + 3, nbR[1] - 2, 'C', nbR[0] - 3, pit[1] - 4, pit[0] + 24, pit[1] + 7, pit[0] + 5, pit[1] + 13, 'L', pit[0] + 42, pit[1] + 50, 'L', nbR[0] + 16, nbR[1] + 16, 'Z'), white, 2.4);

const STORY_TXT = "# 三十三年目の雨　台本\n# 行の形： 人.表情: 台詞　（表情 n ふつう k きびしい d しずむ a おこる u おどろく s ほほえむ t こまる c 目をとじる）\n# @get 証拠   @fact 事実   @flag 名前   @card 字幕   @sfx 音   @day 日付の字\n## op\n@card 2026年11月6日（金）　夜　黒檜の森\ntadashi60.n: ……行くのか。\nren.k: はい。33年前の現場を、この目で見てきます。見たら、すぐ帰ります。\ntadashi60.s: そうか。……気をつけてな。\nren.n: 匡さん。どうして、この穴の事を、僕に教えてくれたんですか。\ntadashi60.c: ……そのうち、分かる。\n@sfx rain\n@card 2026年11月7日（土）　朝\nakari.d: 三雲さん。灯です。……雨穴の前で、人が亡くなっています。\nakari.d: うちの、父です。\nsaku.u: ……朽木さんが。\nakari.k: 鑑識として、私が見ます。止めないでください。登山口で待っています。\nsaku.k: 分かった。すぐ行く。\n## tut_drive\nsaku.n: 車は、ゆっくり走る。「進む」を1度押すと走り、もう1度押すと止まる。\nsaku.n: 分かれ道では、車が止まって待つ。急ぐ事は、何もない。\n## tut_walk\nsaku.n: 歩く時も同じだ。矢印を1度押すと歩き、もう1度押すと止まる。行きたい所を、じかに押してもいい。\n## f26_akari_first\nakari.k: 三雲さん。ここです。\nsaku.d: ……灯。つらいなら、代わる。\nakari.k: いいえ。父の事は、私がいちばん知っています。だから、私が見ます。\nakari.n: 見つけたのは、朝の散歩の人。6時10分です。\nakari.n: 遺体は、まだ動かしていません。三雲さんの目で、全部見てください。\n@flag met_akari\n## f26_body_done\nsaku.k: ……おかしい所が、いくつもある。\nakari.t: はい。着ている物も、持っている物も、父の物では、ありません。\nakari.n: 体温と、体の固まり方から、亡くなったのは、きのうの20時半から22時半の間です。\n@fact f_tod\nakari.d: ……父は、殺されたんですね。\nsaku.k: ああ。こめかみを、固い物で、1度。\n## akari26_night\nakari.n: きのうの夜、父は20時半に宿を出ました。母には、「見送りがある」と言ったそうです。\nakari.t: 誰の見送りかは、分かりません。こんな森で、夜に。\n## akari26_ren\nakari.n: 蓮くんですか。発電所の、汐見蓮。……きのうから、連絡がつきません。\nakari.n: 蓮くんは、父と仲がよかったんです。年は33も離れているのに、兄弟みたいでした。\nakari.s: 私より4つ下なのに、生意気で。……無事だと、いいんですが。\n## akari26_dna\nakari.n: 2人とも、同じ夜に消えました。念のため、遺体と、蓮くんの持ち物を、照らし合わせます。\nakari.n: 汐見先生から、蓮くんの歯ブラシを借りてきてください。\n@flag need_tooth\n## f26_rencar\nsaku.n: 白い車。汐見蓮の車だ。きのうの夜から、ここにある。\nsaku.k: 中に、発電所の社員証。……ドライブレコーダーが、動いている。\n@get e_dash\n## f26_sign\nsaku.n: 登山口の看板。雨穴までは、歩いて10分。\n## f26_tunnel\nsaku.n: 斜面の、古い排水坑の口。コンクリートで、ふさいである。\nsaku.n: 札に、「閉塞済　2026.11.04」。……ふさいだのは、3日前だ。\n## f26_cave_closed\nakari.n: 穴の中は、まだです。鑑識が終わるまで、入らないでください。\n## f26_cave_open\nsaku.k: 雨穴。……子どものころから、入るなと言われてきた。\n## p26_pc\nsaku.n: 署の端末。気象の記録を、呼び出す。\n@get e_weather\n## p26_pc_dna\nsaku.k: 鑑定所から、結果が届いている。\n@get e_dna\nsaku.u: ……何だ、これは。\n## p26_archive\nsaku.n: 書庫。古い事件の箱。……親父の手帳が、まだ残っている。\nsaku.d: 三雲巌。7年前に、死んだ。この署の、巡査部長だった。\n@get e_note\n## p26_board\nsaku.n: 掲示板。町の行方不明者の紙。いちばん新しいのは、汐見蓮。27歳。\n## p26_desk\nsaku.n: 自分の机。……引き出しに、親父の古い警笛。お守りがわりだ。\n## osamu26_first\nosamu71.a: 刑事さん。息子は、どこだ。きのうの夜から、帰らない。\nsaku.n: 汐見先生。蓮さんの事を、聞かせてください。\nosamu71.d: ……朽木の主人が、死んだと聞いた。息子は、あの男に、よく会っていた。\n## osamu26_quarrel\nosamu71.k: 5日の夜、私は朽木に、どなりこんだ。「息子を、あの穴へ行かせるな」と。\nsaku.u: 穴。雨穴の事を、ご存じなんですか。\nosamu71.d: ……33年前、あの穴の前で、あの男を診たのは、私だ。記憶のない、火傷の青年をな。\nosamu71.t: あの男は、年を取るほど、息子に似てきた。……気味が悪くて、私は、あの男が嫌いだった。\n## osamu26_tooth\nosamu71.n: 歯ブラシ？　……持っていけ。それで息子が見つかるなら。\n@flag tooth\nsaku.n: 汐見先生の分も、いただけますか。念のためです。\nosamu71.t: 私の？　……好きにしろ。\n## osamu26_plate\nosamu71.n: 鷹取の当主の足か。5年前、私が県の病院へ回した。大腿骨の骨折だ。\nosamu71.n: くわしい紙は、本人が持っている。医者は、人に見せられん。\n## sayo26_first\nsayo58.d: ……三雲さん。来てくださったの。\nsaku.d: 小夜さん。お悔やみを、申し上げます。\nsayo58.c: あの人は、33年前、雨の夜に、ふらりと来た人です。だから、雨の夜に、ふらりと行ってしまった。\n## sayo26_night\nsayo58.n: きのうは、20時半に出ました。「見送りがある。すぐ戻る」と。\nsayo58.t: 蓮くんが、車で迎えに来ていました。2人で、出ていきました。\n## sayo26_absent\nsayo58.n: おかしな事なら、あります。あの人、4日と5日、宿を空けたんです。33年で、初めてでした。\nsayo58.t: 帰ってきた時、石炭の煙のにおいがしました。見た事のない、古い作業着を着て。\nsayo58.n: それに、金庫の中の物を、全部持って出たんです。帰ってきた時は、手ぶらでした。\n@fact f_absent\n## sayo26_past\nsayo58.n: あの人の昔は、誰も知りません。記憶がない、と言っていました。\nsayo58.s: でも、この町の事は、何でも知っていたんですよ。まだ建っていない家の事まで。\n## sayo26_ledger\nsayo58.n: 宿帳ですか。祖母のハルの代からの物が、棚にあります。\nsayo58.n: 祖母は言っていました。「昭和35年に、三雲という人が、箱を取りに来た」と。……三雲さんのおじいさんの事でしょうか。\n@flag ledger_ok\n## i26_ledger\nsaku.n: 古い宿帳。昭和35年の、11月の所。\n@get e_ledger\n## i26_ledger_ng\nsaku.n: 棚に、古い宿帳が並んでいる。勝手に開くわけには、いかない。\n## i26_safe\nsaku.n: 宿の金庫。開いている。中は、空だ。……ほこりの跡が、四角く残っている。箱が、1つあった。\n## i26_front\nsaku.n: 帳場。鍵の板。……匡さんは、ここに33年、すわっていた。\n## i26_hearth\nsaku.n: 居間。テレビが、廃炉のニュースを流している。「霧渕原発、12日に排水坑の閉塞を完了」。\n## i26_luggage\nsaku.n: 客室。きれいに片づいている。\n## pl26_guard\nsaku.n: 守衛所。入退構の記録を、見せてもらう。\n@get e_entry\n## pl26_board\nsaku.n: 掲示板。「廃止措置　工程表」。11月12日、第2排水坑の閉塞、完了。\n## rei26_first\nrei.n: 霧渕署の、三雲さん。所長の鷹取です。\nrei.k: 朽木屋のご主人の事は、聞きました。お気の毒です。ですが、当所には、関係のない事です。\n## rei26_ren\nrei.n: 汐見ですか。出張中です。6日の夜から。\nrei.k: 行き先は、申し上げられません。社の決まりです。\n## rei26_father\nrei.n: 父ですか。父は、6日の夜は、ずっと屋敷にいました。\nrei.n: 21時45分から22時半まで、廃炉委員会の、画面の会議に出ています。私も、出ていました。\n@fact f_call\n## rei26_after\nrei.d: ……分かりました。出張は、私が書かせた物です。\nrei.t: 汐見は、ふさぐ前の第2排水坑を、調べていました。私は、やめろと言った。……父に、そう言われたからです。\nrei.n: これが、汐見の報告です。私は、まだ、父には見せていません。\n@get e_survey\nrei.k: ですが、父は人を殺しません。6日の夜は、屋敷にいた。それだけは、確かです。\n@flag b1\n## after_b1\nakari.u: 三雲さん！　鑑定の結果が、署に届きました。……見てください。私には、意味が分かりません。\nakari.n: それと、穴の中の鑑識が、終わりました。入れます。\n@flag cave_open\n## m26_first\nseiji76.n: ……霧渕署の、三雲くんか。\nsaku.n: 鷹取さん。朽木匡さんの事で、うかがいました。\nseiji76.s: やはり、君だったか。\nsaku.t: ……何が、ですか。\nseiji76.c: いや。年寄りの、ひとり言だ。33年、待った甲斐があった。\n@flag met_seiji\n## seiji26_night\nseiji76.n: 6日の夜か。屋敷にいたよ。21時45分から、廃炉の会議だ。画面の向こうに、20人いた。\nseiji76.k: 朽木が死んだのは、22時すぎだと聞いた。その時、私は、20人に見られていた。\n## seiji26_watch\nseiji76.n: この時計か。古いだろう。10歳の時に、もらった物だ。\nseiji76.n: 雨穴から、けがをした旅の老人が出てきてな。死ぬ前に、私にくれた。「これは、お前のだ」と言って。\nseiji76.s: 66年、1度も止まらん。いい時計だ。\n@fact f_watchgift\n## seiji26_cane\nseiji76.n: 杖？　これは、新しい物だ。前のは、なくした。年を取ると、物をなくす。\n## seiji26_tadashi\nseiji76.n: 朽木か。古い知り合いだ。33年前、あの宿に流れついた、記憶のない男。\nseiji76.k: 記憶がない、か。……あの男は、私より、私の事を知っていたよ。\n## m26_photo\nsaku.n: 額の写真。先月の、廃炉の式典。当主が、杖をついて立っている。\nsaku.k: 杖の頭は、真鍮の鷹。くちばしが、鉤のように曲がっている。\n@fact f_hawk\n## m26_cane\nsaku.n: 傘立て。杖が1本。飾りのない、新しい杖だ。……壁の金具は、2つ。1つは、空いている。\n## m26_desk\nsaku.n: 机の上に、病院の紙。手術の説明書の、控えだ。\n@get e_op\n## m26_monitor_ng\nsaku.n: 門の録画の機械。当主の許しがないと、見られない。\n## m26_monitor\nsaku.k: 所長の許しは、取った。6日の夜の録画を、出す。\n@get e_gate\n## m26_empty\nsaku.k: ……当主が、いない。机の上に、紙が1枚。「森へ行く」。\n## c_carve\nsaku.n: 岩に、古い字が刻んである。「昭和三十五年　鷹取組」。その下に、線が3本。\n## c_lamp\nsaku.n: 古い吊りランプ。……油が、入っている。誰かが、いまも火を入れている。\n## c26_pool\nsaku.u: 水たまりの底に、何か光る。……杖だ。\nsaku.k: 真鍮の、鷹の頭。くちばしに、黒いしみ。\n@fact f_canefound\n## c_pool\nsaku.n: 水たまり。天井から、しずくが落ちている。\n## c_fork\nsaku.n: 道が、2つに分かれている。岩に、字。左は「下」。右は「上」。\n## c26_right\nsaku.n: 右の道は、岩でふさがっている。新しい岩じゃない。……この先は、もとから無いんだ。\n## c60_left\nsaku.n: 左の道は、行き止まりだ。岩はだが、新しい。……ここより昔は、無い。\n## c_left_ng\nsaku.n: 左の道の奥から、風が来る。……だが、まだ、ここでやる事が残っている。\n## c_first_left\nsaku.k: 蓮は、ここを通った。なら、俺も行く。\n@card 道は、下っていた。雨の音が、遠くなり、また近くなった。\n## arrive93\n@card 外に出ると、森の木が、少し低かった。\nsaku.u: ……看板が、ちがう。「霧渕町」。\nsaku.t: 町が市になったのは、20年前だ。……まさか。\n## arrive60\n@card 外に出ると、しめ縄があった。空気に、石炭の煙がまじっていた。\nsaku.k: ……昭和35年。発電所が、まだ無い。\n## arrive26\n@card 外に出ると、黄色いテープが、雨に鳴っていた。\nsaku.n: ……帰ってきた。2026年だ。\n## iwao93_first\niwao.k: おい。そこの人。立入禁止の字が、読めんのか。\nsaku.u: ……親父。\niwao.t: 親父？　おれは35だ。あんたより、若いぞ。\nsaku.t: ……失礼。三雲、巌さんですね。私は、サクといいます。県の、刑事です。\niwao.n: 県警か。身分証を。……何だ、この紙。「令和8年交付」？　元号がちがう。にせ物か。\nsaku.t: ……新しい書式です。まだ、こっちには、回っていないかと。\niwao.s: まあ、いい。目は、刑事の目だ。2日前にも、ここで人を拾った。記憶のない若いのをな。あんたも、その口かと思った。\niwao.n: パトカーを使え。おれは助手席で、手帳を書く。きょうは、平成5年の、11月8日だ。\n@flag met_iwao\n## iwao93_file\niwao.n: 妙な事件なら、1つある。先月の28日、発電所の拡張工事で、白骨が出た。\niwao.n: おれの親父、喜一の日誌に、同じ場所に葬った無縁仏の事が書いてあった。33年前の物だ。\niwao.t: ところが、その骨の足に、見た事もない金属の板が、付いていてな。\n@get e_file\n## iwao93_ren\niwao.n: 記憶のない若いのか。6日の夜、雨穴の前に倒れていた。朽木屋に、あずけてある。\niwao.n: 名前も言えん。小夜ちゃんが、「匡」と呼んでいる。帳場にあった、古い札の字だそうだ。\n## iwao93_son\niwao.s: 倅？　いるぞ。5つだ。朔という。おれに似て、言う事を聞かん。\nsaku.c: ……そうですか。\niwao.n: あんたと、同じ名前だな。サクさん。\n## iwao93_after\niwao.d: 署長に言われた。「排水坑の件は、調べるな」。……鷹取の副所長から、電話があったそうだ。\niwao.k: だが、おれは見た。あの若いのが、うちの倅を、抱えて出てきたのを。腕を、焼いてな。\niwao.n: サクさん。あんたの左の眉の傷。きょう、倅が縫った所と、同じだ。……あんた、いったい、誰だ。\nsaku.c: ……いつか、分かります。巌さん。体を、大事にしてください。\niwao.s: 妙な刑事だ。……手帳に、書いておく。\n@flag iwao_bye\n## p93_archive\nsaku.n: 書庫。……親父の机の上に、喜一じいさんの日誌が出ている。\n## p93_board\nsaku.n: 掲示板。「霧渕原発　2号機　増設工事」。完成は、平成8年。\n## p93_desk\nsaku.n: 親父の机。書きかけの手帳。……インクが、まだ乾いていない。\n## sayo93_first\nsayo25.s: いらっしゃいませ。朽木屋です。……刑事さん？　巌さんの、お知り合いですか。\nsayo25.n: 匡さんなら、奥にいます。きのうから、薪割りを手伝ってくれて。\n## sayo93_stay\nsayo25.n: お泊まりですね。お部屋を、用意します。夕ごはんは、きのこ汁です。\n@card 雨の音を聞きながら、眠った。\n@day 1993-11-09\n@card 平成5年11月9日（火）\nsaku.n: ……朝だ。きょうは、9日。\n@flag day9\n## sayo93_luggage\nsayo25.n: 匡さんの荷物ですか。お部屋に、置いてあります。変わった物ばかりで。\n@flag luggage_ok\n## i93_luggage\nsaku.n: 青年の荷物。上着と、財布と、黒い板。\n@get e_belong\n## i93_luggage_ng\nsaku.n: 客の荷物だ。宿の人に、ことわってからにしよう。\n## i93_ledger\nsaku.n: 宿帳の棚。昭和の物まで、並んでいる。\n## i93_front\nsaku.n: 帳場。ピンクの電話。古い木の札に、「匡」の1字。……これが、名前のもとか。\n## i93_hearth\nsaku.n: 居間。テレビが、ブラウン管だ。\n## i93_safe\nsaku.n: 宿の金庫。閉まっている。\n## ren93_meet\nren.u: ……三雲さん！？\nsaku.k: 汐見蓮。……やはり、ここにいたか。\nren.t: どうして。……いや、そうか。あの穴を、通ったんですね。\nren.d: 記憶がない、と言いました。ほかに、言いようが、なくて。まだ生まれていない人間が、何を名乗れば、いいんですか。\n## ren93_why\nren.k: 僕は、第2排水坑を調べていました。平成5年11月9日の、運転日誌だけが、抜けている。\nren.n: 朽木の匡さんが、教えてくれたんです。「雨穴を左へ行けば、その日に行ける」と。\nren.t: あした、9日です。排水坑で何が起きるか、見たら、すぐ帰ります。穴が開いているのは、11日までだそうですから。\nsaku.d: ……そうか。\n## ren93_arm\nren.s: 薪割りですか。小夜さんに、頼まれて。腕まくりして、やっています。\nsaku.n: ……腕を、見せてくれ。\nren.t: 腕？　何も、ありませんよ。きれいな物です。\n@fact f_noscar\n## ren93_home\nren.d: 三雲さん。2026年で、父は、どうしていますか。……心配していますよね。\nsaku.c: ……ああ。探している。\nren.s: 帰ったら、あやまります。それから、匡さんに、お礼を。\n## ren93_after\nren.d: ……三雲さん。腕が、動きません。汐見先生に言われました。3日は、寝ていろと。\nren.t: 汐見先生。……父です。38歳の。僕の腕に、薬をぬりながら、「君は、うちの家系の顔だ」と笑うんです。\nren.u: 3日。……11日が、すぎる。穴が、閉じる。\nsaku.d: ……蓮。\nren.c: 三雲さん。分かりました。匡さんが、誰なのか。……この腕の傷。匡さんの腕に、同じ物が、ありました。\nren.k: 記録の原本は、僕が持ちます。33年、持っています。出すのは、僕が穴に入った、あとだ。そうでないと、僕は、ここに来られない。\nren.n: 三雲さんは、この先、昭和35年へ行くんでしょう。……顔に、そう書いてあります。\n@flag ren_knows\n## osamu93_first\nosamu38.n: 汐見です。……県警の方？　きょうは、けが人もなくて、ひまですよ。\n## osamu93_after\nosamu38.k: 刑事さん。発電所は、「宿のボイラーの火傷」と書けと言う。だが、私は、見たままを書く。\nosamu38.n: あの青年は、焼けた丸い鉄に、腕を押しつけている。子どもの方は、眉を3針。……巌さんの、倅だ。\n@get e_chart\nosamu38.t: ふしぎな青年だ。歯の詰め物が、見た事のない材料でね。……それに、どこか、うちの家系の顔をしている。\n## pl93_guard\nsaku.n: 守衛所。「関係者以外　立入禁止」。\n## pl93_board\nsaku.n: 掲示板。「無事故　2190日」。\n## seiji93_first\nseiji43.n: 副所長の鷹取です。県警の方が、何のご用で。\nseiji43.k: 見学なら、広報を通してください。私は、忙しい。\n## seiji93_after\nseiji43.d: ……分かった。君の勝ちだ。だが、紙は、もう無い。きょうの夕方、焼いた。\nsaku.k: 原本は、こちらにあります。\nseiji43.u: ……何。\nseiji43.k: 三雲、と言ったな。巡査部長の親類か。……覚えておく。この顔を、私は忘れん。\nseiji43.n: 1つ、聞かせてくれ。君は、なぜ、きょうの事を、きのうから知っていた。\nsaku.c: ……。\n@flag b2\n## seiji93_watch\nsaku.n: 副所長の左手に、古い腕時計。……2026年の当主と、同じ物だ。\n@fact f_watch93\n## f93_tunnel_ng\nsaku.n: 排水坑の口。鉄格子が、こわれている。……中で、人の声がする。きょうは、入れない。\n## f93_tunnel\nsaku.k: 排水坑。蓮の言った日は、きょうだ。……入る。\n## f93_vend\nsaku.n: 自動販売機。缶コーヒーが、110円。\n## f93_cave\nsaku.n: 雨穴。看板に、「立入禁止　霧渕町」。\n## t93_office\nsaku.n: 見張りの小屋。運転日誌が、開いてある。11月9日。まだ、何も書いていない。\n## t93_rack\nsaku.n: フィルムバッジの棚。作業員が、胸につける物だ。\n## t93_accident\n@sfx steam\n@card 15時20分。頭の上で、鉄が鳴った。\nsaku.u: 配管が……！\nkid.u: おとうさん！　おとうさん、どこ！\nsaku.u: 子どもの声。……なぜ、こんな所に。\nkid.d: おとうさんに、にた人が、入っていったから……。\nsaku.c: ……俺を、追ってきたのか。\n@sfx steam\nren.a: あぶない！　そこを、どけ！\n@card 蓮が、子どもを抱えこんだ。背中に、湯気がかかった。\nren.a: 三雲さん、その子を！　僕が、バルブを閉めます！\n@card 蓮は、赤く焼けた丸いハンドルに、左の腕をかけて、回した。\nren.u: ぐっ……！\n@sfx thud\n@card 15時41分。湯気が、止まった。\nkid.d: ……いたい。おでこが、いたい。\nsaku.d: 眉を、切っている。……そうか。この傷は、きょうの物だったのか。\n@fact f_leak\n@fact f_burn\n@fact f_brow\n@flag accident\n## t93_office_after\nsaku.k: 日誌に、誰かが書き足している。それから、破り取った跡。……破った紙は、ごみ箱だ。\n@get e_valve\n## t93_rack_after\nsaku.k: フィルムバッジが、3つ、赤い。……机の上に、副所長の字の紙。\n@fact f_badge\n@fact f_memo\n## t93_valve\nsaku.n: 赤い、丸いハンドル。\n## t93_valve_after\nsaku.d: ハンドルの縁に、焼けた布がついている。……蓮の、そでだ。\n## kiichi60_first\nkiichi.k: 待て。見ない顔だな。鷹取組の者か。\nsaku.t: ……いえ。旅の者です。三雲、といいます。\nkiichi.u: 三雲？　うちと同じ姓だ。親類に、こんな男は、おらんが。\nkiichi.n: 駐在の、三雲喜一だ。この町は、いま、よそ者だらけでな。発電所の工事で、人が千人、入った。\n## kiichi60_diary\nkiichi.n: 日誌か。見せても、かまわん。きょうは、昭和35年の11月10日。書く事は、けんかと、酔っぱらいだけだ。\nsaku.n: ……雨穴から人が出てきた、という記事は。\nkiichi.t: 雨穴？　あんな所から、人は出てこん。そんな記事は、1つもないぞ。\n@fact f_noentry\n## kiichi60_son\nkiichi.s: 倅が、1人いる。巌。まだ2つだ。大きくなったら、巡査にする。\nsaku.s: ……なりますよ。いい巡査に。\n## kiichi60_guest\nkiichi.n: 5日前の、宿の客か。60ほどの男だ。ひと晩泊まって、あくる朝、森へ入って、それきりだ。\nkiichi.n: ハルさんに、箱を1つ、あずけていった。「三雲という男が、取りに来る」と言ってな。……おれの事かと思ったが、ちがうらしい。\n## p60_archive\nsaku.n: 日誌と台帳の棚。じいさんの字は、親父の字に、よく似ている。\n## p60_board\nsaku.n: 黒板。「火の用心」「流言に注意」。\n## p60_desk\nsaku.n: 駐在の机。手回しの電話。\n## haru60_first\nharu.n: いらっしゃいまし。朽木屋の、ハルでございます。\nharu.k: ……三雲さま、とおっしゃいましたか。お待ちして、おりました。\nharu.n: 5日前のお客さまから、箱をあずかっております。ただし、お渡しする前に、3つ、うかがうように、と。\n## haru60_after\nharu.s: ……たしかに。あの方の、おっしゃったとおりの方でした。\nharu.n: 箱は、こちらです。それから、宿帳に、お名前を。あの方が、「かならず書かせてくれ」と。\n@get e_box\nsaku.n: ……宿帳に、名前を書く。三雲朔。38。\nsaku.c: この字を、俺は、66年あとの棚で、もう見ている。\n@fact f_signed\n@flag b3\n## haru60_guest\nharu.n: あのお客さまですか。60ほどの、静かな方でした。雨でぬれておいででしたので、鷹取組の新しい作業着を、お貸ししました。\nharu.s: うちの宿を、なつかしそうに見ておいででした。初めてのはずですのに。帳場の木の札を、長いこと、なでておられました。「匡」と書いた、あの札を。\n## i60_ledger\nsaku.n: 宿帳。きょうの日付まで、書いてある。\n@get e_ledger60\n## i60_front\nsaku.n: 帳場。木の札に、「匡」の1字。……亡くなったご主人の名だと、ハルさんが言った。\n## i60_hearth\nsaku.n: いろり。ラジオが、発電所の起工式のニュースを流している。\n## i60_luggage\nsaku.n: 客室。畳が、新しい。\n## i60_safe\nsaku.n: 宿の金庫。ハルさんが、鍵を帯にさげている。\n## tae60_first\ntae.n: 産婆の、汐見多恵です。きょうは、お産が1つ。いまは、ひと休み。\n## tae60_scar\ntae.n: 5日前のお客？　ええ、診ました。ぬれた腕を、ふいてあげたんです。\ntae.t: 左の腕に、古い火傷がありました。三日月の形。丸い、焼けた鉄を、押しつけたような。\ntae.n: 「いつの傷です」と聞いたら、笑って言うんです。「33年あとの傷です」って。……変な人。\n@fact f_scar60\n## tae60_family\ntae.s: 子ども？　まだですよ。いつか、男の子がほしいわ。お医者にするの。\n## soichiro60_first\nsoichiro.n: 鷹取組の、鷹取宗一郎だ。見物なら、足もとに気をつけな。\nsoichiro.s: 6年たてば、ここに、原子の火がともる。この町は、変わるぞ。\n## soichiro60_blast\nsoichiro.n: 試掘坑か。11月3日に、発破をかけた。そうしたら、岩の向こうが、空だった。雨穴に、抜けちまったんだ。\nsoichiro.t: あの日から、穴が鳴る。風もないのに、低い音でな。人夫が、こわがって、困る。\n@fact f_blast\n## soichiro60_ledger\nsoichiro.n: 支給品の台帳？　そこの天幕だ。作業着は、1着ずつ、番号で貸している。\n@flag supply_ok\n## pl60_tent\nsaku.n: 天幕の下の机。支給品の台帳。\n@get e_supply\n## pl60_tent_ng\nsaku.n: 天幕の下に、台帳がある。組の物だ。ことわってからにしよう。\n## pl60_hut\nsaku.n: 飯場。夕めしの、においがする。\n## pl60_crane\nsaku.n: やぐらの足もと。ドラム缶に、石炭がらが山になっている。……靴の底に、つく。\n## boy60_first\nseiji10.n: おじさん、だれ？　よその人？\nsaku.n: ……鷹取、征二くんか。\nseiji10.u: なんで、名前を知ってるの。\n## boy60_watch\nsaku.n: 征二くん。腕時計は、持っているか。\nseiji10.t: うでどけい？　持ってないよ。とうちゃんは、「大きくなったら」って言う。\nseiji10.s: でも、ほしいなあ。ねじを巻くやつ。\n@fact f_nowatch\n## boy60_dream\nseiji10.s: ぼく、大きくなったら、とうちゃんの発電所で、いちばんえらくなるんだ。\n## f60_car\nsaku.n: 登山口に、オート三輪。鍵が、ささったままだ。荷台に、「朽木屋」の字。……借りよう。\n## f60_tunnel\nsaku.n: 鷹取組の、試掘坑。奥で、ランプがゆれている。\n## f60_cave\nsaku.n: 雨穴。しめ縄が、新しい。\n## t60_breach\nsaku.k: 岩が、くずれている。向こうは、雨穴だ。……11月3日の発破で、ここが、つながった。\n## t60_cart\nsaku.n: トロッコと、さく岩機。\n## back26\nakari.u: 三雲さん！　4日も、どこにいたんですか。電話も、通じなくて。\nsaku.n: ……遠くだ。灯、あとで全部話す。\nakari.k: 鷹取の当主が、けさから、屋敷にいません。所長が、三雲さんを探しています。\n@flag p4\n## rei26_p4\nrei.d: 三雲さん。……その箱は。\nsaku.k: 平成5年11月9日の、原本です。あなたのお父さんの、署名がある。\nrei.c: ……8歳でした。あの夜、父が、庭で紙を焼いていたのを、覚えています。\nrei.k: 門の録画を、見てください。私が、許します。それから、これは、6日の会議の記録です。\n@get e_meet\n@flag gate_ok\n## final_intro\n@card 2026年11月11日（水）　夜　雨穴の前\nseiji76.n: ……来たか。三雲くん。\nsaku.k: 鷹取征二。朽木匡を殺したのは、あなただ。\nseiji76.s: 33年前、君は、同じ目で、私を見た。あの時、私は、紙を焼くのが、ひと晩遅れた。\nseiji76.k: 聞こう。こんどは、何を持ってきた。\n## end_true\nseiji76.c: ……そうか。あれは、私か。\nseiji76.n: 10歳の時、私は、あの老人の手を、にぎった。冷たい手だった。「これは、お前のだ」と言った声を、66年、忘れた事がない。\nseiji76.s: 自分の手だったとはな。\nsaku.k: 鷹取さん。行かなければ、いい。ここで、手錠を受ければ、あなたは、あそこで死なない。\nseiji76.k: いいや。骨は、もう出ている。君の父親が、33年前に、掘り出した。\nseiji76.n: 起きた事は、起きる。朽木は、それを、よく知っていた。だから、自分の死ぬ日にも、あの若いのを、見送った。\nseiji76.c: ……朽木を殴った時、あの男は、笑ったよ。「やっぱり、あなたでしたか」と。\n@sfx rumble\n@card 老人は、杖もなしに、穴へ入っていった。左の道を。\nakari.u: 三雲さん、追わないんですか！\nsaku.c: ……追っても、同じだ。あの人は、66年前に、もう死んでいる。\n@card 穴の奥で、岩の落ちる音がした。それきり、風が止んだ。\n## end_normal\nseiji76.n: ……そこまでだ、三雲くん。\nseiji76.k: 私は行く。下りの道を、2度。昭和35年へ。そこで、やり直す。\n@sfx rumble\n@card 老人は、穴へ入っていった。\nakari.u: 三雲さん！\nsaku.d: ……行かせてしまった。あの人が、どこへ行き、どうなるのか。俺は、まだ、分かっていない。\n@card 穴の奥で、岩の落ちる音がした。\n## epilogue\n@card 2026年11月12日（木）　朝\nakari.n: 三雲さん。排水坑の閉塞が、終わりました。穴は、もう、鳴りません。\nakari.d: ……父は、蓮くんだったんですね。私は、自分の父親を、「蓮くん」と呼んで、からかっていた。\nsaku.n: 匡さんは、知っていた。33年、ずっと。\nakari.c: 汐見先生に、話してきます。先生は、33年、自分の息子を、嫌っていた事になる。……ゆるしてくれるでしょうか。\nsaku.n: 箱の底に、もう1通、手紙があった。灯。君あてだ。\ntadashi60.s: 灯。お前が生まれた日、父さんは、世界でいちばん若い父親だった。まだ、生まれてもいなかったんだから。\ntadashi60.n: 父さんは、帰れなかったんじゃない。ここが、帰る所になったんだ。\ntadashi60.c: 雨の日は、足もとに、気をつけて。\nakari.d: ……。\n@card 雨は、33年ぶりに、やんだ。\n## end_bad\n@card 論は、とどかなかった。\nseiji76.n: 出直したまえ、三雲くん。私は、ここで待っている。11日の夜が、終わるまではな。\n## x_break\nsaku.t: ……だめだ。筋が、通っていない。頭を冷やして、出直そう。\n## x_noev\nsaku.t: 言葉だけでは、足りない。裏づける物を、添えないと。\n## b1_intro\nrei.k: 何度いらしても、同じです。当所は、関係がありません。\nsaku.k: 所長。うかがいたい事が、3つあります。\n## b1_s1\nrei.n: 汐見は、出張中です。6日の夜から。\n## b1_o1\nsaku.k: 汐見蓮の車は、6日の夜から、登山口にあります。社員証も、中に。\nsaku.k: それに、「出張」の記録は、7日の朝に、書き足された物だ。\nrei.t: ……。\n## b1_s2\nrei.k: 亡くなった朽木さんは、当所とは、関係のない方です。\n## b1_o2\nsaku.k: 遺体は、鷹取組の作業着を着ていました。タグは、昭和35年度の支給。発電所を建てた、あなたの家の組だ。\nrei.u: 昭和35年……？　66年前の物を、なぜ。\n## b1_s3\nrei.k: 汐見と朽木さんに、接点は、ありません。\n## b1_o3\nsaku.k: 6日の20時48分。汐見の車のドライブレコーダーに、2人の後ろ姿が映っています。汐見と、朽木さん。森へ、歩いていく。\nrei.d: ……。\n## b1_m0\nrei.n: それは、当所の記録と、合いません。\n## b1_m1\nrei.k: 刑事さん。思いつきで、ものを言わないでください。\n## b2_intro\nseiji43.k: また、君か。きょうは、事故の対応で……いや。点検で、忙しい。\nsaku.k: いま、「事故」と言いましたね。副所長。\n## b2_s1\nseiji43.n: 言いまちがいだ。事故など、起きていない。\n## b2_o1\nsaku.k: 15時20分。第2排水坑で、配管が破れた。バルブの記録に、そう書いてあります。破って捨てた、紙の方に。\nseiji43.t: ……。\n## b2_s2\nseiji43.k: 朽木屋の青年の火傷なら、宿のボイラーだ。医者にも、そう伝えた。\n## b2_o2\nsaku.k: 火傷は、三日月の形です。排水坑の、丸いバルブのハンドルと、同じ形。あの青年が、手で閉めた。15時41分に。\nseiji43.u: ……見ていたのか。\n## b2_s3\nseiji43.n: 仮に、何かあったとしても、記録は、どこにも無い。\n## b2_o3\nsaku.k: フィルムバッジが、3つ。基準を、こえています。それから、あなたの字の指示。「報告不要。記録は破棄」。\nseiji43.d: ……。\n## b2_m0\nseiji43.n: 話にならん。帰りたまえ。\n## b2_m1\nseiji43.k: 県警に、抗議の電話を入れるぞ。\n## b3_intro\nharu.n: では、うかがいます。まちがえましたら、箱は、お渡しできません。\n## b3_s1\nharu.n: 1つめ。あのお客さまの、まことの名は。\n## b3_o1\nharu.s: ……はい。宿帳にも、そう、お書きでした。\n## b3_s2\nharu.n: 2つめ。あの方の腕の火傷は、いつ、誰をかばって、できた物ですか。\n## b3_o2\nharu.s: ……はい。「33年あと、小さな三雲さんをかばった」と、おっしゃいました。年の数え方が、わたくしには、分かりませんでしたが。\n## b3_s3\nharu.n: 3つめ。あの方がお生まれになったのは、何年ですか。\n## b3_o3\nharu.u: ……まだ、39年も先。それなのに、あの方は、60でいらした。\nharu.c: 世の中には、わたくしどもの分からない事が、あるのですね。\n## b3_m0\nharu.n: ……ちがうようでございます。\n## b3_m1\nharu.k: あの方は、「分かる人が、来る」と、おっしゃいました。\n## bf_s1\nseiji76.n: 朽木が死んだのは、22時17分だ。時計が、そう言っている。その時、私は、会議の画面の中にいた。\n## bf_o1\nsaku.k: 遺体の下の土は、乾いていました。雨の降り始めは、21時40分。\nsaku.k: 朽木さんは、雨が降る前に、倒れている。22時17分じゃ、ない。\nseiji76.n: ……ほう。\n## bf_s2\nseiji76.k: だが、時計は、22時17分で止まっている。止まった時計は、嘘をつかんよ。\n## bf_o2\nsaku.k: 時計のりゅうずが、引き出されたままです。針を合わせる位置だ。\nsaku.k: 誰かが、針を22時17分まで進めてから、ガラスを割った。……時計は、嘘をつかされた。\nseiji76.c: ……。\n## bf_s3\nseiji76.n: では、私は、いつ屋敷を出た。出ていないのだよ。\n## bf_o3\nsaku.k: 門の録画です。6日の20時52分、あなたの車が出て、21時38分に戻っている。会議の、7分前だ。\nseiji76.t: ……玲が、見せたか。\n## bf_s4\nseiji76.k: 車が出たから、何だ。凶器は。私が、あそこに立った跡は。\n## bf_o4\nsaku.k: 遺体のそばに、杖の跡。径22ミリ。そして、こめかみの傷は、鉤の形です。\nsaku.k: あなたの杖の頭は、真鍮の鷹だ。くちばしが、同じ形に曲がっている。\nseiji76.d: ……。\n## bf_s5\nseiji76.n: 動機がない。なぜ私が、あの宿の主人を。\n## bf_o5\nsaku.k: 平成5年11月9日。第2排水坑の事故を、あなたは隠した。その原本を、朽木さんは、33年、持っていた。\nsaku.k: 7日に、出すつもりだった。あなたは、それを止めに行った。\nseiji76.c: ……あの紙は、どこにも無かった。宿も、金庫も、探させたのに。\nsaku.n: 66年前に、隠してあったんです。\n## bf_s6\nseiji76.k: ……あの男は、何者だ。君は、知っているのか。\n## bf_o6\nsaku.k: 朽木匡は、汐見蓮です。6日の夜、この穴から33年前へ行き、帰れずに、33年を生きた。\nsaku.d: あなたが殴ったのは、ついさっき見送った若者の、33年あとの姿だ。\nseiji76.u: ……同じ顔だとは、思っていた。\n## bf_s7\nseiji76.n: 私は行く。下りの道を、2度。昭和35年へ。発破の前の日へ戻って、父を止める。穴が開かなければ、何も起きん。\n## bf_o7\nsaku.k: 行っても、発破の日には、着きません。着くのは、昭和35年の11月11日。きょうと、同じ日です。\nsaku.k: その日、雨穴から老人が出て、落盤で死ぬ。足の骨に、金属の板。番号は、KT-2021-0387。……あなたの足の板と、同じ番号だ。\nsaku.d: 1960年の無縁仏は、あなた自身です。10歳のあなたに、時計を渡したのも。\n## bf_m0\nseiji76.n: それでは、私は、たおれんよ。\n## bf_m1\nseiji76.k: 33年前の君は、もう少し、切れたがな。\n## x_many\nsaku.t: ……言葉が多すぎる。これでは、何を言いたいのか、伝わらない。要る事だけを、言おう。\n## st60_clinic\nsaku.n: 汐見産院。戸に、札がさがっている。「朽木屋に出ています　多恵」。\n## cl_shelf\nsaku.n: カルテの棚。医者の物だ。勝手には、見られない。\n## cl_light\nsaku.n: レントゲンの写真。誰かの、足の骨だ。\n\n# 三十三年目の雨　台本その2（長編への拡張）\n# 表情の追加： p あせる（汗）　o 衝撃　g 決意\n## p26_desk\nsaku.n: 自分の机。引き出しに、親父の古い警笛。それから、写真が1枚。\nsaku.d: 5つの時の、俺と、弟の望。双子だ。……弟は、33年前の11月9日に、いなくなった。\nsaku.c: 親父は、死ぬまで探していた。\n@fact f_nozomu\n## p26_pc_dna2\nsaku.k: 鑑定所から、追加の結果。……俺の試料を、対照に使ったらしい。\n@get e_dna2\nsaku.o: ……何だと。\n## cl26_notice\nsaku.n: 医院の戸に、古い札。「8日・9日　休診」。……俺が、いなかった間だ。\n@fact f_closed\n## rei26_toki\nrei.n: 私を育てたのは、ばあやのトキです。母は、私を産んで、すぐ亡くなりましたから。\nrei.d: トキは、私が8つの冬に死にました。平成5年の、12月です。\nrei.s: ふしぎな人でした。私が言う前に、私の欲しい物が分かるんです。まるで、自分の事みたいに。\n@fact f_rei_nanny\n## rei26_pin\nsaku.n: 所長。その襟の章は。\nrei.n: 所長章です。おととし、所長になった時に、もらいました。裏に、年と名前が彫ってあります。「2024　鷹取玲」。\nrei.k: 同じ物は、世界に1つしかありません。\n@fact f_rei_pin\n## g26_toki\nsaku.n: 鷹取の家の墓のとなりに、小さな石。「トキ　平成五年十二月三日没　享年七十四」。\nsaku.k: 横に、もう1行。「生年、生地、不詳。昭和三十五年十一月より、鷹取家に仕う」。\n@fact f_toki_grave\n## g26_muen\nsaku.n: 森の側のすみに、古い石。「無縁　昭和三十五年十一月十二日」。その下に、新しい字。「平成五年、警察により改葬」。\n## g26_iwao\nsaku.d: 親父の墓。三雲巌。令和元年。\nsaku.n: となりに、小さな石がある。「三雲 望　平成五年十一月九日　行方知れず」。……骨は、入っていない。\n@fact f_nozomu_stone\n## g26_tae\nsaku.n: 汐見多恵の墓。「昭和五年生　平成十年没」。……花が、新しい。汐見先生が、毎月来ている。\n## g93_muen\nsaku.n: 掘り返した穴。板で囲ってある。先月の28日、ここから白骨が出た。\n## g93_toki\nsaku.n: 鷹取の家の墓。花が、きちんと替えてある。\n## g93_iwao\nsaku.n: 三雲の家の墓。喜一じいさんの名が、彫ってある。昭和の終わりに、死んだ。\n## g60_muen\nsaku.n: 森の側の、空き地。まだ、何もない。\nsaku.c: ……あさっての朝、ここに、1人の老人が葬られる。\n## g60_toki\nsaku.n: 鷹取の家の墓。新しい石が、1つ。征二の母だ。征二を産んだ年に、死んでいる。\n## g60_iwao\nsaku.n: 三雲の家の墓。古い石ばかりだ。\n## g_gate\nsaku.n: 寺の門。雨の音しか、しない。\n## iwao93_son\niwao.s: 倅？　いるぞ。双子だ。5つになる。朔と、望。\niwao.n: 朔は、おれに似て、言う事を聞かん。望は、おとなしい。母親に似た。\nsaku.c: ……そうですか。\niwao.n: あんたと、同じ名前だな。サクさん。\n## iwao93_bones\niwao.n: 骨か。書庫の机に、並べてある。県の鑑識が来るまで、さわるなと言われているが。\niwao.s: あんたは県警だ。見るだけなら、かまわんだろう。\n@flag bones_ok\n## p93_bones_done\nsaku.k: ……この骨は、おかしい。歯も、足の板も、この時代の物じゃない。\nsaku.n: それに、左の手首。時計をしていた跡があるのに、時計が無い。\n## t93_accident\n@sfx steam\n@card 15時20分。頭の上で、鉄が鳴った。\nsaku.o: 配管が……！\nkid.u: おとうさん！　おとうさん、どこ！\nsaku.u: 子どもの声。……なぜ、こんな所に。\nkid.d: おとうさんに、にた人が、入っていったから……。のぞむと、ついてきたの。\nsaku.o: 望も、いるのか！\n@sfx steam\nren.a: あぶない！　そこを、どけ！\n@card 蓮が、子どもを抱えこんだ。背中に、湯気がかかった。\nren.g: 三雲さん、その子を！　僕が、バルブを閉めます！\n@card 蓮は、赤く焼けた丸いハンドルに、左の腕をかけて、回した。\nren.o: ぐっ……！\n@sfx thud\n@card 15時41分。湯気が、止まった。\nkid.d: ……いたい。おでこが、いたい。\nsaku.d: 眉を、切っている。……そうか。この傷は、きょうの物だったのか。\nkid.p: のぞむが、いない。おくへ、はしっていった。こわいって、言って。\nsaku.c: ……奥は、雨穴だ。弟は、きょう、ここで消えた。俺は、33年、それを知っていた。\n@fact f_leak\n@fact f_burn\n@fact f_brow\n@fact f_nozomu_lost\n@flag accident\n## iwao93_after\niwao.d: 署長に言われた。「排水坑の件は、調べるな」。……鷹取の副所長から、電話があったそうだ。\niwao.k: だが、おれは見た。あの若いのが、朔を、抱えて出てきたのを。腕を、焼いてな。\niwao.d: 望が、まだ見つからん。排水坑の奥は、雨穴に抜けている。あした、穴に入る。\niwao.n: サクさん。あんたの左の眉の傷。きょう、朔が縫った所と、同じだ。……あんた、いったい、誰だ。\nsaku.c: ……いつか、分かります。巌さん。体を、大事にしてください。\niwao.s: 妙な刑事だ。……手帳に、書いておく。\n@flag iwao_bye\n## osamu93_after\nosamu38.k: 刑事さん。発電所は、「宿のボイラーの火傷」と書けと言う。だが、私は、見たままを書く。\nosamu38.n: あの青年は、焼けた丸い鉄に、腕を押しつけている。子どもの方は、眉を3針。……巌さんの、倅だ。\n@get e_chart\nosamu38.t: ふしぎな青年だ。歯の詰め物が、見た事のない材料でね。……それに、どこか、うちの家系の顔をしている。\nosamu38.n: もう1つ、ふしぎな事があった。通りがかりの年寄りの医者が、手伝ってくれたんだ。70ほどの。\nosamu38.t: 腕は、確かだった。私のくせまで、知っているような手つきでね。……青年の顔を見て、泣いていた。名前も言わずに、行ってしまった。\n@fact f_olddoc\n## sayo93_bus\nsayo25.n: 変わった事？　そういえば、5日の朝です。宿の前を、掃いていたら。\nsayo25.t: バスの窓から、じっとこっちを見る、年寄りがいたんです。60くらいの。……泣いているみたいでした。\nsayo25.s: 知らない人なのに、なつかしい顔でした。\n@fact f_busman\n## rei8_first\nrei8.n: おじさん、だあれ。お父さまの、おきゃくさま？\nsaku.s: ……鷹取、玲ちゃんか。\nrei8.u: どうして、名前を知ってるの。ばあやと、おんなじ。ばあやも、なんでも知ってるの。\n## rei8_toki\nrei8.s: ばあやはね、わたしが何か言うまえに、分かっちゃうの。「お嬢さまは、いま、プリンが食べたいのでしょう」って。\nrei8.n: 手もね、おんなじなの。ここに、ほくろ。ばあやにも、ある。\n## rei8_dream\nrei8.g: わたし、大きくなったら、お父さまの発電所で、いちばんえらい人になるの。\nrei8.n: ばあやに言ったら、「なれますとも」って。泣きながら、笑うの。へんなの。\n## toki93_first\ntoki.n: いらっしゃいまし。旦那さまは、発電所でございます。\ntoki.k: ……あなたさまは。\nsaku.n: 県警の、サクといいます。\ntoki.c: さようでございますか。……お待ち申しておりました、とは、申せませんね。\n@flag met_toki\n## toki93_house\ntoki.n: この家には、昭和35年から、おります。先代の宗一郎さまの時からでございます。\ntoki.s: 旦那さまも、お嬢さまも、この手で育てました。……わたくしには、家族というものが、ございませんので。\n## toki93_past\ntoki.n: 昔の事は、覚えておりません。昭和35年の11月、雨穴の前で、気がついたのでございます。\ntoki.c: それより前の事は、何も。名前も、先代がつけてくださいました。\n@fact f_toki_1960\n## m93_sewing\nsaku.n: ばあやの針箱。底に、布にくるんだ物がある。\nsaku.k: 金の章だ。古びて、角が丸い。裏に、字。「2024　鷹取玲」。\nsaku.o: ……所長の章と、同じ物だ。世界に1つの。\n@fact f_toki_pin\n## m93_photo\nsaku.n: 額の写真。先代の、鷹取宗一郎。10年前に、死んだ。\n## m93_desk\nsaku.n: 副所長の机。増設工事の図面。きれいに、片づいている。\n## m93_cane\nsaku.n: 傘立て。杖は、まだ、無い。……あの人は、まだ43だ。\n## m93_monitor\nsaku.n: 棚の上に、黒い電話。門に、カメラは無い。\n## toki93_after\ntoki.c: ……33年、誰にも、言いませんでした。\ntoki.d: わたくしは、2026年から参りました。父を追って、あの穴に入ったのでございます。\ntoki.n: 父は、着いた夜に死にました。わたくしは、帰りそこねました。それで、10歳の父を、育てる事になった。\ntoki.s: そして、8つの自分を。……人には、できない事を、させてもらいました。\nsaku.o: ……あなたのお父さんは、いつ、穴に。\ntoki.c: それは、あなたさまが、まだ見ていない夜の事です。申せません。申せば、あなたさまは、あの場に立てなくなる。\ntoki.n: 1つだけ。あの夜、父は、最後に言いました。「玲、すまない」と。\n@fact f_toki_confess\n@flag b6\n## b6_intro\ntoki.n: 何か、お聞きになりたい事が、おありのようで。\nsaku.k: トキさん。あなたは、どこから来た人ですか。\n## b6_s1\ntoki.n: わたくしは、ただの女中でございます。昭和35年より前の事は、覚えておりません。\n## b6_o1\nsaku.k: 針箱の底に、金の章がありました。裏に、「2024」。31年も先の年だ。\ntoki.p: ……。\n## b6_s2\ntoki.k: その章は、昔、森で拾った物でございます。\n## b6_o2\nsaku.k: 章の裏には、名前もある。「鷹取玲」。この家の、8つのお嬢さんの名だ。\nsaku.k: 同じ章を、2026年の所長が、襟につけています。世界に1つの章が、2つある。……あなたが、鷹取玲だ。\ntoki.o: ……。\n## b6_s3\ntoki.n: ……では、うかがいます。あのお嬢さまは、大きくなったら、何に、おなりですか。\n## b6_o3\nsaku.n: 霧渕原発の、所長です。2024年に。\ntoki.s: ……はい。あの子は、なります。わたくしが、なったのですから。\n## b6_m0\ntoki.n: それは、ちがうようでございます。\n## b6_m1\ntoki.k: 年寄りを、からかうものでは、ございません。\n## nozomu60_first\nnozomu.u: ……おとうさん？\nsaku.o: ……望。\nnozomu.d: ちがう。おとうさんじゃない。……でも、にてる。さくにも、にてる。\nsaku.c: ……。\n@flag met_nozomu\n## nozomu60_name\nnozomu.n: のぞむ。5さい。\nnozomu.t: おうちに、かえりたい。あなのなかで、まいごになったの。ゆげが、こわくて、はしったの。\n## nozomu60_home\nnozomu.d: おうちには、おとうさんと、さくがいる。……さく、ないてた。おでこから、ちが出てた。\nsaku.p: ……朔は、大丈夫だ。3針、縫っただけだ。\nnozomu.u: どうして、しってるの。\n## tae60_boy\ntae.n: あの子ですか。きのうの夕方、雨穴の前で、泣いていたんです。5つくらいの男の子。\ntae.t: 名前は「のぞむ」と言うけれど、苗字が言えません。どこの子か、町じゅうに聞いても、誰も知らない。\ntae.n: 着ていた物が、変わっているんですよ。見てやってください。そこに、干してあります。\n@fact f_found60\n@flag child_ok\n## i60_child_done\nsaku.d: ……まちがいない。弟の服だ。あの日、俺と、おそろいで着ていた。\n## b7_intro\ntae.k: あなた、あの子を、知っているんですね。顔に、出ています。\ntae.n: わたしは、あの子を、あずかっている者です。聞かせてください。\n## b7_s1\ntae.n: あの子の、名前と、歳を。\n## b7_o1\ntae.n: ……はい。あの子も、そう言いました。\n## b7_s2\ntae.n: あの子の家は、どこにあるんです。\n## b7_o2\ntae.t: 33年、あと……？　三雲の、駐在さんの家に？　……駐在さんの子は、まだ2つですよ。\nsaku.n: その子が大きくなって、父親になります。望は、その人の子です。\n## b7_s3\ntae.n: ……では、あなたは、あの子の、何なんです。\n## b7_o3\ntae.o: 兄さん。……あなたが。\ntae.d: 連れて、帰るんですね。\n## b7_m0\ntae.n: ……ちがうと思います。\n## b7_m1\ntae.k: いいかげんな事を言う人に、あの子は渡せません。\n## tae60_after\nsaku.d: ……連れては、帰れません。\nsaku.c: 弟は、ここで育ちます。医者になって、息子を持つ。その息子が、5つの俺を、助けた。……俺が連れて帰れば、その全部が、消える。\ntae.d: ……むずかしい事は、分かりません。でも、あの子を、うちの子にして、いいんですね。\nsaku.g: お願いします。……いい医者に、なります。\ntae.s: 名前を、つけなおさなくちゃ。苗字のない子は、かわいそうだもの。汐見、修。どうかしら。\nnozomu.n: ……おさむ？\ntae.s: そう。きょうから、あなたは、汐見修。わたしの子よ。\nsaku.c: ……達者でな。望。\n@fact f_tae_named\n@flag b7\n## b4_intro\nosamu71.k: 何だ。また、歯ブラシか。\nsaku.k: 汐見先生。あなた自身の事を、うかがいます。\n## b4_s1\nosamu71.n: 私は、汐見多恵の子だ。この町で生まれ、この町で医者になった。\n## b4_o1\nsaku.k: あなたは、多恵さんの産んだ子じゃない。昭和35年の11月9日、雨穴の前で拾われた、5つの男の子だ。\nosamu71.p: ……なぜ、それを。戸籍にしか、書いていない事を。\n## b4_s2\nosamu71.k: 拾われ子だとしても、どこの子かなど、誰にも分からん。\n## b4_o2\nsaku.k: 鑑定所が、俺とあなたの型を比べました。全部、同じです。一卵性の、双子だ。\nsaku.d: あなたは、三雲望。33年前に消えた、俺の弟です。\nosamu71.o: ……私の方が、33も年上なのにか。\n## b4_s3\nosamu71.t: ……8日と9日、医院を閉めたのは、学会だ。どこへも、行っていない。\n## b4_o3\nsaku.k: 1993年の11月9日。汐見医院で、70ほどの老医師が、火傷の青年を手当てしています。処方箋の紙に、「令和8年」。\nsaku.n: 先生は、穴を通って、33年前の息子に会いに行った。\nosamu71.c: ……。\n## b4_m0\nosamu71.n: 話にならん。\n## b4_m1\nosamu71.a: 人の過去を、あれこれ言うな。\n## osamu26_after\nosamu71.d: ……あの男が死んで、初めて分かった。あれは、蓮だった。私は33年、自分の息子を、気味が悪いと言ってきた。\nosamu71.n: だから、行った。若い蓮に、ひと目、会いたかった。……38の私は、私に気づかなかったよ。\nosamu71.c: そして君が、兄か。……私は、ずっと、雨の日に、誰かを待っている気がしていた。\n@get e_koseki\nosamu71.k: 1つ、言っておく。5日の夜、私が朽木屋にどなりこんだ時、宿の前に、鷹取の当主の車が止まっていた。\n@fact f_seiji_inn\n@flag b4\n## b5_intro\nsayo58.n: ……三雲さん。まだ、何か。\nsaku.n: 小夜さん。あなたが黙っている事を、聞かせてください。\n## b5_s1\nsayo58.n: あの人の昔の物は、何も残っていません。来た時は、着のみ着のままでした。\n## b5_o1\nsaku.k: 33年前、あなたは、あの人の荷物を、客室に置いていました。上着のタグは「2025」。それに、汐見蓮の社員証。\nsayo58.p: ……どうして、それを。\n## b5_s2\nsayo58.t: あの人が誰なのか、私は、知りませんでした。\n## b5_o2\nsaku.k: 朽木匡は、汐見蓮です。あなたは、社員証を見ている。蓮が生まれて、育つのも、見てきた。\nsayo58.c: ……。\n## b5_s3\nsayo58.n: 5日の夜は、何も、ありませんでした。あの人が、帰ってきただけです。\n## b5_o3\nsaku.k: 5日の夜、宿の前に、鷹取の当主の車が止まっていました。汐見先生が、見ています。\nsayo58.d: ……。\n## b5_m0\nsayo58.n: それは、ちがいます。\n## b5_m1\nsayo58.t: 三雲さん。そっとして、おいてください。\n## sayo26_after\nsayo58.d: ……知っていました。蓮くんが、10になるころには、もう。\nsayo58.n: あの人は言いました。「あの子を、止めてはいけない。止めたら、灯が生まれない」と。\nsayo58.c: だから私は、6日の夜、蓮くんを見送るあの人を、見送ったんです。\nsayo58.n: あの人の日記です。5日の夜の事も、書いてあります。……鷹取の当主が、何を言ったのかも。\n@get e_diary\n@flag b5\n## b8_intro\n@card 岩の音が止むと、雨の中に、足音がした。\nrei.o: ……父は。父は、どこです。\nsaku.d: 所長。\nrei.g: 屋敷に、紙がありました。「森へ行く」。……答えて。父は、どこへ行ったの。\n## b8_s1\nrei.k: 父は、どこへ行ったの。穴の奥に、何があるの。\n## b8_o1\nsaku.d: 穴は、昭和35年につながっています。当主は、そこで死にます。66年前に葬られた無縁仏が、あの人です。\nrei.o: ……。\n## b8_s2\nrei.g: 私も行きます。父を、1人で死なせない。……止めても、むだよ。私が行ったら、私は、どうなるの。\n## b8_o2\nsaku.d: あなたは、帰れなくなります。記憶のない女として、鷹取の家に引き取られる。名前は、トキ。\nsaku.c: 10歳のお父さんを育て、33年たって、8つのあなた自身を育てる。……あなたのばあやは、あなたでした。\nrei.o: ……トキが。\nrei.c: ……そう。だから、あの人は、何でも知っていたのね。\n## b8_m0\nrei.a: ごまかさないで。\n## b8_m1\nrei.k: 時間が、ないの。\n## end_rei_know\nrei.s: 三雲さん。私、トキが大好きだったの。あの人のいない家なんて、考えられなかった。\nrei.g: なら、行くわ。あの子を、ひとりにしない。……あの子は、私なんだから。\nsaku.d: ……所長。\nrei.c: 父の最期には、間に合うのね。それで、じゅうぶんよ。\n@sfx stepw\n@card 鷹取玲は、ふり返らずに、穴へ入った。左の道を。\nakari.d: ……三雲さん。\nsaku.c: 止められなかった。……いや。止めては、いけなかった。\n## end_rei_blind\nrei.g: 答えないのね。なら、自分で確かめる。\n@sfx stepw\n@card 鷹取玲は、穴へ入っていった。左の道を。\nakari.u: 三雲さん、所長まで！\nsaku.d: ……あの人が、どこへ行き、誰になるのか。俺は、まだ、分かっていない。\n## epilogue2\nsaku.n: ……灯。墓地に、花を持っていこう。\nakari.n: どなたの、お墓ですか。\nsaku.c: 無縁仏と、ばあやのトキさん。それから、弟の石だ。……弟の石は、もう、いらなくなった。\nosamu71.s: 兄さん、と呼ぶのは、どうも、きまりが悪いな。私の方が、じいさんだ。\nsaku.s: 好きに呼んでくれ。……おかえり、望。\n## x_many2\nsaku.t: 言葉を、並べすぎた。要る事だけを、言おう。\n\n# 三十三年目の雨　台本その3（自分の言葉で聞く会話）\n# 場面の名： q_人_役。 x1 x2 x3 通じない時 / who 知らない名 / what 見せられても分からない物 / hello self alibi bye help rude fine\n# p_人 その人の事 / t_物 その物の事 / l_所 その場所の事 / そのほかは、鋭い問いへの証言\n## q_akari_x1\nakari.t: すみません、三雲さん。いまの、よく分かりませんでした。……父の事なら、何でも聞いてください。\n## q_akari_x2\nakari.n: ええと。……現場の事ですか。それとも、蓮くんの事ですか。\n## q_akari_x3\nakari.s: 三雲さん、疲れていませんか。……大丈夫です。もう1度、どうぞ。\n## q_akari_who\nakari.t: その名前は、私には、分かりません。鑑識の記録にも、出てきません。\n## q_akari_what\nakari.n: それは、私の方では、まだ調べがついていません。分かったら、すぐ知らせます。\n## q_akari_hello\nakari.n: はい。……あいさつは、いいですよ。長いつきあいじゃないですか。\n## q_akari_self\nakari.n: 朽木灯。31です。霧渕署の鑑識。……朽木屋の、ひとり娘です。\n## q_akari_alibi\nakari.n: 私ですか。きのうの夜は、署の当直でした。……三雲さんも、いたじゃないですか。\n## q_akari_bye\nakari.n: はい。私は、ここにいます。何か分かったら、戻ってきてください。\n## q_akari_help\nakari.n: まず、遺体を見てください。それから、町で、父を知る人の話を。母と、汐見先生と、発電所です。\n## q_akari_rude\nakari.k: ……三雲さん。いまのは、聞かなかった事にします。\n## q_akari_fine\nakari.c: 大丈夫です。……泣くのは、全部終わってからにします。\n## q_akari_p_tadashi\nakari.d: 父は、静かな人でした。怒った所を、見た事がありません。\nakari.n: 33年前より昔の事は、1度も話しませんでした。\n## q_akari_p_sayo\nakari.n: 母は、宿にいます。気丈な人ですが、きょうは、そばに誰もいません。……顔を見てやってください。\n## q_akari_p_osamu\nakari.n: 汐見先生は、蓮くんのお父さんです。医院は、町の通りに。……父とは、仲がよくなかったみたいです。\n## q_akari_p_seiji\nakari.n: 鷹取の当主ですか。発電所を動かしてきた家の人です。父とは、古い知り合いだと聞きました。\n## q_akari_p_rei\nakari.n: 鷹取所長。蓮くんの上司です。きびしい人ですが、うそは下手な人だと思います。\n## q_akari_p_iwao\nakari.s: 巌さん。三雲さんのお父さんですよね。父が、よく言っていました。「あの人には、借りがある」って。\n## q_akari_p_saku\nakari.s: 三雲さんの事ですか。……仕事はできるけど、自分の事を話さない人。父と、少し似ています。\n## q_akari_l_cave\nakari.n: 雨穴は、昔から、入ってはいけない穴です。\nakari.t: 父は、年に1度、あそこへ花を持っていきました。理由は、言いませんでした。\n## q_akari_t_watch\nakari.k: 22時17分で止まっています。でも、りゅうずが、引き出されたままです。……時計は、あてにしない方がいい。\n## q_akari_t_jacket\nakari.t: 父の服では、ありません。こんな作業着、うちには、1着もありませんでした。\n## q_akari_t_cane\nakari.n: 杖の跡は、径22ミリ。父は、杖を使いません。……使う人が、ここに来たんです。\n## q_akari_burn\nakari.d: 腕の火傷ですか。小さいころ、聞いた事があります。「どうしたの」って。\nakari.c: 父は、笑って言いました。「お前が生まれるための傷だよ」。……意味は、いまも分かりません。\n@fact t_akari_burn\n## q_osamu71_x1\nosamu71.t: 何を言っているのか、分からん。……年寄りには、はっきり言ってくれ。\n## q_osamu71_x2\nosamu71.k: 刑事さん。雑談なら、あとだ。息子の事を、聞いてくれ。\n## q_osamu71_x3\nosamu71.c: ……すまん。耳が遠くなってな。もう1度、言ってくれんか。\n## q_osamu71_who\nosamu71.n: 知らん名だ。カルテにも、無い。\n## q_osamu71_what\nosamu71.n: 私は医者だ。それを見せられても、医者の言える事は、無い。\n## q_osamu71_hello\nosamu71.n: あいさつは、いい。……すわれ。茶くらいは、出す。\n## q_osamu71_self\nosamu71.n: 汐見修。71だ。この町で、45年、医者をやっている。\nosamu71.d: 妻は、早くに死んだ。家族は、息子の蓮だけだ。\n## q_osamu71_alibi\nosamu71.n: きのうの夜か。ここにいた。1人でな。……息子の帰りを、待っていた。\n## q_osamu71_bye\nosamu71.d: ……ああ。息子を、頼む。\n## q_osamu71_help\nosamu71.n: 聞く事が無いのか。……なら、言っておく。5日の夜、私は朽木に会っている。その話を、聞け。\n## q_osamu71_rude\nosamu71.a: 口のきき方を、知らんのか。……巌さんの倅だろう、君は。\n## q_osamu71_p_ren\nosamu71.d: 蓮は、27だ。発電所で、廃炉の調べをしている。\nosamu71.t: 母親に似て、言いだしたら聞かん。……きのうの夜から、帰らない。\n## q_osamu71_p_tae\nosamu71.s: 母だ。産婆だった。この医院は、もとは母の産院でな。……私を、女手ひとつで、医者にした。\n## q_osamu71_p_seiji\nosamu71.n: 鷹取の当主か。患者の事は、言えん。……ただ、あの人は、この町で、いちばん長く物を覚えている人だ。\n## q_osamu71_p_sayo\nosamu71.n: 朽木の女将か。気の毒な事だ。……あの人には、何のうらみも無い。\n## q_osamu71_p_akari\nosamu71.n: 灯ちゃんか。小さいころから、診ている。父親の遺体を、自分で見るとは。……強い子だ。\n## q_osamu71_p_iwao\nosamu71.s: 巌さんか。いい巡査だった。……君の眉を縫ったのは、私だぞ。5つの時だ。覚えているか。\n## q_osamu71_p_saku\nosamu71.n: 君の事は、子どものころから知っている。……ふしぎと、他人の気がせん。\n## q_osamu71_p_nozomu\nosamu71.d: 望くんか。君の、双子の弟だったな。……あの日は、町じゅうで探した。私も、探した。\n## q_osamu71_l_cave\nosamu71.k: 雨穴か。……あの穴には、近づくな。私は、息子にも、そう言った。聞かなかったがな。\n## q_osamu71_t_burn\nosamu71.n: 朽木の腕の火傷か。33年前に、私が手当てをした。……丸い、焼けた鉄の跡だ。\n## q_osamu71_rain\nosamu71.c: 雨か。……雨の日は、落ち着かん。子どものころから、ずっとだ。\nosamu71.t: 誰かを、待っている気がする。誰をかは、分からんのだがな。\n@fact t_osamu_rain\n## q_sayo58_x1\nsayo58.t: ごめんなさい。……いま、何とおっしゃいました？　頭が、まだ、ぼんやりしていて。\n## q_sayo58_x2\nsayo58.n: あの人の事でしたら、何でも聞いてください。話している方が、楽ですから。\n## q_sayo58_x3\nsayo58.s: 三雲さん。お茶を、いれましょうか。……ゆっくりで、いいんですよ。\n## q_sayo58_who\nsayo58.t: その方は、存じません。……宿帳にも、無いお名前です。\n## q_sayo58_what\nsayo58.t: それは……私には、分かりません。あの人の物でしょうか。\n## q_sayo58_hello\nsayo58.n: ようこそ。……こんな日でも、宿は開けています。あの人が、そうしろと言いそうですから。\n## q_sayo58_self\nsayo58.n: 朽木小夜です。58になります。この宿は、祖母のハルの代から。\nsayo58.c: ……あの人とは、33年、いっしょでした。\n## q_sayo58_alibi\nsayo58.n: 私は、きのうの夜は、ずっと宿にいました。泊まりのお客さまが、2組。……帳場で、あの人の帰りを待っていました。\n## q_sayo58_bye\nsayo58.s: はい。……また、いらしてください。あの人も、三雲さんが好きでしたから。\n## q_sayo58_help\nsayo58.n: そうですね……。きのうの夜の事。それから、この何日かの、おかしな事。お話しできるのは、それくらいです。\n## q_sayo58_rude\nsayo58.d: ……きょうは、そういう言葉を聞く元気が、ありません。\n## q_sayo58_fine\nsayo58.c: 大丈夫です。……あの人は、「いつか、こうなる」と、知っていたような人でしたから。\n## q_sayo58_p_akari\nsayo58.s: 灯は、あの人に似て、がんこです。父親の遺体を、自分で見ると言って、聞きませんでした。\n## q_sayo58_p_ren\nsayo58.n: 蓮くんは、子どものころから、よく宿に来ていました。\nsayo58.s: あの人が、ずいぶん、かわいがって。……実の子みたいに。\n## q_sayo58_p_osamu\nsayo58.t: 汐見先生は、5日の夜に、いらっしゃいました。大きな声で。……あの人は、だまって聞いていました。\n## q_sayo58_p_seiji\nsayo58.t: 鷹取の当主は……古いおつきあいです。私からは、それ以上は。\n## q_sayo58_p_haru\nsayo58.s: 祖母のハルです。私が小さいころに、亡くなりました。「お客の物は、命がけであずかれ」が、口ぐせでした。\n## q_sayo58_p_iwao\nsayo58.s: 巌さん。あの人を、森から運んできてくださった方です。33年前の、雨の夜に。\n## q_sayo58_l_cave\nsayo58.c: 雨穴。……あの人は、あの穴から来て、あの穴の前で死にました。私は、あの穴が、嫌いです。\n## q_sayo58_t_watch\nsayo58.n: あの人の時計です。でも、あの人は、時計を止めた事がありません。毎朝、ラジオで合わせる人でした。\n## q_sayo58_t_jacket\nsayo58.u: ……その作業着。5日に、あの人が着て帰った物です。\n## q_sayo58_t_ticket\nsayo58.c: 平成5年の、バスの整理券。……私が、あの人に会った年です。\n## q_sayo58_burn\nsayo58.n: 左の腕の火傷ですか。来た時には、無かったんです。3日あとに、包帯をして帰ってきました。\nsayo58.k: 発電所の人は、「宿のボイラーで焼いた」と言いました。でも、うちのボイラーでは、ありません。私が、いちばん知っています。\n@fact t_sayo_boiler\n## q_rei_x1\nrei.n: 三雲さん。ご質問の意味が、分かりかねます。……要点を、どうぞ。\n## q_rei_x2\nrei.k: 当所は、廃炉の作業中です。雑談の時間は、ありません。\n## q_rei_x3\nrei.t: ……もう1度、おっしゃってください。聞き取れませんでした。\n## q_rei_who\nrei.n: その名前の者は、当所には、おりません。\n## q_rei_what\nrei.n: それについて、当所から申し上げる事は、ありません。\n## q_rei_hello\nrei.n: ……どうも。ご用件を、うかがいます。\n## q_rei_self\nrei.n: 鷹取玲。41です。おととしから、霧渕原発の所長をしています。\nrei.c: 祖父が建て、父が動かし、私が閉じる発電所です。\n## q_rei_alibi\nrei.n: 私ですか。6日の夜は、21時45分から、廃炉委員会の会議です。自宅から、画面で出ました。記録が、残っています。\n## q_rei_bye\nrei.n: では。……守衛が、門までお送りします。\n## q_rei_help\nrei.k: 警察に、助言はしません。……ただ、疑うなら、記録を見てからにしてください。入退構の記録は、守衛所です。\n## q_rei_rude\nrei.k: ……いまの発言は、記録しておきます。\n## q_rei_p_tadashi\nrei.n: 朽木屋のご主人。お会いした事は、ほとんどありません。……父の、古い知り合いだとは、聞いています。\n## q_rei_p_soichiro\nrei.n: 祖父の宗一郎です。鷹取組をおこし、この発電所を建てました。私が生まれる前に、亡くなっています。\n## q_rei_p_osamu\nrei.n: 汐見の、お父さまですね。町の医者です。……ご心配は、当然だと思います。\n## q_rei_p_akari\nrei.d: 鑑識の、朽木さん。……ご自分の、お父さまを。つらい仕事ですね。\n## q_rei_p_saku\nrei.n: あなたの事は、父から聞いています。「三雲の倅が来たら、通せ」と。……理由は、聞いていません。\n## q_rei_l_cave\nrei.k: 雨穴は、当所の敷地の外です。\nrei.t: ……子どものころ、ばあやに、きつく言われました。「あの穴にだけは、入ってはなりません」と。\n## q_rei_l_tunnel\nrei.k: 第2排水坑は、12日に閉塞を完了します。安全上の、通常の工程です。\n## q_rei_t_jacket\nrei.t: 鷹取組は、祖父の会社です。……66年前の支給品が、なぜ新しいのかは、私にも説明できません。\n## q_rei_mole\nrei.u: ほくろ？　……ええ、あります。左の手の、ここに。\nrei.s: ばあやにも、同じ所にありました。子どものころ、よく、2人で手を並べたものです。\n@fact t_mole\n## q_seiji76_x1\nseiji76.s: ふむ。……年寄りには、少しむずかしい話だな。もう1度、言ってくれんか。\n## q_seiji76_x2\nseiji76.n: 三雲くん。聞きたい事は、まっすぐ聞きたまえ。私は、逃げんよ。\n## q_seiji76_x3\nseiji76.c: ……雨の音が、うるさくてな。何と言ったかね。\n## q_seiji76_who\nseiji76.n: その名は、知らんな。……この町で、私の知らん名は、少ないのだが。\n## q_seiji76_what\nseiji76.n: ほう。……それを、私に見せて、どうするのかね。\n## q_seiji76_hello\nseiji76.s: よく来た。……すわりたまえ。君とは、ゆっくり話したかった。\n## q_seiji76_self\nseiji76.n: 鷹取征二。76だ。父が建てた発電所を、30年、動かした。いまは、娘が閉じている。\nseiji76.c: ……それだけの男だよ。\n## q_seiji76_bye\nseiji76.s: また来たまえ。……君は、また来る。私には、分かっている。\n## q_seiji76_help\nseiji76.s: 聞く事に、困ったかね。……なら、私の腕時計の話でも、聞くかね。古い話だ。\n## q_seiji76_rude\nseiji76.s: 若いな。……君の父親も、同じ目で、私を見たよ。\n## q_seiji76_p_rei\nseiji76.n: 娘か。よくできた娘だ。……あれには、苦労をかけた。これからも、かける。\n## q_seiji76_p_toki\nseiji76.c: トキか。……私を育てた女だ。母の顔を、私は知らん。トキが、母だった。\n## q_seiji76_p_soichiro\nseiji76.n: 父だ。山を崩して、発電所を建てた男だ。……私は、父ほどには、なれなかった。\n## q_seiji76_p_ren\nseiji76.n: 汐見の倅か。娘の部下だな。熱心な若者だと、聞いている。……熱心すぎる、ともな。\n## q_seiji76_p_osamu\nseiji76.n: 汐見先生には、足を診てもらった。腕のいい医者だ。\n## q_seiji76_p_iwao\nseiji76.k: 三雲巡査部長か。……がんこな男だった。33年前、私に、しつこく手紙をよこした。\n## q_seiji76_p_saku\nseiji76.s: 君か。……33年前、君によく似た男に、会った事がある。その話は、いずれ、しよう。\n## q_seiji76_p_muen\nseiji76.c: 無縁仏か。……人は、どこで骨になるか、選べんものだ。\n## q_seiji76_l_cave\nseiji76.n: 雨穴か。子どものころは、あの前で遊んだものだ。……あの穴は、33年に1度、鳴る。\n## q_seiji76_l_plant\nseiji76.n: 発電所は、私の一生だ。……きれいに、閉じたい。何も、残さずにな。\n## q_seiji76_t_plate\nseiji76.n: 足の事かね。5年前に、折った。金属の板が、入っている。……年寄りの骨は、もろい。\n## q_seiji76_t_jacket\nseiji76.k: ……鷹取組の作業着か。なつかしい物を。どこで、それを見つけたのかね。\n## q_seiji76_1993\nseiji76.n: 33年前か。私は、副所長だった。2号機を建てていた、忙しい年だ。\nseiji76.s: 事故？　無いよ。あの年は、無事故の年だ。記録を、調べてみたまえ。\n@fact t_seiji_noacc\n## q_iwao_x1\niwao.t: 何だって？　県警の言葉は、分からんな。……もう1ぺん、言ってくれ。\n## q_iwao_x2\niwao.n: サクさん。聞きたい事は、はっきり言え。おれは、回りくどいのは苦手だ。\n## q_iwao_x3\niwao.s: ……あんた、ときどき、妙な事を言うな。まあ、いい。何だ。\n## q_iwao_who\niwao.n: 知らん名だな。この町の者なら、おれは全部知っている。……よそ者か。\n## q_iwao_what\niwao.t: 何だ、それは。……見た事のない物だな。あんたの持ち物は、変な物ばかりだ。\n## q_iwao_hello\niwao.s: おう。……茶でも飲むか。うすいがな。\n## q_iwao_self\niwao.n: 三雲巌。35。霧渕署の巡査部長だ。親父の喜一も、ここの駐在だった。\niwao.s: ……倅も、いずれ、ここに立たせる。\n## q_iwao_alibi\niwao.n: おれか。6日の夜は、当直だ。森で、あの若いのを拾った。雨の中でな。\n## q_iwao_bye\niwao.n: おう。気をつけて行け。……この町は、よそ者に、やさしくない。\n## q_iwao_help\niwao.n: 迷ったら、足で聞け。宿と、医院と、発電所だ。……刑事の基本だろう。\n## q_iwao_rude\niwao.a: ……県警だからって、口のきき方があるぞ。\n## q_iwao_p_kiichi\niwao.n: 親父だ。喜一。昭和の間じゅう、ここの駐在だった。……細かい男でな。日誌を、1日も欠かさなかった。\n## q_iwao_p_seiji\niwao.k: 鷹取の副所長か。……この町で、あの家に物を言える者は、おらん。署長も、頭が上がらん。\n## q_iwao_p_sayo\niwao.s: 小夜ちゃんか。朽木屋の若女将だ。気立てがいい。……あの若いのを、よく世話している。\n## q_iwao_p_osamu\niwao.n: 汐見先生か。腕のいい医者だ。産婆の多恵さんの、ひとり息子でな。\n## q_iwao_p_tae\niwao.s: 多恵さんか。産婆だ。おれも、倅たちも、あの人に取り上げてもらった。\n## q_iwao_p_toki\niwao.n: 鷹取の家の、ばあやか。口のかたい人だ。……あの人は、おれを見ると、目をそらす。なぜかは、知らん。\n## q_iwao_l_plant\niwao.k: 発電所か。町の金は、全部あそこから出る。……だから、誰も、あそこの事を調べん。\n## q_iwao_l_tunnel\niwao.n: 排水坑か。森の斜面に、口がある。鉄格子が、こわれたままだ。……子どもが入るから、直せと言っているんだが。\n## q_iwao_cave\niwao.n: 雨穴か。親父が、言っていた。「あの穴は、33年ごとに鳴る」とな。\niwao.t: 前に鳴ったのは、昭和35年だそうだ。……勘定すると、ことしだ。3日から、鳴っている。\n@fact t_iwao_cave\n## q_sayo25_x1\nsayo25.t: えっ。……ごめんなさい、よく聞こえませんでした。もう1度、お願いします。\n## q_sayo25_x2\nsayo25.s: 刑事さんって、むずかしい事を聞くんですね。……匡さんの事ですか？\n## q_sayo25_x3\nsayo25.n: ええと。……お部屋の事でしたら、いつでも言ってくださいね。\n## q_sayo25_who\nsayo25.t: その方は、うちには、泊まっていませんよ。\n## q_sayo25_what\nsayo25.u: わあ。……何ですか、それ。見た事ないです。\n## q_sayo25_hello\nsayo25.s: はい、いらっしゃいませ。雨の中を、たいへんでしたね。\n## q_sayo25_self\nsayo25.s: 朽木小夜です。25。祖母が亡くなってから、1人で、この宿をやっています。\n## q_sayo25_alibi\nsayo25.n: 6日の夜ですか？　宿にいましたよ。巌さんが、ずぶぬれの人をかついで来て。びっくりしました。\n## q_sayo25_bye\nsayo25.s: はい。お気をつけて。……雨、やむといいですね。\n## q_sayo25_help\nsayo25.n: そうですねえ。匡さんの荷物の事とか。……あと、近ごろ、ちょっと変わった事がありました。\n## q_sayo25_rude\nsayo25.a: もう。……刑事さんでも、言っていい事と、悪い事があります。\n## q_sayo25_p_iwao\nsayo25.s: 巌さんは、こわい顔ですけど、やさしいんですよ。双子の坊やに、でれでれで。\n## q_sayo25_p_haru\nsayo25.d: 祖母です。3年前に、亡くなりました。……宿の事は、全部、祖母に教わりました。\n## q_sayo25_p_osamu\nsayo25.n: 汐見先生は、通りのお医者さまです。匡さんの事も、診てくださいました。\n## q_sayo25_p_seiji\nsayo25.t: 鷹取の副所長さんですか。……こわい方です。宿には、いらっしゃいません。\n## q_sayo25_l_cave\nsayo25.t: 雨穴ですか。祖母が、言っていました。「あの穴が鳴る年は、宿に、変わったお客が来る」って。\n## q_sayo25_tag\nsayo25.n: 名前が無いと、呼べないでしょう。それで、帳場の古い札から、もらったんです。「匡」って。\nsayo25.s: 祖母の、亡くなった連れあいの名です。……ふしぎと、似合うんですよ。あの人に。\n@fact t_sayo_tag\n## q_ren_x1\nren.t: すみません、三雲さん。……いまのは、どういう意味ですか。\n## q_ren_x2\nren.n: ここでは、言葉に気をつけています。誰が聞いているか、分かりませんから。……もう1度、どうぞ。\n## q_ren_x3\nren.s: 三雲さんも、混乱しますよね。僕も、3日たって、やっと慣れました。\n## q_ren_who\nren.t: その名前は……僕には、分かりません。\n## q_ren_what\nren.n: それは、僕も、初めて見ます。\n## q_ren_hello\nren.s: はい。……知っている顔に会えて、ほっとしました。\n## q_ren_self\nren.n: 汐見蓮。27です。霧渕原発の、廃止措置の係。……ここでは、「匡」と呼ばれています。\n## q_ren_alibi\nren.n: 6日の夜に、穴を抜けました。出た所で、足をすべらせて。……気がついたら、この宿でした。\n## q_ren_bye\nren.s: はい。……三雲さん。来てくれて、ありがとうございます。\n## q_ren_help\nren.n: 僕が、なぜ、ここへ来たか。それを、まだ話していませんでしたね。\n## q_ren_rude\nren.t: ……三雲さん。疲れているんですよ。少し、休んでください。\n## q_ren_p_sayo\nren.s: 小夜さんですか。よくしてくれます。……2026年の女将さんの、若いころですよね。変な感じです。\n## q_ren_p_iwao\nren.n: 巌さんに、拾ってもらいました。……三雲さんの、お父さんですよね。目が、同じです。\n## q_ren_p_rei\nren.n: 所長には、止められました。「第2排水坑には、さわるな」と。……所長も、誰かに言われていたんだと思います。\n## q_ren_p_seiji\nren.k: この時代では、副所長です。……日誌が抜けた日の責任者は、あの人です。\n## q_ren_p_akari\nren.s: 灯さん。……元気ですか。僕が帰らないと、怒っているでしょうね。\n## q_ren_l_cave\nren.n: 穴の中の道は、2つでした。左が「下」。右が「上」。……左を選んだら、ここに出たんです。\n## q_ren_tadashi\nren.n: 2026年の匡さんは、僕に、やけに親切でした。僕の好物も、子どものころのけがも、知っていたんです。\nren.t: 父より、僕にくわしい。……ふしぎな人だと、思っていました。\n@fact t_ren_tadashi\n## q_ren2_x1\nren.t: ……すみません。薬のせいか、頭が回りません。\n## q_ren2_x2\nren.c: ……三雲さん。僕は、大丈夫です。行ってください。\n## q_ren2_x3\nren.n: ……もう1度、言ってもらえますか。\n## q_ren2_who\nren.t: ……その名前は、分かりません。\n## q_ren2_what\nren.n: ……それは、僕には、分かりません。\n## q_ren2_hello\nren.s: ……はい。来てくれたんですね。\n## q_ren2_self\nren.c: 汐見蓮。……いえ。きょうからは、朽木屋の、匡です。\n## q_ren2_bye\nren.g: 三雲さん。……33年あとで、また会いましょう。僕は、先に行って、待っています。\n## q_ren2_help\nren.n: ……僕の事は、もう、いいんです。三雲さんは、先へ行ってください。昭和35年へ。\n## q_ren2_rude\nren.s: ……はは。三雲さんらしくないですね。\n## q_ren2_p_osamu\nren.d: 父には、会えません。……33年、会えないんです。同じ町にいるのに。\n## q_ren2_p_tadashi\nren.c: 匡さんは、全部知っていて、僕を送り出したんです。……自分が、何を失うかも。\n## q_ren2_p_sayo\nren.s: 小夜さんには、何も言いません。……記憶のない男のままで、います。\n## q_osamu38_x1\nosamu38.t: はい？　……すみません、もう1度、お願いできますか。\n## q_osamu38_x2\nosamu38.n: 体の具合の事でしたら、何でもどうぞ。……刑事さんの仕事の話は、私には、むずかしい。\n## q_osamu38_x3\nosamu38.s: 県警の方は、変わった聞き方をしますね。……どういう事でしょう。\n## q_osamu38_who\nosamu38.n: その名前の患者さんは、いませんね。\n## q_osamu38_what\nosamu38.u: ほう。……見た事のない物ですね。どこの製品です？\n## q_osamu38_hello\nosamu38.s: こんにちは。……眉の古い傷、きれいに治っていますね。上手な医者が、縫いましたね。\n## q_osamu38_self\nosamu38.n: 汐見修。38です。母の産院をついで、医院にしました。家内と、2人ぐらしです。子どもは、まだです。\n## q_osamu38_alibi\nosamu38.n: 6日の夜ですか。巌さんに呼ばれて、雨穴の前へ行きました。倒れていた青年を、その場で診たんです。\n## q_osamu38_bye\nosamu38.s: お大事に。……いや、刑事さんに言う言葉じゃないか。\n## q_osamu38_help\nosamu38.n: 私に聞ける事ですか。……そうですね。6日の夜に診た、青年の事くらいでしょうか。\n## q_osamu38_rude\nosamu38.t: ……お疲れのようですね。少し、すわっていかれますか。\n## q_osamu38_p_ren\nosamu38.n: あの青年ですか。体は、どこも悪くありません。記憶だけが、無い。\nosamu38.t: ……ただ、ふしぎと、初めて会った気がしないんです。\n## q_osamu38_p_iwao\nosamu38.s: 巌さんには、よく、けが人を運んでもらいます。双子の坊やの、かかりつけですよ。\n## q_osamu38_p_seiji\nosamu38.t: 鷹取の副所長ですか。……発電所の健康診断は、うちで受けています。それ以上は、言えません。\n## q_osamu38_p_sayo\nosamu38.s: 朽木屋の小夜さん。働き者です。あの青年も、いい所にあずけられた。\n## q_osamu38_l_cave\nosamu38.t: 雨穴は、苦手なんです。子どものころから。……近くへ行くと、足がすくむ。理由は、分かりません。\n## q_osamu38_past\nosamu38.s: 母の多恵は、産婆です。父は、いません。母ひとり、子ひとりです。\nosamu38.t: 小さいころの事ですか。……じつは、5つより前の事を、何も覚えていないんです。母は、「雨の日に来た子だ」と笑うばかりで。\n@fact t_osamu38_memory\n## q_seiji43_x1\nseiji43.k: 何の話か、分からんな。……私は、忙しいと言ったはずだ。\n## q_seiji43_x2\nseiji43.n: 質問は、手みじかに。3分だけ、聞こう。\n## q_seiji43_x3\nseiji43.t: ……県警は、ひまなのかね。\n## q_seiji43_who\nseiji43.n: 知らんな。うちの所員では、ない。\n## q_seiji43_what\nseiji43.k: それが、当所と、何の関係がある。\n## q_seiji43_hello\nseiji43.n: ……ああ。用件を、聞こう。\n## q_seiji43_self\nseiji43.n: 鷹取征二。43。霧渕原発の副所長だ。2号機の増設は、私が指揮している。\n## q_seiji43_alibi\nseiji43.n: 私の居場所か。朝から晩まで、ここだ。守衛に聞けば、分かる。\n## q_seiji43_bye\nseiji43.n: 出口は、あちらだ。\n## q_seiji43_help\nseiji43.k: 私から話す事は、何も無い。……聞きたい事があるなら、証拠を持って来たまえ。\n## q_seiji43_rude\nseiji43.a: ……署長に、電話を1本入れようか。君の名前で。\n## q_seiji43_p_rei\nseiji43.s: 娘か。8つだ。……あれは、私より、できがいい。\n## q_seiji43_p_soichiro\nseiji43.n: 父は、10年前に死んだ。この発電所は、父の墓のような物だ。\n## q_seiji43_p_iwao\nseiji43.k: 三雲巡査部長か。……細かい事を、かぎ回る男だ。\n## q_seiji43_p_ren\nseiji43.n: 記憶のない若者？　宿に流れついた、よそ者だろう。当所とは、関係ない。\n## q_seiji43_l_tunnel\nseiji43.k: 第2排水坑か。……点検中だ。部外者は、立入禁止だ。\n## q_seiji43_l_cave\nseiji43.n: 雨穴か。……子どものころ、あそこで、死にかけた年寄りを見た。それだけだ。\n## q_seiji43_t_accident\nseiji43.k: 事故？　当所は、6年、無事故だ。掲示板を、見たまえ。\n## q_seiji43_toki\nseiji43.n: トキか。私を育てた女だ。いまは、娘を見ている。\nseiji43.t: 口うるさいが、あれの言う事は、ふしぎと当たる。……先週も、「9日は、排水坑に人を入れるな」と言った。ばかな話だ。\n@fact t_seiji43_toki\n## q_toki_x1\ntoki.n: 申しわけございません。年のせいか、よく聞き取れませんでした。……もう1度、お願いいたします。\n## q_toki_x2\ntoki.s: お茶を、おいれいたしましょうか。……お話は、それからでも。\n## q_toki_x3\ntoki.c: ……さようでございますか。わたくしには、むずかしいお話でございます。\n## q_toki_who\ntoki.n: 存じあげない、お名前でございます。\n## q_toki_what\ntoki.t: それは……わたくしには、分かりかねます。\n## q_toki_hello\ntoki.s: ようこそ、おいでくださいました。雨の中を、ご苦労さまでございます。\n## q_toki_self\ntoki.n: トキと申します。74になります。このお屋敷で、33年、奉公しております。\ntoki.c: ……それだけの、年寄りでございます。\n## q_toki_alibi\ntoki.n: わたくしは、お屋敷を出ません。お嬢さまのおそばに、おります。\n## q_toki_bye\ntoki.c: お気をつけて。……どうぞ、お体だけは、大事になさってください。\n## q_toki_help\ntoki.s: わたくしに、お聞きになりたい事。……このお屋敷の事か、わたくしの昔の事くらいで、ございましょうか。\n## q_toki_rude\ntoki.s: ……お若い方は、お元気で、よろしゅうございます。\n## q_toki_p_rei\ntoki.s: お嬢さまは、8つでございます。利発で、がんこで。\ntoki.c: ……あの方の考える事は、わたくしには、手に取るように分かります。\n## q_toki_p_seiji\ntoki.n: 旦那さまは、10の時から、お育ていたしました。……強い方です。強すぎて、ご自分を曲げられない。\n## q_toki_p_soichiro\ntoki.n: 先代は、行くあてのないわたくしを、置いてくださいました。名前も、先代にいただきました。\n## q_toki_p_iwao\ntoki.c: 三雲の、巡査部長さま。……あの方には、いずれ、おわびをしなければなりません。\n## q_toki_p_saku\ntoki.c: ……あなたさまの事は、存じております。それ以上は、申せません。\n## q_toki_l_cave\ntoki.k: 雨穴には、お近づきにならないでください。……と、申しても、あなたさまは、行かれるのでしょうね。\n## q_toki_t_pin\ntoki.p: ……針箱を、ごらんになったのですね。\n## q_toki_mole\ntoki.u: ……手の、ほくろで、ございますか。\ntoki.c: 生まれつきでございます。お嬢さまと、同じ所に。……よく、お気づきになりました。\n@fact t_mole\n## q_rei8_x1\nrei8.t: おじさんの言うこと、むずかしくて、わかんない。\n## q_rei8_x2\nrei8.s: もういっかい、言って。ゆっくりね。\n## q_rei8_x3\nrei8.n: ……それ、ばあやに聞いたほうが、いいとおもう。\n## q_rei8_who\nrei8.n: しらない人。……ばあやなら、しってるかも。\n## q_rei8_what\nrei8.u: なあに、それ。見せて、見せて。\n## q_rei8_hello\nrei8.s: こんにちは。……ちゃんと、ごあいさつできるの。えらいでしょ。\n## q_rei8_self\nrei8.g: たかとり、れい。8さい。3年生。\n## q_rei8_alibi\nrei8.n: わたし？　ずっと、おうちにいるよ。雨だから、お外であそべないの。\n## q_rei8_bye\nrei8.s: ばいばい。また来てね、おじさん。\n## q_rei8_help\nrei8.n: おはなし、なくなっちゃった？　じゃあ、ばあやのこと、おしえてあげる。\n## q_rei8_rude\nrei8.a: わるい言葉！　ばあやに、言いつけるからね。\n## q_rei8_p_seiji\nrei8.n: お父さまは、おしごと。いつも、おしごと。……でも、おたんじょうびには、かえってくるの。\n## q_rei8_p_soichiro\nrei8.n: おじいさま？　しゃしんでしか、しらない。わたしが生まれるまえに、しんじゃったの。\n## q_rei8_l_cave\nrei8.k: あのあなは、だめなの。ばあやが、こわい顔で言うの。「お嬢さまは、ぜったいに、入ってはなりません」って。\n## q_nozomu_x1\nnozomu.t: ……わかんない。\n## q_nozomu_x2\nnozomu.d: おじさんのことば、むずかしい。\n## q_nozomu_x3\nnozomu.n: ……もういっかい、いって。\n## q_nozomu_who\nnozomu.t: しらない。\n## q_nozomu_what\nnozomu.u: それ、なあに。\n## q_nozomu_hello\nnozomu.n: ……こんにちは。\n## q_nozomu_self\nnozomu.n: のぞむ。……5さい。\n## q_nozomu_bye\nnozomu.d: ……いっちゃうの。\n## q_nozomu_help\nnozomu.d: ……おうちのこと、きいて。\n## q_nozomu_rude\nnozomu.d: ……おこってるの？\n## q_nozomu_p_tae\nnozomu.s: たえおばちゃん、やさしい。おにぎり、くれた。\n## q_nozomu_l_cave\nnozomu.p: あな、こわい。くらくて、ごうって、おとがした。\n## q_kiichi_x1\nkiichi.t: 何だと？　よそ者の言葉は、分からん。……もう1度、言え。\n## q_kiichi_x2\nkiichi.n: 旅の人。用があるなら、はっきり言ってくれ。おれは、ひまじゃない。\n## q_kiichi_x3\nkiichi.s: ……あんた、どうも、変わった物の言い方をするな。\n## q_kiichi_who\nkiichi.n: 聞かん名だ。町の者でも、鷹取組の者でも、ないな。\n## q_kiichi_what\nkiichi.u: 何だ、そりゃあ。……見た事もない細工だ。アメリカの物か。\n## q_kiichi_hello\nkiichi.n: おう。……まあ、すわれ。雨やどりくらいは、させてやる。\n## q_kiichi_self\nkiichi.n: 三雲喜一。40だ。霧渕の駐在を、15年やっている。女房と、2つの倅が、1人。\n## q_kiichi_alibi\nkiichi.n: おれか。5日前の晩は、ここだ。飯場のけんかを、2つ、おさめた。\n## q_kiichi_bye\nkiichi.n: 気をつけて行け。……森には、入るなよ。\n## q_kiichi_help\nkiichi.n: 聞きたい事が無いなら、言っておく。5日前、宿に、妙な客があった。その話なら、してやる。\n## q_kiichi_rude\nkiichi.a: ……よそ者が。ひと晩、とめてやろうか。そこの、おりに。\n## q_kiichi_p_haru\nkiichi.n: 朽木屋の、ハルさんか。亭主を戦争で亡くして、1人で宿を守っている。かたい人だ。\n## q_kiichi_p_soichiro\nkiichi.k: 鷹取の親方か。……金と人を、山ほど連れてきた。町は、あの人に、何も言えん。\n## q_kiichi_p_tae\nkiichi.s: 産婆の多恵さんだ。うちの巌も、あの人が取り上げた。\n## q_kiichi_p_seiji\nkiichi.n: 鷹取の倅か。10になる。母親がおらんでな。飯場で、1人で遊んでいる。\n## q_kiichi_l_plant\nkiichi.n: 発電所の工事か。人夫が千人だ。おかげで、駐在は、寝るひまも無い。\n## q_kiichi_cave\nkiichi.n: 雨穴か。じいさまが、言っていた。昭和2年にも、あの穴が鳴ったそうだ。\nkiichi.t: その年、村に、身もとの知れん者が、2人ふえた。……昔話だと、思っていたがな。\n@fact t_kiichi_1927\n## q_haru_x1\nharu.n: おそれいります。……いま、何とおっしゃいましたか。\n## q_haru_x2\nharu.s: お客さま。ゆっくりで、よろしゅうございますよ。\n## q_haru_x3\nharu.t: ……あいにく、わたくしには、分かりかねるお話でございます。\n## q_haru_who\nharu.n: そのお名前は、宿帳に、ございません。\n## q_haru_what\nharu.u: まあ。……めずらしい物を、お持ちでございますね。\n## q_haru_hello\nharu.s: ようこそ、おいでくださいました。お足もとの悪い中を。\n## q_haru_self\nharu.n: 朽木ハルでございます。主人を亡くしてから、15年、この宿を守っております。\n## q_haru_alibi\nharu.n: わたくしは、宿をあけません。5日前の晩も、帳場におりました。\n## q_haru_bye\nharu.s: お気をつけて、お帰りくださいまし。……お帰りの道は、遠うございましょう。\n## q_haru_help\nharu.n: お聞きになりたい事が、ございましたら。……5日前のお客さまの事でしたら、少しは、お話しできます。\n## q_haru_rude\nharu.k: ……お客さまでも、それは、いただけません。\n## q_haru_p_tae\nharu.s: 多恵さんは、腕のいい産婆でございます。うちの離れを、お産に貸しております。\n## q_haru_p_kiichi\nharu.n: 駐在の三雲さま。まじめな方でございます。……あなたさまと、同じお名前ですのね。\n## q_haru_p_soichiro\nharu.t: 鷹取の親方は、うちのお得意さまでございます。……人夫の方が、少々、荒うございますが。\n## q_haru_l_cave\nharu.n: 雨穴でございますか。……あのお客さまは、あくる朝、あちらへ歩いていかれました。それきりで、ございます。\n## q_haru_box\nharu.k: 箱は、たしかに、おあずかりしております。……3つの問いに、お答えいただいてからで、ございます。\n## q_haru_tag\nharu.n: 「匡」は、亡くなった主人の名でございます。あの札は、形見でして。\nharu.s: あのお客さまは、札をなでて、おっしゃいました。「この名に、33年、世話になりました」と。……何の事やら。\n@fact t_haru_tag\n## q_tae_x1\ntae.t: え？　ごめんなさい、聞きそびれました。もう1度、言ってくださる？\n## q_tae_x2\ntae.s: 旅の方は、おもしろい事を言うのね。……どういう事かしら。\n## q_tae_x3\ntae.n: ……お産の事なら、何でも答えられるんですけど。\n## q_tae_who\ntae.n: 知らないお名前ね。この町で、私が取り上げた子なら、全部覚えているんですけど。\n## q_tae_what\ntae.u: あら。……何かしら、それ。きれいな物ね。\n## q_tae_hello\ntae.s: こんにちは。……あなた、いい顔色ね。お母さんが、じょうぶに産んだのよ。\n## q_tae_self\ntae.n: 汐見多恵。30です。この町の産婆。亭主は、おととし、山の事故で亡くしました。\n## q_tae_alibi\ntae.n: 5日前の晩？　ここに、いましたよ。ぬれたお客さんの腕を、ふいてあげたの。\n## q_tae_bye\ntae.s: じゃあね。……体を、冷やさないようにね。\n## q_tae_help\ntae.n: そうね……。5日前のお客さんの事か、きのう拾った男の子の事。話せるのは、それくらいよ。\n## q_tae_rude\ntae.a: まあ。……そんな口をきく子は、私が取り上げた中には、いませんよ。\n## q_tae_p_haru\ntae.s: ハルさんは、こわい顔をしているけれど、情のあつい人よ。あの子の事も、だまって置いてくれている。\n## q_tae_p_kiichi\ntae.n: 駐在さんにも、あの子の事は、届けました。「親が見つかるまで、たのむ」って。\n## q_tae_p_soichiro\ntae.t: 鷹取の親方ね。……奥さんのお産は、私が見ました。坊ちゃんは助かったけれど、奥さんは、だめだった。\n## q_tae_p_seiji\ntae.s: 征二坊ちゃんは、私が取り上げたの。母親を知らない子でね。……さびしい目を、しているでしょう。\n## q_tae_l_cave\ntae.n: 雨穴？　このところ、鳴るのよ。ばあさまたちは、「穴が鳴る年は、子がふえる」なんて言うわ。\n## q_soichiro_x1\nsoichiro.t: 何だって？　発破の音で、耳がばかになっていてな。大きな声で、言ってくれ。\n## q_soichiro_x2\nsoichiro.n: 見物の衆。聞きたい事は、手みじかにな。日が暮れる。\n## q_soichiro_x3\nsoichiro.s: ……あんた、役人か？　回りくどい物の言い方だ。\n## q_soichiro_who\nsoichiro.n: 知らんな。うちの人夫には、おらん名だ。\n## q_soichiro_what\nsoichiro.u: 何だ、その細工は。……どこの工場の物だ。\n## q_soichiro_hello\nsoichiro.s: おう。よく来た。……足もとを見て歩けよ。穴だらけだ。\n## q_soichiro_self\nsoichiro.n: 鷹取宗一郎。45だ。鷹取組の、親方をやっている。この山に、発電所を建てる。\n## q_soichiro_alibi\nsoichiro.n: おれは、朝から晩まで、ここだ。人夫に聞いてみな。\n## q_soichiro_bye\nsoichiro.n: おう。気をつけて帰れ。\n## q_soichiro_help\nsoichiro.n: 聞く事が無いなら、試掘坑の話でも、してやろうか。妙な事が、あってな。\n## q_soichiro_rude\nsoichiro.a: ……ここは、おれの現場だ。口に気をつけな。\n## q_soichiro_p_seiji\nsoichiro.s: 倅か。そこらで、遊んでいるだろう。母親を、産んだ年に亡くしてな。……いずれ、ここを、あれにつがせる。\n## q_soichiro_p_kiichi\nsoichiro.n: 駐在か。まじめな男だ。人夫のけんかを、よくおさめてくれる。\n## q_soichiro_p_haru\nsoichiro.n: 朽木屋の女将か。うちの作業着を、あずけてある。客に貸す分だ。\n## q_soichiro_p_guest\nsoichiro.n: 宿の客？　知らんな。……うちの作業着を着た年寄りが、森を歩いていた、とは聞いたが。\n## q_soichiro_t_watch\nsoichiro.s: 腕時計か。おれのは、舶来だ。……倅が、ほしがってな。大きくなったら、やると言ってある。\n## q_seiji10_x1\nseiji10.t: おじさん、なに言ってるの？　わかんないよ。\n## q_seiji10_x2\nseiji10.n: もういっぺん、言って。\n## q_seiji10_x3\nseiji10.s: へんなおじさん。……でも、おもしろいや。\n## q_seiji10_who\nseiji10.n: しらない。そんな人、飯場にいないよ。\n## q_seiji10_what\nseiji10.u: なにそれ！　すげえ。さわっていい？\n## q_seiji10_hello\nseiji10.s: こんちは。……おじさん、どこから来たの。\n## q_seiji10_self\nseiji10.g: 鷹取征二。10さい。4年生だよ。\n## q_seiji10_alibi\nseiji10.n: ぼく？　ずっと、ここで遊んでるよ。学校がおわったら、毎日。\n## q_seiji10_bye\nseiji10.s: またね、おじさん。……また来る？\n## q_seiji10_help\nseiji10.n: 話すこと、ないの？　じゃあ、ぼくの、ゆめの話、聞く？\n## q_seiji10_rude\nseiji10.a: なんだよ。とうちゃんに、言うぞ。\n## q_seiji10_p_soichiro\nseiji10.s: とうちゃんは、すごいんだ。山を、ダイナマイトで、どかんって。\n## q_seiji10_p_mother\nseiji10.d: かあちゃんは、いない。ぼくを産んで、しんだって。……しゃしんも、1まいしか、ないんだ。\n## q_seiji10_l_cave\nseiji10.p: あまあな？　あそこ、このごろ、うなるんだ。……とうちゃんには、ないしょだけど、ぼく、毎日、見に行ってる。\n";
