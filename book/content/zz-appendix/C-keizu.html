<p class="no-indent"><span class="yogo-hl">系図や王朝表は、政治の継起を追うには便利だが、それだけを見ると社会の変化が視野から落ちる。</span>本書が第30章で宋代の経済的な変化を、第39章で疫病を、第51章で産業革命を扱った際、いずれも王朝や政権の交代とは異なる周期で進行していた。<em>この資料は、他の巻末資料および本文と併せて用いられたい。</em></p>
